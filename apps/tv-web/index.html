<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Portico</title>
<style>html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220}
/* The kit draws every focus look itself (the ring and glow of kit/controls/Focusable). */
*:focus{outline:none}
/* A TV draws no scroll bars: the remote scrolls by moving focus. */
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}</style>
</head>
<body><div id="root"></div><script type="module" src="./src/index.tsx"></script></body>
</html>
