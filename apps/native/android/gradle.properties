org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true

# Every architecture Portico ships for: 64-bit phones and televisions, 32-bit Fire TV sticks, and
# the x86 emulators. A local build for one emulator is much faster with
# -PreactNativeArchitectures=arm64-v8a (or x86_64).
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# The app's native modules are bridge modules and view managers (as on Apple); they run through
# the New Architecture's interop layer.
newArchEnabled=true
hermesEnabled=true

# Content draws behind the system bars on every Android version (Android 15 enforces it anyway);
# the shared screens pad by the safe-area insets, as they do on iPhone.
edgeToEdgeEnabled=true

# Debug builds load JavaScript from Metro on this port (`npm start`).
reactNativeDevServerPort=19424

# Optional build-time values, the counterparts of the Apple build settings of the same meaning:
#   -PporticoHostedUrl=https://…          Portico Account origin (PORTICO_HOSTED_URL)
#   -PporticoCastApplicationId=…           Google Cast receiver (PORTICO_CAST_APPLICATION_ID)
