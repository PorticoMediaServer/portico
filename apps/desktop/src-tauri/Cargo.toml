[package]
name = "portico-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[features]
# Serve the built web app from inside the binary. Without it Tauri loads devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = "=2.12.5"
tauri-plugin-opener = "2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ureq = "=3.5.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build = "=2.7.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
