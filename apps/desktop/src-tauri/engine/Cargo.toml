[package]
name = "portico-desktop-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[dependencies]
portico-desktop-storage = { path = "../storage" }
libloading = "=0.9.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[profile.dev]
debug = 0
incremental = false
