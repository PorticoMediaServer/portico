appId: tv.getportico.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Use a local server'
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: 'Use a local server'
- tapOn: 'Server address'
- inputText: ${SERVER_ADDRESS}
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Username'
    timeout: 60000
- hideKeyboard
- scrollUntilVisible:
    element:
      id: accounts-dev-test-owner
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02-local-sign-in
- tapOn:
    id: accounts-dev-test-owner
- extendedWaitUntil:
    visible:
      id: native-home
    timeout: 60000
- takeScreenshot: 03-home
- tapOn: 'Search'
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 60000
- takeScreenshot: 04-search-landing
- tapOn:
    id: search-input
- inputText: Arrival
- extendedWaitUntil:
    visible:
      id: search-top-result
    timeout: 60000
- hideKeyboard
- takeScreenshot: 05-search-results
- tapOn:
    id: search-top-result
- extendedWaitUntil:
    visible: 'Play'
    timeout: 60000
- takeScreenshot: 06-detail
- tapOn: 'Play'
- extendedWaitUntil:
    visible:
      id: watch-host
    timeout: 60000
- extendedWaitUntil:
    visible: '0:(0[1-9]|[1-9][0-9])'
    timeout: 30000
- takeScreenshot: 07-playback
