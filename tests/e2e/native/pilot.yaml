appId: tv.getportico.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Use a local server'
    timeout: 60000
- takeScreenshot: 01-welcome
- tapOn: 'Use a local server'
- tapOn: 'Server address'
- inputText: ${SERVER_ADDRESS}
- tapOn: 'Continue'
- extendedWaitUntil:
    visible: 'Username'
    timeout: 60000
- hideKeyboard
- scrollUntilVisible:
    element:
      id: accounts-dev-test-owner
    direction: DOWN
    timeout: 60000
- takeScreenshot: 02-local-sign-in
- tapOn:
    id: accounts-dev-test-owner
- extendedWaitUntil:
    visible:
      id: native-home
    timeout: 60000
- takeScreenshot: 03-home
- tapOn: 'Play'
- extendedWaitUntil:
    visible:
      id: watch-host
    timeout: 60000
- extendedWaitUntil:
    visible: '0:0[1-9]'
    timeout: 30000
- takeScreenshot: 04-playback
