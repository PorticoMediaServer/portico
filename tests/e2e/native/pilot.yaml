appId: tv.getportico.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Use a local server'
    timeout: 60000
- takeScreenshot: ${E2E_ARTIFACTS}/01-welcome
- tapOn: 'Use a local server'
- tapOn: 'Server address'
- inputText: ${SERVER_ADDRESS}
- tapOn: 'Continue'
- extendedWaitUntil:
    visible:
      id: accounts-dev-test-owner
    timeout: 60000
- takeScreenshot: ${E2E_ARTIFACTS}/02-local-sign-in
- tapOn:
    id: accounts-dev-test-owner
- extendedWaitUntil:
    visible:
      id: native-home
    timeout: 60000
- takeScreenshot: ${E2E_ARTIFACTS}/03-home
- tapOn: 'Play'
- extendedWaitUntil:
    visible:
      id: watch-host
    timeout: 60000
- extendedWaitUntil:
    visible: '0:0[1-9]'
    timeout: 30000
- takeScreenshot: ${E2E_ARTIFACTS}/04-playback
