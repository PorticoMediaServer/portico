<!doctype html><meta charset="utf-8"><title>Audio engine conformance</title>
<pre id="result">Running</pre>
<script type="module">
import {runBrowserAudioChecks} from './browser-audio-engine.ts';
globalThis.audioEngineChecks = runBrowserAudioChecks().then(result => {
  document.querySelector('#result').textContent = JSON.stringify(result);
  if (location.search.includes('report')) void fetch('/__audio_checks',{method:'POST',body:JSON.stringify(result)});
  return result;
}, error => {
  const result = {error: String(error), stack: error.stack};
  document.querySelector('#result').textContent = JSON.stringify(result);
  if (location.search.includes('report')) void fetch('/__audio_checks',{method:'POST',body:JSON.stringify(result)});
  return result;
});
</script>
