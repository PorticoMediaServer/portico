services:
  portico:
    image: ghcr.io/porticomediaserver/portico-server:latest
    restart: unless-stopped
    environment:
      PORTICO_PLATFORM: synology
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-0002}"
      TZ: "${TZ:-Etc/UTC}"
    ports: ["32500:32500"]
    # Keep /transcode on disk for fallback and spill. See INSTALLING.md for sizing.
    tmpfs:
      - /memory-transcode:rw,noexec,nosuid,nodev,size=512m,nr_inodes=8192,mode=1777
    volumes:
      - /volume1/docker/portico/config:/config
      - /volume1/docker/portico/transcode:/transcode
      - /volume1/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
