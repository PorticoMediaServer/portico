[extend]
useDefault = true

# The generic API-key rule reads this comma-separated controller assignment as
# a key. Match only that expression at its source path, not the file. Commits
# before the 28 Oct 2026 rename of web-next to web carry it at the old path.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Account move controller variable assignment"
condition = "AND"
paths = ['''^web(?:-next)?/src/platform/account-entry\.ts$''']
regexTarget = "match"
regexes = ['''^this\.api,proof=this\.moveProof;$''']

# Earlier commits of the regression fixture quote that same non-secret code.
# Keep the exception on that one literal line; real keys in the helper still fail.
[[rules.allowlists]]
description = "Literal account assignment in its scanner regression fixture"
condition = "AND"
paths = ['''^scripts/check-gitleaks-config\.py$''']
regexTarget = "line"
regexes = ['''^\s*expression = "this\.api,proof=this\.moveProof;"$''']

# The sealing fixture in the Portico Services trust test data, copied from portico-internal
# (hosted-services/hosted-next/trust/testdata). Made by the old service's code from a fixed
# test phrase; it seals nothing real. Exempt only this exact value on this one line of that
# file: any other key there, or this one anywhere else, still fails.
[[rules.allowlists]]
description = "Fixed sealing-key fixture in the copied Portico Services trust test data"
condition = "AND"
paths = ['''^server-next/internal/hosted/trust/testdata/old_service\.json$''']
regexTarget = "line"
regexes = ['''^\s*"sealKey": "QtCssvBYZS87DqrTRRJbTm-Ju7EO4zZzfAOACKNE_AU",?$''']

# The rebuilt server's copy of Portico's built-in TMDB read token (the same public application
# credential; see THIRD-PARTY-NOTICES.md). The generic
# rule reads its first line as a key. Exempt only that exact match in that file: any other key
# there, or this one anywhere else, still fails.
[[rules.allowlists]]
description = "Built-in TMDB read token in the rebuilt server"
condition = "AND"
paths = ['''^server-next/internal/metadata/tmdb/project\.go$''']
regexTarget = "match"
regexes = ['''^ProjectToken = "eyJhbGciOiJIUzI1NiJ9\."$''']

# Portico ships built-in application credentials for its metadata providers on
# purpose (see THIRD-PARTY-NOTICES.md). They identify Portico to TMDB and
# TheTVDB and are not user or server secrets.

# Example tokens in the API guide, idempotency and request keys in tests, and
# SQL that matches the generic key pattern.
[[allowlists]]
description = "Documentation examples, test request keys and SQL"
paths = [
  '''.*_test\.go''',
]
