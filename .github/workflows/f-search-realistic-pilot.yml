name: F realistic search corpus pilot
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
env:
  F_SEARCH_PROBE: ''
  F_NEW_SERVER: ''
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F realistic search pilot')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply measurement only and already merged application
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/search.patch").write_bytes(base64.b64decode(os.environ["F_SEARCH_PROBE"])); pathlib.Path("/tmp/app.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/search.patch /tmp/app.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/search.patch
          git apply /tmp/search.patch
          git apply /tmp/app.patch
      - name: Vet all three targets before publishing test files
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'search-realistic-vet-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  pilot:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply measurement and merged application
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/search.patch").write_bytes(base64.b64decode(os.environ["F_SEARCH_PROBE"])); pathlib.Path("/tmp/app.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          git apply /tmp/search.patch
          git apply /tmp/app.patch
      - name: Build 1k production search documents then isolate service and native costs
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '1000'
          PORTICO_HOME_SOURCE_FILMS: '1'
          PORTICO_SEARCH_PROFILE_ITEMS: '1000'
          PORTICO_SEARCH_REALISTIC: '1'
          PORTICO_SEARCH_WORD_SOURCE: '${{ runner.temp }}/word-frequency.txt'
          PORTICO_SEARCH_POS_SOURCE: '${{ runner.temp }}/wordnet.zip'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          python3 -c 'import pathlib,urllib.request,os; pathlib.Path(os.environ["PORTICO_SEARCH_WORD_SOURCE"]).write_bytes(urllib.request.urlopen("https://raw.githubusercontent.com/hermitdave/FrequencyWords/525f9b560de45753a5ea01069454e72e9aa541c6/content/2018/en/en_50k.txt",timeout=30).read())'
          python3 -c 'import pathlib,urllib.request,os,zipfile,io,hashlib; raw=urllib.request.urlopen("https://raw.githubusercontent.com/nltk/nltk_data/550b6625bcef1f2abff2ff770a5a0d272c9c6b2a/packages/corpora/wordnet.zip",timeout=60).read(); assert hashlib.sha256(raw).hexdigest()=="cbda5ea6eef7f36a97a43d4a75f85e07fccbb4f23657d27b4ccbc93e2646ab59"; pathlib.Path(os.environ["PORTICO_SEARCH_POS_SOURCE"]).write_bytes(raw); pathlib.Path(os.environ["PORTICO_SCALE_REPORT"],"WordNet-LICENSE.txt").write_bytes(zipfile.ZipFile(io.BytesIO(raw)).read("wordnet/LICENSE"))'
          go test ./internal/catalog/scalebench -run '^TestHomeSourceSeedMeasurement$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/facts.log" 2>&1
          go test ./internal/compactcatalog -run '^TestSearchProfileSeed$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/search-seed.log" 2>&1
          go test ./internal/catalog -run '^TestSearchNativeProfileMeasurement$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/profile.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: search-realistic-pilot, path: '${{ runner.temp }}/reports', retention-days: 7}
