name: Phase 0 native hold extended repayment
on:
  push:
    branches: ['schema-v1/p0-q-native-scale']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-native-scale.yml']
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
        case:
          - {mode: tune, n: 100000, config: noauto-b1}
          - {mode: tune, n: 100000, config: noauto-normal-b1}
          - {mode: tune, n: 100000, config: noauto-crisis8-b1}
          - {mode: tune, n: 100000, config: noauto-merge4-b1}
          - {mode: tune, n: 400000, config: noauto-b8}
          - {mode: tune, n: 1000000, config: noauto-b8}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Measure
        env:
          MODE: ${{ matrix.case.mode }}
          N: ${{ matrix.case.n }}
          CONFIG: ${{ matrix.case.config }}
          PROFILE: ${{ matrix.profile }}
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-q-${{ matrix.case.mode }}-${{ matrix.profile }}-${{ matrix.case.n }}-${{ matrix.case.config }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
