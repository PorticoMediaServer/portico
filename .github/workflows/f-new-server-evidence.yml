name: F New on server evidence
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df7}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply unpublished exact candidate
        env:
          F_PATCH: ''
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_PATCH"]))'
          sha256sum /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/new-server.patch
          git apply /tmp/new-server.patch
      - name: Cross-vet application and test files before publication
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Home, recommendation and current visibility regressions
        if: matrix.os == 'linux'
        working-directory: server
        run: go test ./internal/catalog -run 'Home|RecentlyAdded|Recommendation' -short -count=1 -v -timeout=12m > "$RUNNER_TEMP/reports/home-tests.log" 2>&1
      - name: New on server race controls
        if: matrix.os == 'linux'
        working-directory: server
        run: go test -race ./internal/catalog -run '^TestHomeNewServer' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/home-race.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'new-server-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
