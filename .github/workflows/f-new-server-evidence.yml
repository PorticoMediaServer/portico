name: F New on server evidence
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
env:
  F_CANDIDATE: ''
  F_PROBE: ''
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply unpublished exact candidate
        env:
          F_PATCH: ''
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_PATCH"]))'
          sha256sum /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/new-server.patch
          git apply /tmp/new-server.patch
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/new-server-probe.patch").write_bytes(base64.b64decode(os.environ["F_PROBE"]))'
          git apply /tmp/new-server-probe.patch
      - name: Cross-vet application and test files before publication
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Home, recommendation and current visibility regressions
        if: matrix.os == 'linux'
        working-directory: server
        run: go test ./internal/catalog -run 'Home|RecentlyAdded|Recommendation' -short -count=1 -v -timeout=12m > "$RUNNER_TEMP/reports/home-tests.log" 2>&1
      - name: Restricted recent shelf completeness
        if: matrix.os == 'linux'
        working-directory: server
        run: go test ./internal/catalog -run '^TestRestrictedRecentlyAdded' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/restricted.log" 2>&1
      - name: New on server race controls
        if: matrix.os == 'linux'
        working-directory: server
        run: go test -race ./internal/catalog -run '^TestHomeNewServer' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/home-race.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'new-server-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  pilot:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply validated measurement extension
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/new-server-probe.patch").write_bytes(base64.b64decode(os.environ["F_PROBE"]))'
          git apply /tmp/new-server-probe.patch
      - name: Seed 1k positive control before larger curves
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '1000'
          PORTICO_HOME_SOURCE_FILMS: '1'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/catalog/scalebench -run '^TestHomeSourceSeedMeasurement$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/seed.log" 2>&1
      - name: Paired small positive control
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '1000'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          go test ./internal/catalog -run '^TestNewServerGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/before.log" 2>&1
          mv "$RUNNER_TEMP/reports/new-server.json" "$RUNNER_TEMP/reports/before.json"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_CANDIDATE"]))'
          git apply /tmp/new-server.patch
          PORTICO_NEW_SERVER_CAPPED=1 go test ./internal/catalog -run '^TestNewServerGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/after.log" 2>&1
          mv "$RUNNER_TEMP/reports/new-server.json" "$RUNNER_TEMP/reports/after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: new-server-pilot, path: '${{ runner.temp }}/reports', retention-days: 7}
  curves:
    needs: pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore the validated film shape and probe
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import os,base64,pathlib; pathlib.Path("/tmp/new-server-probe.patch").write_bytes(base64.b64decode(os.environ["F_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_CANDIDATE"]))'
          sha256sum /tmp/new-server-probe.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/new-server-probe.patch
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: seeds
        with:
          path: '${{ runner.temp }}/seeds/new-server-films-*.sqlite'
          key: F-new-server-films-${{ matrix.items }}-${{ hashFiles('server/internal/catalog/scalebench/home_source_seed_test.go', 'server/internal/catalog/scalebench/bulk_reference.go', 'server/internal/persistence/migrations/**') }}
      - name: Generate focused facts and serving rows once
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '${{ matrix.items }}'
          PORTICO_HOME_SOURCE_FILMS: '1'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/catalog/scalebench -run '^TestHomeSourceSeedMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/seed.log" 2>&1
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: steps.seeds.outputs.cache-hit != 'true'
        with:
          path: '${{ runner.temp }}/seeds/new-server-films-*.sqlite'
          key: '${{ steps.seeds.outputs.cache-primary-key }}'
      - name: Paired source, exact total and page from the same cached database
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          go test ./internal/catalog -run '^TestNewServerGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/before.log" 2>&1
          mv "$RUNNER_TEMP/reports/new-server.json" "$RUNNER_TEMP/reports/before.json"
          git apply /tmp/new-server.patch
          PORTICO_NEW_SERVER_CAPPED=1 go test ./internal/catalog -run '^TestNewServerGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/after.log" 2>&1
          mv "$RUNNER_TEMP/reports/new-server.json" "$RUNNER_TEMP/reports/after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'new-server-curves-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
