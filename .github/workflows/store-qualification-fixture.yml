name: Store qualification population artifact
# Population transport only. No timing, profiling, adoption or release authority.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Pushed branch or full 40-character source SHA
        required: true
        type: string
      purpose:
        description: Qualification requires reviewed code already merged into main
        type: choice
        options: [preview, qualification]
        default: preview
      seed:
        description: Unsigned 32-bit population seed (zero is valid)
        type: string
        default: '0'
      residents:
        description: Resident movies (1..1000000)
        type: string
        default: '1000000'
      timeout_minutes:
        description: Export deadline in minutes (1..90)
        type: string
        default: '60'
permissions:
  contents: read
jobs:
  population:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: tools, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: source, persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version: '1.26.10', cache: false}
      - name: Check producer protocol controls
        run: python3 -B -m unittest discover -s tools/ci -p test_qual_fixture.py
      - name: Produce one source-bound population
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_PURPOSE: ${{ inputs.purpose }}
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_RESIDENTS: ${{ inputs.residents }}
          INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: python3 -B tools/ci/qual_fixture.py produce --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/qual-fixture" --work "$RUNNER_TEMP/qual-fixture-work"
      - name: Preserve a failure receipt if setup did not reach the producer
        if: always()
        run: python3 -B tools/ci/qual_fixture.py failure-receipt --output "$RUNNER_TEMP/qual-fixture"
      - name: Retain logs and receipt, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qual-population-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qual-fixture/report/
          if-no-files-found: error
          retention-days: 14
      - name: Publish validated immutable image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qual-population-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qual-fixture/population.sqlite
            ${{ runner.temp }}/qual-fixture/population.json
            ${{ runner.temp }}/qual-fixture/report/receipt.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 14
