name: Lane focused tests and captures
# Manual, disposable standard runners only. Never a release/qualification entry.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Pushed branch or full 40-character commit SHA
        required: true
        type: string
      packages:
        description: Module-relative packages (space separated)
        default: ./internal/store/qual
        type: string
      run:
        description: Go -run expression (subtest filters supported)
        default: .
        type: string
      tests:
        description: Optional exact top-level test names (space separated)
        type: string
      race:
        description: Enable the race detector
        default: false
        type: boolean
      count:
        description: Go -count (1..100)
        default: '1'
        type: string
      shards:
        description: auto splits parents across runners; or 1..64
        default: auto
        type: string
      runner:
        description: Standard runner OS
        default: ubuntu-24.04
        type: choice
        options: [ubuntu-24.04, macos-15]
      module:
        description: Go module
        default: server
        type: choice
        options: [server, apikit]
      mode:
        description: Tests, deliberate capture, or fixed functional harnesses
        default: tests
        type: choice
        options: [tests, capture, harness]
      targets:
        description: Capture/harness names from ci/LANE-FOCUSED.md (space separated)
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      runner: ${{ steps.plan.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: tools, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: source, persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: source/server/go.mod, cache: false}
      - name: Check the trusted planner controls
        env:
          GOMAXPROCS: '2'
        run: |
          python3 -m unittest discover -s tools/ci -p test_lane_focused.py
          go test tools/ci/lane_inventory.go tools/ci/lane_inventory_test.go
      - name: Validate inputs, pin source and split test parents
        id: plan
        env:
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_PACKAGES: ${{ inputs.packages }}
          INPUT_RUN: ${{ inputs.run }}
          INPUT_TESTS: ${{ inputs.tests }}
          INPUT_RACE: ${{ inputs.race }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_SHARDS: ${{ inputs.shards }}
          INPUT_RUNNER: ${{ inputs.runner }}
          INPUT_MODULE: ${{ inputs.module }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TARGETS: ${{ inputs.targets }}
        run: python3 tools/ci/lane_focused.py plan --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/lane-plan"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lane-plan
          path: ${{ runner.temp }}/lane-plan/plan.json
          if-no-files-found: warn
          retention-days: 14
  tests:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: tools, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: source
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: lane-plan, path: plan}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: source/server/go.mod, cache: false}
      - name: Run assigned tests or captures
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: python3 tools/ci/lane_focused.py worker --source "$GITHUB_WORKSPACE/source" --plan plan/plan.json --index "$SHARD_INDEX" --output "$RUNNER_TEMP/lane-result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lane-shard-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/lane-result/*.json
            ${{ runner.temp }}/lane-result/*.jsonl
            ${{ runner.temp }}/lane-result/*.stderr
            ${{ runner.temp }}/lane-result/evidence/**
            ${{ runner.temp }}/lane-result/evidence-custom/**
          if-no-files-found: error
          retention-days: 14
  summary:
    if: always() && needs.plan.result == 'success'
    needs: [plan, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: tools, persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: lane-plan, path: plan}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true # The aggregator explicitly fails missing receipts.
        with: {pattern: lane-shard-*, path: results}
      - name: Combine every shard, retaining failures and missing receipts
        run: python3 tools/ci/lane_focused.py summary --plan plan/plan.json --results results --output "$RUNNER_TEMP/lane-summary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lane-summary
          path: ${{ runner.temp }}/lane-summary
          if-no-files-found: error
          retention-days: 14
