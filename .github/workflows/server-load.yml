name: Inventory producer benchmark (branch qualification)
# Temporary qualification workflow; keep the production load workflow on main.
on:
  workflow_dispatch:
    inputs:
      objects:
        description: Normalized inventory objects (1000 rehearsal before 1000000)
        type: choice
        options: ['1000', '1000000']
        default: '1000'
permissions:
  contents: read
concurrency:
  group: inventory-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Qualify the actual unchanged lookup and page writer
        working-directory: server
        env:
          OBJECTS: ${{ inputs.objects }}
        run: |
          set -o pipefail
          go test -p 1 -run '^$' -bench "^BenchmarkInventoryUnchangedDatabasePage$/${OBJECTS}$" -benchtime=1x -count=1 -timeout=65m ./internal/catalog | tee "$RUNNER_TEMP/inventory-benchmark.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inventory-benchmark
          path: ${{ runner.temp }}/inventory-benchmark.log
          if-no-files-found: error
          retention-days: 14
