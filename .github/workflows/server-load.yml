name: Inventory producer benchmark (branch qualification)
# Temporary qualification workflow; keep the production load workflow on main.
on:
  workflow_dispatch:
    inputs:
      objects:
        description: Normalized inventory objects (1000 rehearsal before 1000000)
        type: choice
        options: ['1000', '1000000']
        default: '1000'
permissions:
  contents: read
concurrency:
  group: inventory-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Qualify the actual unchanged lookup and page writer
        working-directory: server
        env:
          OBJECTS: ${{ inputs.objects }}
        run: |
          set -o pipefail
          go test -p 1 -run '^$' -bench "^BenchmarkInventoryUnchangedDatabasePage$/${OBJECTS}$" -benchtime=1x -count=1 -timeout=65m ./internal/catalog | tee "$RUNNER_TEMP/inventory-benchmark.log"
      - name: A forced table scan must fail the lookup work ceiling
        working-directory: server
        run: |
          python3 - <<'CONTROL'
          from pathlib import Path
          p = Path('internal/catalog/inventory.go')
          s = p.read_text()
          old = 'FROM inventory_objects WHERE source_id=? AND relative_path=? AND retired=0`'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'FROM inventory_objects NOT INDEXED WHERE source_id=? AND relative_path=? AND retired=0`'))
          CONTROL
          set +e
          go test -p 1 -run '^$' -bench '^BenchmarkInventoryUnchangedDatabasePage$/^1000$/lookup128$' -benchtime=1x -count=1 -v -timeout=10m ./internal/catalog > "$RUNNER_TEMP/inventory-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/inventory-negative.log"
          test "$result" -ne 0
          python3 -c 'import os,pathlib; assert "unchanged inventory exceeded its per-object work ceiling" in pathlib.Path(os.environ["RUNNER_TEMP"], "inventory-negative.log").read_text()'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inventory-benchmark
          path: |
            ${{ runner.temp }}/inventory-benchmark.log
            ${{ runner.temp }}/inventory-negative.log
          if-no-files-found: error
          retention-days: 14
