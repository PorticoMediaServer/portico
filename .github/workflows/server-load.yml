name: Schema v1 P0-S scale research (never merge)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'churn or growth (pure growing initial scan)'
        default: churn
      ddl:
        description: 'Pinned full schema basename under research/p0-s'
        default: full-291ab3.sql
      profile:
        description: 'both, standard or legacy8'
        default: both
      checkpoint_ms:
        description: 'both,50or250ms minimum checkpoint start spacing'
        default: both
      size:
        description: 'Initial residents: 400000 or 1000000'
        default: '1000000'
permissions:
  contents: read
jobs:
  scale:
    if: ${{ inputs.mode != 'sweep' && inputs.mode != 'fanout' && inputs.mode != 'supported' && inputs.mode != 'full' && inputs.mode != 'envelope' && inputs.mode != 'envelope2' && inputs.mode != 'selected' && inputs.mode != 'fullpair' && inputs.mode != 'widthpair' && inputs.mode != 'normal' && inputs.mode != 'facets' && inputs.mode != 'frames' && inputs.mode != 'attribution' && inputs.mode != 'caps' && inputs.mode != 'primitives' && inputs.mode != 'decision' && inputs.mode != 'resource' && inputs.mode != 'iodiag' && inputs.mode != 'bounded' && inputs.mode != 'cue' && inputs.mode != 'enrichment' && inputs.mode != 'openpair' && inputs.mode != 'enrichstage' }}
    runs-on: ubuntu-24.04
    env:
      MODE: ${{ inputs.mode || 'churn' }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        size: [100000, 400000, 1000000]
        profile: [standard, legacy8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Record checkout and filesystem
        run: |
          mkdir -p "$RUNNER_TEMP/p0-s"
          git rev-parse HEAD > "$RUNNER_TEMP/p0-s/source.txt"
          git archive HEAD | sha256sum >> "$RUNNER_TEMP/p0-s/source.txt"
          sha256sum research/p0-s/* >> "$RUNNER_TEMP/p0-s/source.txt"
          df -h
      - name: Seed under selected hardware constraint
        run: bash research/p0-s/launch.sh "$RUNNER_TEMP/p0-s" '${{ matrix.size }}' '${{ matrix.profile }}' seed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-s-seed-${{ matrix.size }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/p0-s/**/*.json
            ${{ runner.temp }}/p0-s/**/*.pprof
            ${{ runner.temp }}/p0-s/**/*.strace
            ${{ runner.temp }}/p0-s/*.txt
          retention-days: 14
      - name: Browse facets search writes opens memory
        run: bash research/p0-s/launch.sh "$RUNNER_TEMP/p0-s" '${{ matrix.size }}' '${{ matrix.profile }}' probe
      - name: Exclude disposable databases even after failure
        if: always()
        run: sudo python3 research/p0-s/cleanup.py "$RUNNER_TEMP/p0-s"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-s-${{ matrix.size }}-${{ matrix.profile }}
          path: '${{ runner.temp }}/p0-s'
          retention-days: 14

  adversarial:
    if: ${{ inputs.mode == 'sweep' || inputs.mode == 'fanout' || inputs.mode == 'supported' || inputs.mode == 'envelope' || inputs.mode == 'envelope2' || inputs.mode == 'selected' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, legacy8]
        repetition: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Record immutable research pin
        run: |
          mkdir -p "$RUNNER_TEMP/p0-s"
          git rev-parse HEAD > "$RUNNER_TEMP/p0-s/source.txt"
          git archive HEAD | sha256sum >> "$RUNNER_TEMP/p0-s/source.txt"
      - name: Repeated append sweep or scalar fanout
        run: bash research/p0-s/launch.sh "$RUNNER_TEMP/p0-s" 0 '${{ matrix.profile }}' "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-s-${{ inputs.mode }}-${{ matrix.profile }}-rep${{ matrix.repetition }}
          path: |
            ${{ runner.temp }}/p0-s/**/*.json
            ${{ runner.temp }}/p0-s/**/*.pprof
            ${{ runner.temp }}/p0-s/**/*.strace
            ${{ runner.temp }}/p0-s/*.txt
          retention-days: 14

  full:
    if: ${{ inputs.mode == 'full' || inputs.mode == 'fullpair' || inputs.mode == 'widthpair' || inputs.mode == 'normal' || inputs.mode == 'facets' || inputs.mode == 'frames' || inputs.mode == 'attribution' || inputs.mode == 'caps' || inputs.mode == 'primitives' || inputs.mode == 'decision' || inputs.mode == 'resource' || inputs.mode == 'iodiag' || inputs.mode == 'bounded' || inputs.mode == 'cue' || inputs.mode == 'enrichment' || inputs.mode == 'openpair' || inputs.mode == 'enrichstage' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      TARGET_DDL: ${{ inputs.ddl || 'full-291ab3.sql' }}
      MODE: ${{ inputs.mode }}
      CHECKPOINT_MS: ${{ matrix.checkpoint_ms }}
    strategy:
      fail-fast: false
      matrix:
        checkpoint_ms: ${{ fromJSON(inputs.mode == 'bounded' && (inputs.checkpoint_ms == '250' && '[250]' || inputs.checkpoint_ms == '50' && '[50]' || '[50,250]') || ((inputs.mode == 'enrichstage' || inputs.mode == 'enrichment' || inputs.mode == 'primitives' || inputs.mode == 'cue') && '[50]' || '[100]')) }}
        profile: ${{ fromJSON(inputs.profile == 'legacy8' && '["legacy8"]' || inputs.profile == 'standard' && '["standard"]' || '["standard","legacy8"]') }}
        repetition: ${{ fromJSON((inputs.mode == 'normal' || inputs.mode == 'frames' || inputs.mode == 'attribution' || inputs.mode == 'caps' || inputs.mode == 'primitives' || inputs.mode == 'decision' || inputs.mode == 'bounded' || inputs.mode == 'cue' || inputs.mode == 'enrichment' || inputs.mode == 'openpair' || inputs.mode == 'enrichstage') && '[1,2,3]' || '[1]') }}
        size: ${{ fromJSON((inputs.mode == 'facets' || inputs.mode == 'bounded') && '[400000,1000000]' || inputs.size == '400000' && '[400000]' || '[1000000]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Build bundled-engine companion through compiler overlay
        run: |
          mkdir -p "$RUNNER_TEMP/p0-s"
          git rev-parse HEAD > "$RUNNER_TEMP/p0-s/source.txt"
          git archive HEAD | sha256sum >> "$RUNNER_TEMP/p0-s/source.txt"
          sha256sum research/p0-s/full-*.sql >> "$RUNNER_TEMP/p0-s/source.txt"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'full-overlay.json'
          p.write_text(json.dumps({'Replace':{str(pathlib.Path.cwd()/'server/cmd/devhash/main.go'):str(pathlib.Path.cwd()/'research/p0-s/full.go')}}))
          PY
          cd server
          go build -overlay="$RUNNER_TEMP/full-overlay.json" -o "$RUNNER_TEMP/p0-s-full" ./cmd/devhash
      - name: Exact full schema on bundled engine
        run: bash research/p0-s/launch.sh "$RUNNER_TEMP/p0-s" '${{ matrix.size }}' '${{ matrix.profile }}' "$MODE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-s-full-${{ matrix.profile }}-rep${{ matrix.repetition }}-${{ matrix.size }}-cp${{ matrix.checkpoint_ms }}
          path: |
            ${{ runner.temp }}/p0-s/**/*.json
            ${{ runner.temp }}/p0-s/**/*.pprof
            ${{ runner.temp }}/p0-s/**/*.strace
            ${{ runner.temp }}/p0-s/*.txt
          retention-days: 14
