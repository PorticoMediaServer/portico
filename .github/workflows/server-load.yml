name: Scanner import probe (branch qualification)
# Temporary focused dispatch for this measurement branch. The production load
# workflow is retained on main; it is not replaced by the eventual guard PR.
on:
  workflow_dispatch:
    inputs:
      files:
        description: Real distinct movie files
        default: '2000'
      observe_seconds:
        description: Follow-on observation after the immediate rescan
        default: '30'
permissions:
  contents: read
concurrency:
  group: scanner-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scanner-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Install the sandbox and allow unprivileged user namespaces
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Fetch the qualified development engine
        run: python3 scripts/development-engine.py fetch --target linux-x64 --output "$RUNNER_TEMP/engine"
      - name: Build the server
        working-directory: server
        run: go build -tags devtrust -o "$RUNNER_TEMP/portico-server" ./cmd/server
      - name: First import and immediate rescan
        env:
          FILES: ${{ inputs.files }}
          OBSERVE_SECONDS: ${{ inputs.observe_seconds }}
        run: |
          export PATH="$RUNNER_TEMP/engine/bin:$PATH"
          python3 scripts/scanner-import-probe.py --binary "$RUNNER_TEMP/portico-server" --scratch "$RUNNER_TEMP/scanner-probe" --files "$FILES" --observe-seconds "$OBSERVE_SECONDS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scanner-import
          path: ${{ runner.temp }}/scanner-probe/scanner-import.json
          if-no-files-found: error
          retention-days: 14
