name: F sustained observers on cached main
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
env:
  F_APP_REF: '2c0810bf493ef105b96d6772c001aef401d2cece'
  F_LOAD_PROBE: ''
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F steady load')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ env.F_APP_REF }}'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore existing harness and unpublished bounded source
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"]))'
          sha256sum /tmp/load.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/load.patch
          git apply /tmp/load.patch
      - name: Cross-vet restored tests and fixture phase split
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Pilot facts then settled cache in separate processes and authenticate real playback
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: smoke
          PORTICO_SCALE_CONTINUOUS_OBSERVERS: '1'
          PORTICO_SCALE_HOME_ROWS: '1'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          PORTICO_SCALE_FACTS_ONLY=1 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1
          test -n "$(find "$TMPDIR" -name '*.sqlite.facts' -print -quit)"
          PORTICO_SCALE_SEED_ONLY=1 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1
          PORTICO_REQUIRE_SCALE_SEED=1 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/http.log" 2>&1
          PORTICO_REQUIRE_SCALE_SEED=1 PORTICO_SCALE_CONTINUOUS_OBSERVERS=0 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/burst-http.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'steady-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  cached:
    if: contains(github.event.head_commit.message, 'F steady load full')
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        workload: [steady, burst]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - name: Recover the saved fixture identity from its exact generator inputs
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"]))'
          git apply /tmp/load.patch
      - name: Capture immutable saved-generator hash before switching to merged main
        id: seed
        run: echo 'hash=${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}' >> "$GITHUB_OUTPUT"
      - name: Assert runtime seed compatibility; test-only changes do not require a new catalogue
        run: |
          git fetch origin "$F_APP_REF"
          python3 - <<'PYCODE'
          import subprocess,os,pathlib
          paths=['server/internal/httpapi/fixture/','server/internal/compactcatalog/','server/internal/persistence/','server/internal/dbwork/','server/go.mod','server/go.sum']
          names=subprocess.check_output(['git','diff','--name-only','2c1c0df70a3636f298d993601c2c445bf466e5ec',os.environ['F_APP_REF'],'--',*paths],text=True).splitlines()
          runtime=[p for p in names if not p.endswith('_test.go') and '/testdata/' not in p]
          # #243's PK lower-bound head seek has identical seed semantics and no schema change.
          assert runtime==['server/internal/compactcatalog/search_cleanup.go'],runtime
          pathlib.Path(os.environ['RUNNER_TEMP']+'/reports/cache-runtime-compatibility.txt').write_text('saved-generator-base=2c1c0df70a3636f298d993601c2c445bf466e5ec\napplication='+os.environ['F_APP_REF']+'\n'+repr(names)+'\n')
          PYCODE
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '${{ env.F_APP_REF }}', clean: true}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply only the measurement harness to the merged application
        run: |
          sha256sum /tmp/load.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/load.patch
          git apply /tmp/load.patch
          git rev-parse HEAD > "$RUNNER_TEMP/reports/application-commit.txt"
          sha256sum /tmp/load.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          lscpu > "$RUNNER_TEMP/reports/machine.txt"
          free -h >> "$RUNNER_TEMP/reports/machine.txt"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: settled
        with:
          path: '${{ runner.temp }}/seeds/portico-fixture-*.sqlite'
          key: F-http-settled-v2-100k-${{ steps.seed.outputs.hash }}
      - name: Require the exact settled 100k cache; never regenerate
        run: test '${{ steps.settled.outputs.cache-hit }}' = 'true'
      - name: Run sustained 32,50,100,200 independent 1Hz observers and mixed readers
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: '${{ steps.seed.outputs.hash }}'
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: films100
          PORTICO_SCALE_CONTINUOUS_OBSERVERS: ${{ matrix.workload == 'steady' && '1' || '0' }}
          PORTICO_SCALE_WINDOW_SECONDS: '60'
          PORTICO_SCALE_HOME_ROWS: '1'
          PORTICO_REQUIRE_SCALE_SEED: '1'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=25m > "$RUNNER_TEMP/reports/http.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: '${{ matrix.workload }}-observers-100k', path: '${{ runner.temp }}/reports', retention-days: 7}
