name: Hosted decoder sandbox
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    # 660s apt + 355s timeout/recovery/mirror + 45s namespace probes
    # + 510s tag selection/tests + 120s workflow overhead = 1690s; round to 29m.
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Install bubblewrap and enable unprivileged namespaces on this VM
        run: python3 ci/decoder_sandbox.py setup
      - name: Run sandbox and M4 probe pool tests without skips
        run: python3 ci/decoder_sandbox.py test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: decoder-sandbox
          path: ci-sandbox-results/
          if-no-files-found: warn
