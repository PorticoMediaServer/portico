name: E2E Android pilot
on:
  workflow_call:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Make space for the media engine on this disposable runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: 'package-lock.json'}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Install tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          rust="$(python3 -c "import json; print(json.load(open('third_party/media-engine/sources.lock.json'))['tools']['rust']['version'])")"
          rustup toolchain install "$rust" --profile minimal --target x86_64-linux-android
          MAESTRO_VERSION=2.0.10 curl -fsSL https://get.maestro.mobile.dev -o "$RUNNER_TEMP/install-maestro"
          MAESTRO_VERSION=2.0.10 bash "$RUNNER_TEMP/install-maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        id: engine
        with:
          path: third_party/media-engine/out/android
          key: e2e-engine-x86_64-${{ hashFiles('third_party/media-engine/**') }}
      - name: Build the x86_64 media engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: MEDIA_ENGINE_JOBS=4 third_party/media-engine/build-android.sh --abis x86_64
      - name: Install JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund
          (cd apps/native && npm ci --no-audit --no-fund --legacy-peer-deps --workspaces=false)
      - name: Build the debug app with its development-only sign-in
        working-directory: apps/native/android
        env: {PORTICO_DEV_SIGN_IN: '1'}
        run: ./gradlew --no-daemon :app:assembleGoogleDebug -PreactNativeArchitectures=x86_64 -PporticoEmbeddedJs=true
      - name: Build the test server
        working-directory: server
        run: go build -tags devtrust -o "$RUNNER_TEMP/portico-e2e-server" ./cmd/server
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-e2e-media
          key: e2e-media-${{ runner.os }}-${{ hashFiles('scripts/e2e-server.py', 'tests/e2e/augment_media.py', 'third_party/apple-subtitles/test/make-pgs.py', 'fixtures/library-layout/Audiobooks/Test Listener/cover.png') }}
          save-always: true
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run the phone journey on its own server
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: python3 tests/e2e/server.py --binary "$RUNNER_TEMP/portico-e2e-server" --media-cache "$RUNNER_TEMP/portico-e2e-media" -- bash tests/e2e/native/run-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e-android-pilot
          path: ${{ runner.temp }}/portico-e2e-android/
          if-no-files-found: warn
          retention-days: 14
