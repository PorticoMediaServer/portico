name: E2E Android pilot
on:
  workflow_call:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Install tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://get.maestro.mobile.dev -o "$RUNNER_TEMP/install-maestro"
          MAESTRO_VERSION=2.0.10 bash "$RUNNER_TEMP/install-maestro"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: e2e-android-apk-${{ github.sha }}
          path: apps/native/android/app/build/outputs/apk/google/debug
      - name: Build the test server
        working-directory: server
        run: go build -tags devtrust -o "$RUNNER_TEMP/portico-e2e-server" ./cmd/server
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-e2e-media
          key: e2e-media-${{ runner.os }}-${{ hashFiles('scripts/e2e-server.py', 'tests/e2e/augment_media.py', 'third_party/apple-subtitles/test/make-pgs.py', 'fixtures/library-layout/Audiobooks/Test Listener/cover.png') }}
          save-always: true
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run the phone journey on its own server
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: python3 tests/e2e/server.py --binary "$RUNNER_TEMP/portico-e2e-server" --media-cache "$RUNNER_TEMP/portico-e2e-media" -- bash tests/e2e/native/run-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e-android-pilot
          path: ${{ runner.temp }}/portico-e2e-android/
          if-no-files-found: warn
          retention-days: 14
