name: Server scale measurement
on:
  push:
    branches: ['rebuild/F-scale-measure-r1']
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ !contains(github.event.head_commit.message, 'per-kind scan memory') && !contains(github.event.head_commit.message, 'nested pages using') && !contains(github.event.head_commit.message, 'paced scan controls') && !contains(github.event.head_commit.message, 'cached profile activity') && !contains(github.event.head_commit.message, 'growth curves only') && !contains(github.event.head_commit.message, 'large film seed') && !contains(github.event.head_commit.message, 'book page controls') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - name: Pilot fixture, HTTP mix and scan before scale
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_SCAN_GROWTH_ITEMS: 100
          PORTICO_GROWTH_ITEMS: 1000
          PORTICO_SCALE_MODE: smoke
          PORTICO_SCALE_SCAN: smoke
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/httpapi ./internal/ingestion ./internal/catalog/scalebench -run 'Test((Server|Filesystem)ScaleMeasurement|CrossKindGrowthMeasurement|ReadingGrowthMeasurement|ScanUnderUserLoadMeasurement)$' -count=1 -v -timeout=15m > "$RUNNER_TEMP/reports/pilot.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: scale-smoke, path: '${{ runner.temp }}/reports', retention-days: 7}
  measure:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        mode: [films20, films100]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/scale-cache/portico-fixture-*.sqlite
          key: scale-F-v1-${{ matrix.mode }}-${{ hashFiles('server/internal/persistence/**', 'server/internal/compactcatalog/**', 'server/internal/httpapi/fixture/**', 'server/internal/dbwork/**', 'server/go.sum') }}
      - name: Machine evidence
        run: |
          lscpu > "$RUNNER_TEMP/reports/machine.txt"
          free -h >> "$RUNNER_TEMP/reports/machine.txt"
          df -h >> "$RUNNER_TEMP/reports/machine.txt"
      - name: Measure unchanged server
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_SCALE_MODE: ${{ matrix.mode }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: |
          PORTICO_SCALE_SEED_ONLY=1 go test -vet=off ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=150m > "$RUNNER_TEMP/reports/seed.log" 2>&1
          go test -vet=off ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=20m > "$RUNNER_TEMP/reports/measure.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'scale-${{ matrix.mode }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  growth:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/scale-cache/F-growth-*.sqlite
          key: growth-F-${{ matrix.items }}-${{ hashFiles('server/internal/catalog/scalebench/**', 'server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**') }}
      - name: Measure catalogue growth using scalebench
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_GROWTH_ITEMS: ${{ matrix.items }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: |
          PORTICO_GROWTH_SEED_ONLY=1 go test -vet=off ./internal/catalog/scalebench -run '^TestCrossKindGrowthMeasurement$' -count=1 -v -timeout=90m > "$RUNNER_TEMP/reports/seed.log" 2>&1
          go test -p 1 -vet=off ./internal/catalog/scalebench ./internal/httpapi -run '^Test(CrossKindGrowthMeasurement|ReadingGrowthMeasurement)$' -count=1 -v -timeout=30m > "$RUNNER_TEMP/reports/growth.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'growth-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  scan-growth:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        items: [3000, 30000, 300000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - name: Scan while users browse
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_SCAN_GROWTH_ITEMS: ${{ matrix.items }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/ingestion -run '^TestScanUnderUserLoadMeasurement$' -count=1 -v -timeout=170m > "$RUNNER_TEMP/reports/scan-load.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'scan-growth-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  nested:
    if: ${{ contains(github.event.head_commit.message, 'nested pages using') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        items: [10000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/scale-cache/F-growth-*.sqlite
          # This read-only follow-up changes no generator or application code.
          # Reuse the completed a13ca507 seeds; the test refuses a cache miss.
          key: growth-F-${{ matrix.items }}-nested-read-only
          restore-keys: growth-F-${{ matrix.items }}-
      - name: Measure nested pages without reseeding
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_NESTED_ITEMS: ${{ matrix.items }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/catalog/scalebench -run '^TestNestedGrowthMeasurement$' -count=1 -v -timeout=10m > "$RUNNER_TEMP/reports/nested.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'nested-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  paced-pilot:
    if: ${{ contains(github.event.head_commit.message, 'paced scan controls') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - name: Pilot real paced scans with 32 active users
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_PACED_SCAN_ITEMS: 100
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/ingestion -run '^TestPacedScanUnderUserLoadMeasurement$' -count=1 -v -timeout=10m > "$RUNNER_TEMP/reports/paced.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: paced-pilot, path: '${{ runner.temp }}/reports', retention-days: 7}
  paced-scan:
    needs: paced-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        items: [3000, 30000, 300000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - name: Scan using normal writer hold targets and pacing
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_PACED_SCAN_ITEMS: ${{ matrix.items }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/ingestion -run '^TestPacedScanUnderUserLoadMeasurement$' -count=1 -v -timeout=170m > "$RUNNER_TEMP/reports/paced.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'paced-scan-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  cached-http:
    if: ${{ contains(github.event.head_commit.message, 'cached profile activity') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [films20]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/scale-cache/portico-fixture-*.sqlite
          key: scale-F-v1-${{ matrix.mode }}-${{ hashFiles('server/internal/persistence/**', 'server/internal/compactcatalog/**', 'server/internal/httpapi/fixture/**', 'server/internal/dbwork/**', 'server/go.sum') }}
      - name: Measure actual personal keys using the completed seed
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_REQUIRE_SCALE_SEED: 1
          PORTICO_SCALE_HOME_ROWS: 1
          PORTICO_SCALE_MODE: ${{ matrix.mode }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=35m > "$RUNNER_TEMP/reports/measure.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'cached-scale-${{ matrix.mode }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  growth-pilot:
    if: ${{ contains(github.event.head_commit.message, 'growth curves only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - name: Cross a listening-group batch before growing further
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_GROWTH_ITEMS: 6000
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/catalog/scalebench -run '^Test(CrossKindGrowthMeasurement|BulkReferenceFactsDeriveIntoPlayableMixedLibraries)$' -count=1 -v -timeout=15m > "$RUNNER_TEMP/reports/pilot.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: growth-pilot-6000, path: '${{ runner.temp }}/reports', retention-days: 7}
  growth-only:
    needs: growth-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/scale-cache/F-growth-*.sqlite
          key: growth-F-${{ matrix.items }}-${{ hashFiles('server/internal/catalog/scalebench/**', 'server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**') }}
      - name: Seed once and measure in fresh processes
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_GROWTH_ITEMS: ${{ matrix.items }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: |
          PORTICO_GROWTH_SEED_ONLY=1 go test -vet=off ./internal/catalog/scalebench -run '^TestCrossKindGrowthMeasurement$' -count=1 -v -timeout=90m > "$RUNNER_TEMP/reports/seed.log" 2>&1
          go test -p 1 -vet=off ./internal/catalog/scalebench ./internal/httpapi -run '^Test(CrossKindGrowthMeasurement|ReadingGrowthMeasurement)$' -count=1 -v -timeout=30m > "$RUNNER_TEMP/reports/growth.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'growth-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  film-seed:
    if: ${{ contains(github.event.head_commit.message, 'large film seed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/scale-cache/portico-fixture-*.sqlite
          key: scale-F-v1-films100-${{ hashFiles('server/internal/persistence/**', 'server/internal/compactcatalog/**', 'server/internal/httpapi/fixture/**', 'server/internal/dbwork/**', 'server/go.sum') }}
      - name: Complete the large film seed independently
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_SCALE_MODE: films100
          PORTICO_SCALE_SEED_ONLY: 1
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=110m > "$RUNNER_TEMP/reports/seed.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: film-seed-100k, path: '${{ runner.temp }}/reports', retention-days: 7}
  pdf-growth:
    if: ${{ contains(github.event.head_commit.message, 'book page controls') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/scale-cache" "$RUNNER_TEMP/reports"
      - name: Read a real PDF amid growing publication facts
        working-directory: server
        env:
          TMPDIR: ${{ runner.temp }}/scale-cache
          PORTICO_GROWTH_ITEMS: ${{ matrix.items }}
          PORTICO_READING_FORMAT: pdf
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/httpapi -run '^TestReadingGrowthMeasurement$' -count=1 -v -timeout=25m > "$RUNNER_TEMP/reports/reading.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'pdf-growth-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}

  kind-scan-pilot:
    if: ${{ contains(github.event.head_commit.message, 'per-kind scan memory') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        kind: [movie, tv, music, audiobook, book, comic]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/reports"
      - name: Exercise each actual library kind before the RSS matrix
        working-directory: server
        env:
          PORTICO_KIND_SCAN: ${{ matrix.kind }}
          PORTICO_KIND_SCAN_ITEMS: 100
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/ingestion -run '^TestKindScanMemoryMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/pilot.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'kind-pilot-${{ matrix.kind }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  kind-scan:
    needs: kind-scan-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kind: [movie, tv, music, audiobook, book, comic]
        items: [1000, 3000, 10000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/reports"
      - name: Measure real scan and derivation RSS in a fresh process
        working-directory: server
        env:
          PORTICO_KIND_SCAN: ${{ matrix.kind }}
          PORTICO_KIND_SCAN_ITEMS: ${{ matrix.items }}
          PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        run: go test -vet=off ./internal/ingestion -run '^TestKindScanMemoryMeasurement$' -count=1 -v -timeout=25m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'kind-scan-${{ matrix.kind }}-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
