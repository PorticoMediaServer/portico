name: Phase 0 bounded single-term first page on bundled SQLite
on:
  push:
    branches: ['schema-v1/p0-q-ef4-first']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-ef4-first.yml']
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  first_page:
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
        n: [100000, 400000, 1000000]
        share: [5, 30]
        case:
          - {mode: first-page, old: 0}
          - {mode: seed-only, old: 1}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build bundled modernc harness
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Measure first-ready and keyset pages
        env:
          MODE: ${{ matrix.case.mode }}
          OLD_RECIPE: ${{ matrix.case.old }}
          N: ${{ matrix.n }}
          PROFILE: ${{ matrix.profile }}
          CJK_SHARE: ${{ matrix.share }}
          CONFIG: normal-passive
          SAMPLES: 128
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-ef4-first-${{ matrix.profile }}-${{ matrix.n }}-cjk${{ matrix.share }}-old${{ matrix.case.old }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
