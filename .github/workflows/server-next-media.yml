name: Audiobook boundary investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audiobook-clocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server-next/go.mod, cache-dependency-path: server-next/go.sum}
      - name: Match the failing runner's tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          ffmpeg -version | head -3
      - name: Repeat the three affected real-file tests
        working-directory: server-next
        env:
          PORTICO_AUDIOBOOK_EVIDENCE: '${{ runner.temp }}/audiobook-evidence'
          PORTICO_REQUIRE_DECODER_SANDBOX: '1'
        run: |
          mkdir -p "$PORTICO_AUDIOBOOK_EVIDENCE"
          go test -json -count=30 -failfast -timeout=27m -run '^(TestABatchJoinIsInaudible|TestAMultiFileAudiobookPlaysAsOneBook|TestAMixedBookCrossesABatch)$' ./internal/mediaengine | tee "$PORTICO_AUDIOBOOK_EVIDENCE/tests.jsonl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audiobook-clock-evidence
          path: '${{ runner.temp }}/audiobook-evidence'
          retention-days: 3
