name: F progress threshold transition profile
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
env:
  F_LOAD_PROBE: ''
  F_NEW_SERVER: ''
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F progress threshold')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore existing harness and unpublished bounded source
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/new-server.patch
          git apply /tmp/new-server.patch
          git apply --check /tmp/load.patch
          git apply /tmp/load.patch
      - name: Cross-vet restored tests and fixture phase split
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Pilot facts then settled cache in separate processes and authenticate real playback
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: smoke
          PORTICO_SCALE_PROGRESS_PROFILE: '1'
          PORTICO_SCALE_PROGRESS_SEQUENCE: threshold
          PORTICO_SCALE_HOME_ROWS: '1'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          PORTICO_SCALE_FACTS_ONLY=1 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1
          test -n "$(find "$TMPDIR" -name '*.sqlite.facts' -print -quit)"
          PORTICO_SCALE_SEED_ONLY=1 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1
          PORTICO_REQUIRE_SCALE_SEED=1 go test ./internal/httpapi -run '^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/http.log" 2>&1
      - name: Pilot current scoped Home while the real scanner writes
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_PACED_SCAN_ITEMS: '100'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^Test(ScanCurveHistogram|PacedScanUnderUserLoadMeasurement)' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'progress-threshold-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  curves:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: films10, key: 10k}
          - {mode: films30, key: 30k}
          - {mode: films100, key: 100k}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply only the validated measurement and merged application
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/new-server.patch
          git apply /tmp/load.patch
          lscpu > "$RUNNER_TEMP/reports/machine.txt"
          free -h >> "$RUNNER_TEMP/reports/machine.txt"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: settled
        with:
          path: '${{ runner.temp }}/seeds/portico-fixture-*.sqlite'
          key: F-http-settled-v2-${{ matrix.key }}-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
      - name: Require the exact completed seed at every size, never regenerate
        run: test '${{ steps.settled.outputs.cache-hit }}' = 'true'
      - name: Measure the 1s, 2s and 3s transition on each of three fresh private copies
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: '${{ matrix.mode }}'
          PORTICO_SCALE_PROGRESS_PROFILE: '1'
          PORTICO_SCALE_PROGRESS_SEQUENCE: threshold
          PORTICO_REQUIRE_SCALE_SEED: '1'
        run: |
          for sample in 1 2 3; do
            mkdir -p "$RUNNER_TEMP/reports/sample-$sample"
            PORTICO_SCALE_REPORT="$RUNNER_TEMP/reports/sample-$sample" go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/sample-$sample/observation.log" 2>&1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'progress-threshold-${{ matrix.key }}', path: '${{ runner.temp }}/reports', retention-days: 7}
