name: Phase 0 exact4158 post-fixture two-second reader control
on:
  push:
    branches: ['schema-v1/p0-q-two-second-control']
    paths: ['.github/workflows/p0-q-two-second.yml']
permissions: {contents: read}
env: {GOWORK: 'off'}
jobs:
  control:
    strategy:
      fail-fast: false
      matrix: {profile: [standard, old8g]}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - run: go build -o "$RUNNER_TEMP/p0-q-bench" .
        working-directory: research/p0-q
      - run: bash research/p0-q/run-experiment.sh
        env:
          MODE: publisher-wal-steady
          N: 1000000
          PROFILE: ${{ matrix.profile }}
          CONFIG: normal-passive
          CJK_SHARE: 30
          MIXED: 1
          MIXED_DURATION: 600s
          BOUNDED: 1
          SNAPSHOT_CAP: 2000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-4158-two-second-${{ matrix.profile }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
