name: Phase 0 bounded frontier overflow and complete short-context pages
on:
  push:
    branches: ['schema-v1/p0-q-frontier-spill']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-frontier-spill.yml']
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Force overflow with tiny RAM frontier, legacy witnesses
        env: {MODE: first-page, N: 1000, PROFILE: standard, CONFIG: normal-passive, SAMPLES: 16, FRONTIER_RAM_HEADS: 8}
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-spill-smoke
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
  first:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Complete first pages and every keyset page on97dc
        env: {MODE: first-page, N: 1000000, PROFILE: '${{ matrix.profile }}', CONFIG: normal-passive, SAMPLES: 128, CJK_SHARE: 5}
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-spill-${{ matrix.profile }}-1000000-cjk5
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
