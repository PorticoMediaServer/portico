name: Android JVM tests
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  unit-and-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/native/package-lock.json}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Android SDK path from the runner environment
        id: sdk-root
        run: echo "path=${ANDROID_HOME:?}" >> "$GITHUB_OUTPUT"
      - name: Restore installed Android SDK packages
        id: android-sdk-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ steps.sdk-root.outputs.path }}/ndk/27.1.12297006
            ${{ steps.sdk-root.outputs.path }}/platforms/android-36
            ${{ steps.sdk-root.outputs.path }}/build-tools/36.0.0
          key: android-sdk-v2-${{ runner.os }}-36-36.0.0-ndk-27.1.12297006
      - name: Android SDK used by the JVM compilation and standalone harnesses
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 2
          on_retry_command: rm -rf -- "$ANDROID_HOME/.temp" "$HOME/.android/cache"
          command: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"'
      - name: Save installed Android SDK packages before tests
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ steps.sdk-root.outputs.path }}/ndk/27.1.12297006
            ${{ steps.sdk-root.outputs.path }}/platforms/android-36
            ${{ steps.sdk-root.outputs.path }}/build-tools/36.0.0
          key: ${{ steps.android-sdk-cache.outputs.cache-primary-key }}
      - name: Download the Gradle distribution before tests
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 2
          command: cd apps/native/android && ./gradlew --no-daemon --version
      - id: native-deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps --workspaces=false
        working-directory: apps/native
      - name: Restore checksum-pinned Robolectric SDKs
        id: robolectric-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/robolectric-sdk
          key: robolectric-sdk-${{ runner.os }}-${{ hashFiles('ci/robolectric-sdk.json') }}
      - name: Provision Robolectric SDKs before tests start
        id: robolectric-sdk
        run: python3 ci/robolectric_sdk.py --directory "$RUNNER_TEMP/robolectric-sdk"
      - name: Save checked Robolectric SDKs before tests run
        if: ${{ steps.robolectric-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/robolectric-sdk
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}
      - name: JVM tests for Android and Fire OS
        if: ${{ !cancelled() && steps.native-deps.outcome == 'success' && steps.robolectric-sdk.outcome == 'success' }}
        # A unit-test JVM never links or packages libmpv. Keep production media
        # checks unchanged and omit only its asset-staging prerequisite here.
        env:
          PORTICO_ROBOLECTRIC_SDK_DIR: ${{ runner.temp }}/robolectric-sdk
        run: ./gradlew --no-daemon --continue --init-script "$GITHUB_WORKSPACE/ci/robolectric-offline.gradle" :app:testGoogleDebugUnitTest :app:testFiretvDebugUnitTest -x :portico-mpv:stageMediaEngine
        working-directory: apps/native/android
      - name: Production Android transport, layout and URL-route harnesses
        if: ${{ !cancelled() && steps.native-deps.outcome == 'success' && steps.robolectric-sdk.outcome == 'success' }}
        env:
          PORTICO_ANDROID_TEST_OUT_DIR: ${{ runner.temp }}/android-harnesses
        run: python3 scripts/run-android-harnesses.py
      - name: Compile debug only with qualified prebuilt engine
        # Existing Gradle checkMediaEngine validates the entire payload. Never build it here.
        if: ${{ hashFiles('third_party/media-engine/out/android/lib/x86_64/libmpv.so') != '' }}
        run: ./gradlew --no-daemon :app:assembleGoogleDebug :app:assembleFiretvDebug -PreactNativeArchitectures=x86_64
        working-directory: apps/native/android
      - name: Retain per-suite Android results
        if: ${{ always() && steps.robolectric-sdk.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-jvm-and-transport
          path: |
            apps/native/android/app/build/test-results/**
            apps/native/android/app/build/reports/tests/**
            ${{ runner.temp }}/android-harnesses/**
          if-no-files-found: error
          retention-days: 7
