name: F writer evidence
on:
  push:
    branches: ['rebuild/F-writer-evidence-r1']
permissions:
  contents: read
jobs:
  schema-and-tests:
    if: contains(github.event.head_commit.message, 'rating probes')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/reports"
      - name: Generate schema metadata using its producers
        run: |
          python3 scripts/schema-sync.py > "$RUNNER_TEMP/reports/schema.log" 2>&1
          git diff -- server/internal/persistence/known_schema.go server/internal/persistence/known_columns.go server/internal/persistence/schema_test.go > "$RUNNER_TEMP/reports/schema-generated.patch"
      - name: Targeted writer and response freshness tests
        working-directory: server
        run: go test ./internal/compactcatalog ./internal/catalog ./internal/httpapi ./internal/persistence -count=1 -run 'Rating|VisibilitySource|Restriction|Revision|ETag|Schema|KnownSchema' -timeout=15m > "$RUNNER_TEMP/reports/tests.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: schema-and-tests, path: '${{ runner.temp }}/reports', retention-days: 7}
  curves:
    if: contains(github.event.head_commit.message, 'rating probes')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
        version: [before, after]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Restore unchanged baseline for before probes
        if: matrix.version == 'before'
        run: |
          git diff --name-only --diff-filter=M 3ad4b5de c4c9e639 -- server/ > "$RUNNER_TEMP/before-paths"
          xargs -a "$RUNNER_TEMP/before-paths" git restore --source=3ad4b5de --
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/seeds" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: '${{ runner.temp }}/seeds/*.sqlite'
          key: F-rating-${{ matrix.items }}-${{ matrix.version }}-${{ hashFiles('server/internal/compactcatalog/rating_scale_measure_test.go', 'server/internal/persistence/migrations/**') }}
      - name: Record hardware
        run: lscpu > "$RUNNER_TEMP/reports/machine.txt"
      - name: Measure one spelling publication and one source page
        working-directory: server
        env:
          PORTICO_RATING_SCALE_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
          PORTICO_EXPECT_RATING_FAILURE: "${{ matrix.version == 'before' && '1' || '' }}"
        run: go test ./internal/compactcatalog -run '^TestRatingWriterGrowthMeasurement$' -count=1 -v -timeout=20m > "$RUNNER_TEMP/reports/measure.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'rating-${{ matrix.version }}-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  inventory-curves:
    if: contains(github.event.head_commit.message, 'inventory probes')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
        version: [before, after]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Restore inventory baseline for before probes
        if: matrix.version == 'before'
        run: git restore --source=3ad4b5de -- server/internal/ingestion/legacy_inventory.go
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/seeds" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: '${{ runner.temp }}/seeds/*.sqlite'
          key: F-inventory-${{ matrix.items }}-${{ hashFiles('server/internal/ingestion/legacy_inventory_scale_measure_test.go', 'server/internal/persistence/migrations/**') }}
      - name: One inventory turn over already inventoried facts
        working-directory: server
        env:
          PORTICO_INVENTORY_SCALE_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
          PORTICO_EXPECT_INVENTORY_FAILURE: "${{ matrix.version == 'before' && '1' || '' }}"
        run: go test ./internal/ingestion -run '^TestLegacyInventoryGrowthMeasurement$' -count=1 -v -timeout=20m > "$RUNNER_TEMP/reports/measure.log" 2>&1
      - name: Adoption, raw reject and restart regressions
        if: matrix.version == 'after' && matrix.items == 10000
        working-directory: server
        run: go test ./internal/ingestion -run 'TestLegacyInventory|TestInventorySourceTraversalRestartParity' -count=1 -v -timeout=10m > "$RUNNER_TEMP/reports/tests.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'inventory-${{ matrix.version }}-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  maintenance-profile:
    if: contains(github.event.head_commit.message, 'inventory probes')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/reports"
      - name: Locate final paced maintenance overrun without weakening the guard
        working-directory: server
        env:
          PORTICO_KIND_SCAN: movie
          PORTICO_KIND_SCAN_ITEMS: 10000
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^TestKindScanMemoryMeasurement$' -count=1 -v -timeout=15m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: maintenance-profile, path: '${{ runner.temp }}/reports', retention-days: 7}
  cleanup-curves:
    if: contains(github.event.head_commit.message, 'cleanup probes')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
        version: [before, after]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Restore cleanup baseline for before probes
        if: matrix.version == 'before'
        run: git restore --source=3ad4b5de -- server/internal/compactcatalog/derive.go
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/seeds" "$RUNNER_TEMP/reports"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: '${{ runner.temp }}/seeds/*.sqlite'
          key: F-rating-${{ matrix.items }}-after-${{ hashFiles('server/internal/compactcatalog/rating_scale_measure_test.go', 'server/internal/persistence/migrations/**') }}
      - name: Measure cleanup under the unchanged maintenance plan
        working-directory: server
        env:
          PORTICO_RATING_SCALE_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
          PORTICO_EXPECT_CLEANUP_FAILURE: "${{ matrix.version == 'before' && '1' || '' }}"
        run: go test ./internal/compactcatalog -run '^Test(RatingWriterGrowthMeasurement|SearchCleanupGrowthMeasurement|SearchReplacementGrowthMeasurement)$' -count=1 -v -timeout=20m > "$RUNNER_TEMP/reports/measure.log" 2>&1
      - name: Cleanup restart, generation and adoption regressions
        if: matrix.version == 'after' && matrix.items == 10000
        working-directory: server
        run: |
          go test ./internal/compactcatalog -run '^Test(SearchCleanupPagesLeavesBeforeDeletingDocuments|PacedSearchReplacementKeepsOneAtomicDocument|BatchesAreSizedToTheHoldTarget|SingleHolderKeyDoesNotClampItsRawPageToTwoRows)$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/cleanup-tests.log" 2>&1
          go test ./internal/ingestion -run '^TestLegacyInventory(ConsumesRawRejectsAcrossRestart|CanceledFenceKeepsCursor)$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/inventory-tests.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'cleanup-${{ matrix.version }}-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  writer-integration:
    if: contains(github.event.head_commit.message, 'cleanup probes')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind: [movie, tv, book, comic, music, audiobook]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/reports"
      - name: Real names-only scan with fixed writer paths
        working-directory: server
        env:
          PORTICO_KIND_SCAN: '${{ matrix.kind }}'
          PORTICO_KIND_SCAN_ITEMS: 10000
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^TestKindScanMemoryMeasurement$' -count=1 -v -cpuprofile="$RUNNER_TEMP/reports/cpu.pprof" -timeout=20m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - name: Summarize CPU profile
        if: always()
        working-directory: server
        run: |
          go tool pprof -top -nodecount=40 "$RUNNER_TEMP/reports/cpu.pprof" > "$RUNNER_TEMP/reports/cpu-top.txt"
          go tool pprof -top -cum -nodecount=40 "$RUNNER_TEMP/reports/cpu.pprof" > "$RUNNER_TEMP/reports/cpu-cum.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'writer-integration-${{ matrix.kind }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  writer-metadata:
    if: contains(github.event.head_commit.message, 'writer metadata')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: mkdir -p "$RUNNER_TEMP/reports"
      - name: Generate writer census with its producer
        working-directory: server
        run: |
          go test ./internal/dbwork -run '^TestWriteCensus$' -update-write-census -count=1 > "$RUNNER_TEMP/reports/census.log" 2>&1
          git diff -- internal/dbwork/testdata/write_census.tsv > "$RUNNER_TEMP/reports/writer-metadata.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: writer-metadata, path: '${{ runner.temp }}/reports', retention-days: 7}
