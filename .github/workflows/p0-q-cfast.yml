name: Phase 0 bounded title-first dispatch
on:
  push:
    branches: ['schema-v1/p0-q-cfast']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-cfast.yml']
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        n: [100000, 400000, 1000000]
        profile: [standard, old8g]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Measure
        env:
          MODE: hybrid
          N: ${{ matrix.n }}
          CONFIG: baseline
          PROFILE: ${{ matrix.profile }}
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p0-q-cfast-${{ matrix.profile }}-${{ matrix.n }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
