name: F Home evidence
on:
  push:
    branches: ['rebuild/F-home-evidence-r1']
permissions:
  contents: read
env:
  PORTICO_HOME_SOURCE_PROBE: ''
  PORTICO_HOME_CANDIDATE: ''
  PORTICO_CACHE_PATCH: ''
jobs:
  home-preflight:
    if: contains(github.event.head_commit.message, 'home preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: main}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply the unpublished Home candidate for pre-push checks
        env:
          PORTICO_HOME_PATCH: ''
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 - <<'PYCODE'
          import base64,hashlib,os,pathlib
          b=base64.b64decode(os.environ['PORTICO_HOME_PATCH'])
          pathlib.Path('/tmp/F2-home-candidate.patch').write_bytes(b)
          pathlib.Path(os.environ['RUNNER_TEMP']+'/reports/patch-sha256.txt').write_text(hashlib.sha256(b).hexdigest())
          PYCODE
          git apply --check /tmp/F2-home-candidate.patch
          git apply /tmp/F2-home-candidate.patch
      - name: Vet all application and test code for the target platform
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Home cache, policy and existing composition regressions
        if: matrix.os == 'linux'
        working-directory: server
        run: go test ./internal/catalog -run 'Home|Recommendation' -short -count=1 -v -timeout=15m > "$RUNNER_TEMP/reports/home-tests.log" 2>&1
      - name: Concurrent cache race check
        if: matrix.os == 'linux'
        working-directory: server
        run: go test -race ./internal/catalog -run '^TestHomeScanCache' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/home-race.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'home-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  cache-preflight:
    if: contains(github.event.head_commit.message, 'cache diagnostics')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: main}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply measurement-only instrumentation
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/cache-probe.patch").write_bytes(base64.b64decode(os.environ["PORTICO_CACHE_PATCH"]))'
          sha256sum /tmp/cache-probe.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/cache-probe.patch
          git apply /tmp/cache-probe.patch
      - name: Cross-check application and fixture portability before publication
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Existing cache correctness and memory-accounting controls
        if: matrix.os == 'linux'
        working-directory: server
        run: go test ./internal/dbwork -run '^TestStatementCache' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/cache-tests.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'cache-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  cache-churn:
    needs: cache-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        kind: [movie, tv, music, audiobook, book, comic]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: main}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply exactly the preflight measurement patch
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/cache-probe.patch").write_bytes(base64.b64decode(os.environ["PORTICO_CACHE_PATCH"]))'
          sha256sum /tmp/cache-probe.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/cache-probe.patch
          git apply /tmp/cache-probe.patch
      - name: Small real scan records cache churn and native bytes, with no policy changes
        working-directory: server
        env:
          PORTICO_KIND_SCAN: '${{ matrix.kind }}'
          PORTICO_KIND_SCAN_ITEMS: '1000'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^TestKindScanMemoryMeasurement$' -count=1 -v -timeout=10m > "$RUNNER_TEMP/reports/scan-cache.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'cache-churn-${{ matrix.kind }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  home-source-preflight:
    if: contains(github.event.head_commit.message, 'home source curves')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '83ceac6af3aba6bbfb0298b40a2f2bb9bfacec25'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply the source-fixture extension to the existing scalebench tool
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/home-source.patch").write_bytes(base64.b64decode(os.environ["PORTICO_HOME_SOURCE_PROBE"])); pathlib.Path("/tmp/home.patch").write_bytes(base64.b64decode(os.environ["PORTICO_HOME_CANDIDATE"]))'
          sha256sum /tmp/home-source.patch /tmp/home.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/home-source.patch
      - name: Vet portable source fixtures before publication
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Seed only a small positive control before any larger size
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '1000'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/catalog/scalebench -run '^TestHomeSourceSeedMeasurement$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/seed.log" 2>&1
      - name: Compare the same small fixture before and after
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '1000'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          go test ./internal/catalog -run '^TestHomeSourceGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/before.log" 2>&1
          mv "$RUNNER_TEMP/reports/home-sources.json" "$RUNNER_TEMP/reports/before.json"
          git apply /tmp/home.patch
          go test ./internal/catalog -run '^TestHomeSourceGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/after.log" 2>&1
          mv "$RUNNER_TEMP/reports/home-sources.json" "$RUNNER_TEMP/reports/after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'home-source-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  home-source-curves:
    needs: home-source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        items: [10000, 30000, 100000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: '83ceac6af3aba6bbfb0298b40a2f2bb9bfacec25'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore exactly the validated probe
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/home-source.patch").write_bytes(base64.b64decode(os.environ["PORTICO_HOME_SOURCE_PROBE"])); pathlib.Path("/tmp/home.patch").write_bytes(base64.b64decode(os.environ["PORTICO_HOME_CANDIDATE"]))'
          sha256sum /tmp/home-source.patch /tmp/home.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/home-source.patch
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: seeds
        with:
          path: '${{ runner.temp }}/seeds/home-sources-*.sqlite'
          key: F-home-sources-${{ matrix.items }}-${{ hashFiles('server/internal/catalog/scalebench/home_source_seed_test.go', 'server/internal/catalog/scalebench/bulk_reference.go', 'server/internal/persistence/migrations/**') }}
      - name: Generate and checkpoint facts plus Home projections once
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/catalog/scalebench -run '^TestHomeSourceSeedMeasurement$' -count=1 -v -timeout=10m > "$RUNNER_TEMP/reports/seed.log" 2>&1
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: steps.seeds.outputs.cache-hit != 'true'
        with:
          path: '${{ runner.temp }}/seeds/home-sources-*.sqlite'
          key: '${{ steps.seeds.outputs.cache-primary-key }}'
      - name: Paired reads from the same completed seed, without rebuilding it
        working-directory: server
        env:
          PORTICO_HOME_SOURCE_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_SEEDS: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          go test ./internal/catalog -run '^TestHomeSourceGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/before.log" 2>&1
          mv "$RUNNER_TEMP/reports/home-sources.json" "$RUNNER_TEMP/reports/before.json"
          git apply /tmp/home.patch
          go test ./internal/catalog -run '^TestHomeSourceGrowthMeasurement$' -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/after.log" 2>&1
          mv "$RUNNER_TEMP/reports/home-sources.json" "$RUNNER_TEMP/reports/after.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'home-source-curves-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
