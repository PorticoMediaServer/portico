name: F Home evidence
on:
  push:
    branches: ['rebuild/F-home-evidence-r1']
permissions:
  contents: read
jobs:
  home-preflight:
    if: contains(github.event.head_commit.message, 'home preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: main}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply the unpublished Home candidate for pre-push checks
        env:
          PORTICO_HOME_PATCH: ''
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          git rev-parse HEAD > "$RUNNER_TEMP/reports/base.txt"
          python3 - <<'PYCODE'
          import base64,hashlib,os,pathlib
          b=base64.b64decode(os.environ['PORTICO_HOME_PATCH'])
          pathlib.Path('/tmp/F2-home-candidate.patch').write_bytes(b)
          pathlib.Path(os.environ['RUNNER_TEMP']+'/reports/patch-sha256.txt').write_text(hashlib.sha256(b).hexdigest())
          PYCODE
          git apply --check /tmp/F2-home-candidate.patch
          git apply /tmp/F2-home-candidate.patch
      - name: Vet all application and test code for the target platform
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Home cache, policy and existing composition regressions
        if: matrix.os == 'linux'
        working-directory: server
        run: go test ./internal/catalog -run 'Home|Recommendation' -short -count=1 -v -timeout=15m > "$RUNNER_TEMP/reports/home-tests.log" 2>&1
      - name: Concurrent cache race check
        if: matrix.os == 'linux'
        working-directory: server
        run: go test -race ./internal/catalog -run '^TestHomeScanCache' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/home-race.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'home-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
