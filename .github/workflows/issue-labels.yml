name: Issue labels
# Adds an area label from the "where" dropdown on new issue forms.
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/### (?:Which app were you playing on\?|Where is the problem\?)\s+([^\n]+)/);
            const kind = body.match(/### What kind of media\?\s+([^\n]+)/);
            const areas = {
              'Web browser': ['area: web'], 'Web app': ['area: web'],
              'iPhone or iPad': ['area: apple'], 'Apple TV': ['area: apple', 'area: tv'],
              'Android phone or tablet': ['area: android'],
              'Android TV or Google TV': ['area: android', 'area: tv'], 'Fire TV': ['area: android', 'area: tv'],
              'Android TV, Google TV or Fire TV': ['area: android', 'area: tv'],
              'Vega (Amazon) TV': ['area: vega', 'area: tv'], 'Desktop app': ['area: desktop'],
              'Server': ['area: server'], 'Website (getportico.tv)': ['area: website'],
              'API or integrations': ['area: api'], 'Installing or updating': ['area: server'],
            };
            const labels = new Set(areas[(match?.[1] || '').trim()] || []);
            if (body.includes('### About the file')) labels.add('area: playback');
            if (kind) labels.add('area: library');
            if (labels.size) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels: [...labels] });
            }
