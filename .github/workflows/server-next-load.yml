name: New server under load
# Fills the new server's database (server-next) with a synthetic library of one million
# playable items and measures it against the rebuild plan's bars: first import rate, unchanged
# rescan rate, page reads and user writes while an import runs, whether an import keeps moving
# under constant use, and memory and WAL size. Every measured process runs under a 2 GB memory
# limit. The numbers go to the run summary and one JSON artifact. This is a diagnostic: a
# missed bar is a number to explain, not a failed run.
#
# The database is built in one job and handed to the next as an artifact, so no job runs long.
on:
  workflow_dispatch:
    inputs:
      items:
        description: Playable items in the library
        default: '1000000'
      extra:
        description: Playable items in each import of the mixed-load job
        default: '100000'
      batch:
        description: Files per import transaction in the first import and the rescan
        default: '40'
      busy_batch:
        description: How long one import transaction should take while people use the server (a person's write waits for the one in flight)
        default: '10ms'
  # A change to the workflow or the load tools runs them.
  pull_request:
    paths:
      - .github/workflows/server-next-load.yml
      - server-next/cmd/portico-load/**
      - server-next/cmd/portico-seed/**
      - server-next/internal/seed/**
permissions:
  contents: read
concurrency:
  group: server-next-load-${{ github.ref }}
  cancel-in-progress: true
env:
  ITEMS: ${{ inputs.items || '1000000' }}
  EXTRA: ${{ inputs.extra || '100000' }}
  BATCH: ${{ inputs.batch || '40' }}
  BUSY_BATCH: ${{ inputs.busy_batch || '10ms' }}
  WORK: ${{ github.workspace }}/load
defaults:
  run:
    shell: bash
jobs:
  import:
    name: First import
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      report: ${{ steps.measure.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server-next/go.mod, cache-dependency-path: server-next/go.sum}
      - name: Build the seeder and the load driver
        run: |
          mkdir -p "$WORK/bin"
          cd server-next && CGO_ENABLED=0 go build -o "$WORK/bin/" ./cmd/portico-seed ./cmd/portico-load
      - name: Import the library (bars 1 and 6)
        id: measure
        run: |
          source ci/server-next-load.sh
          limited "$WORK/bin/portico-load" -mode import -db "$WORK/main.db" -items "$ITEMS" -batch "$BATCH" -out "$WORK/import.json" | tee "$WORK/import.txt"
          summarise "First import of $ITEMS playable items" "$WORK/import.txt" "$WORK/import.json"
      - name: Pack the database
        run: zstd -q -3 -T0 "$WORK/main.db" -o "$WORK/main.db.zst" && rm "$WORK/main.db" && ls -l "$WORK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: load-database-imported
          path: |
            ${{ env.WORK }}/main.db.zst
            ${{ env.WORK }}/bin
          retention-days: 1
          compression-level: 0

  state:
    name: Personal state, rescan and add-column cost
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      report: ${{ steps.rescan.outputs.report }}
      columns: ${{ steps.columns.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server-next/go.mod, cache-dependency-path: server-next/go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: load-database-imported, path: '${{ env.WORK }}'}
      - name: Unpack the database
        run: chmod +x "$WORK"/bin/* && zstd -q -d --rm "$WORK/main.db.zst"
      - name: Give ten profiles a tenth of the library each in state rows
        run: |
          source ci/server-next-load.sh
          limited "$WORK/bin/portico-seed" -phase state -db "$WORK/main.db" -items "$ITEMS" -profiles 10
      - name: Scan the unchanged library again (bar 2)
        id: rescan
        run: |
          source ci/server-next-load.sh
          limited "$WORK/bin/portico-load" -mode rescan -db "$WORK/main.db" -items "$ITEMS" -batch "$BATCH" -out "$WORK/rescan.json" | tee "$WORK/rescan.txt"
          summarise "Unchanged rescan" "$WORK/rescan.txt" "$WORK/rescan.json"
      - name: Measure adding a column to items, as it is and declared STRICT
        id: columns
        working-directory: server-next
        env:
          PORTICO_LOAD_DB: ${{ env.WORK }}/main.db
          PORTICO_LOAD_OUT: ${{ env.WORK }}/columns.json
        run: |
          source ../ci/server-next-load.sh
          go test ./internal/db -run TestAddColumnCost -count=1 -v | grep -E 'ADD COLUMN|^(ok|FAIL|---)' | tee "$WORK/columns.txt"
          summarise "ALTER TABLE items ADD COLUMN" "$WORK/columns.txt" "$WORK/columns.json"
      - name: Pack the database
        run: zstd -q -3 -T0 "$WORK/main.db" -o "$WORK/main.db.zst" && rm "$WORK/main.db" && ls -l "$WORK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: load-database-seeded
          path: |
            ${{ env.WORK }}/main.db.zst
            ${{ env.WORK }}/bin
          retention-days: 1
          compression-level: 0

  mixed:
    name: Reads and writes during an import
    needs: state
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      report: ${{ steps.measure.outputs.report }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: load-database-seeded, path: '${{ env.WORK }}'}
      - name: Unpack the database
        run: chmod +x "$WORK"/bin/* && zstd -q -d --rm "$WORK/main.db.zst"
      - name: Import with nobody using the server, then with constant use (bars 3 to 6)
        id: measure
        run: |
          source ci/server-next-load.sh
          limited "$WORK/bin/portico-load" -mode mixed -db "$WORK/main.db" -items "$EXTRA" -batch 10 -batch-time "$BUSY_BATCH" -out "$WORK/mixed.json" | tee "$WORK/mixed.txt"
          summarise "Reads and writes while importing $EXTRA more items, in transactions of about $BUSY_BATCH, into the $ITEMS library" "$WORK/mixed.txt" "$WORK/mixed.json"

  report:
    name: Report
    needs: [import, state, mixed]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Put the measurements in one file
        env:
          IMPORT: ${{ needs.import.outputs.report }}
          RESCAN: ${{ needs.state.outputs.report }}
          COLUMNS: ${{ needs.state.outputs.columns }}
          MIXED: ${{ needs.mixed.outputs.report }}
        run: |
          jq -n --arg runner "ubuntu-24.04 GitHub-hosted, $(nproc) vCPU, 2 GB memory limit on every measured process" \
            --arg commit "$GITHUB_SHA" --arg items "$ITEMS" --arg batch "$BATCH" --arg busy "$BUSY_BATCH" \
            --argjson import "${IMPORT:-null}" --argjson rescan "${RESCAN:-null}" --argjson columns "${COLUMNS:-null}" --argjson mixed "${MIXED:-null}" \
            '{runner: $runner, commit: $commit, items: ($items | tonumber), batchFiles: ($batch | tonumber), busyBatchTime: $busy, import: $import, rescan: $rescan, addColumn: $columns, mixed: $mixed}' \
            > server-next-load.json
          jq -r '[.import, .rescan, .mixed] | map(select(. != null) | .bars[]) | map(select(.passed | not)) | "Bars missed: \(length)"' server-next-load.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: server-next-load, path: server-next-load.json, retention-days: 30}
