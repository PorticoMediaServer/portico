name: Schema writer Windows connection control (temporary)
on:
  push:
    branches: [schema-v1/p1-w-windows-controls-r1]
permissions:
  contents: read
jobs:
  sqliteconn:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Record source and execute focused native controls
        shell: pwsh
        run: |
          git rev-parse HEAD
          git rev-parse HEAD:server/internal/store/internal/sqliteconn
          go version
          go -C server test -json -count=1 -p 1 -parallel 2 -run 'TestFileURI|TestReplacement|TestCancelled|TestReaders|TestReaderPool|TestConnection' ./internal/store/internal/sqliteconn 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/sqliteconn-windows.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sqliteconn-windows-control
          path: ${{ runner.temp }}/sqliteconn-windows.jsonl
          if-no-files-found: error
          retention-days: 7
