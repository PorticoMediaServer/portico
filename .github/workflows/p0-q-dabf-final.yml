name: Phase 0 final bounded dispatch CJK recipe and WAL reset
on:
  push:
    branches: ['schema-v1/p0-q-426-final']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-dabf-final.yml']
permissions:
  contents: read
env:
  GOWORK: "off"
jobs:
  recipe_policy:
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
        n: [100000, 400000, 1000000]
        share: [5, 30]
        case:
          - {mode: policy, old: '0'}
          - {mode: recipe, old: '1'}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Measure
        env:
          MODE: ${{ matrix.case.mode }}
          N: ${{ matrix.n }}
          PROFILE: ${{ matrix.profile }}
          CONFIG: normal-passive
          CJK_SHARE: ${{ matrix.share }}
          OLD_RECIPE: ${{ matrix.case.old }}
          BOUNDED: 1
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-final-${{ matrix.profile }}-${{ matrix.n }}-cjk${{ matrix.share }}-old${{ matrix.case.old }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
  wal_reset:
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
        case:
          - {n: 100000, cap: 0, config: normal-passive}
          - {n: 400000, cap: 0, config: normal-passive}
          - {n: 1000000, cap: 0, config: normal-passive}
          - {n: 100000, cap: 250, config: normal-passive}
          - {n: 100000, cap: 1000, config: normal-passive}
          - {n: 100000, cap: 2000, config: normal-passive}
          - {n: 1000000, cap: 250, config: normal-passive}
          - {n: 1000000, cap: 1000, config: normal-passive}
          - {n: 1000000, cap: 2000, config: normal-passive}
          - {n: 100000, cap: 0, config: normal-passive-250}
          - {n: 100000, cap: 0, config: normal-passive-1000}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Measure
        env:
          MODE: tune
          N: ${{ matrix.case.n }}
          PROFILE: ${{ matrix.profile }}
          CONFIG: ${{ matrix.case.config }}
          CJK_SHARE: 5
          BOUNDED: 1
          MIXED: 1
          SNAPSHOT_CAP: ${{ matrix.case.cap }}
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-final-wal-${{ matrix.profile }}-${{ matrix.case.n }}-cap${{ matrix.case.cap }}-${{ matrix.case.config }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
