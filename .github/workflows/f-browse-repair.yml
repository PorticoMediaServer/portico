name: F Movies selection scope and write curves
permissions:
  contents: read
env:
  F_APP_REF: 9c89550772f21fa157e33d306460397417d416a9
  F_CODE_0: 
  F_CODE_1: 
  F_LOAD_0: 
  F_LOAD_1: 
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F browse repair')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
        - linux
        - darwin
        - windows
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - &id001
      name: Apply reviewed candidate and measurement-only harness
      run: "mkdir -p \"$RUNNER_TEMP/reports\" \"$RUNNER_TEMP/seeds\"\npython3 - <<'PYCODE'\nimport os,pathlib,base64,hashlib,subprocess\n\
        report=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'\nfor prefix,name in [('F_CODE_','repair'),('F_LOAD_','load')]:\n\
        \ data=base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith(prefix)))\n path=pathlib.Path('/tmp')/(name+'.patch');path.write_bytes(data)\n\
        \ (report/(name+'-sha256.txt')).write_text(hashlib.sha256(data).hexdigest()+'\\n')\n subprocess.run(['git','apply','--check',str(path)],check=True)\n\
        \ subprocess.run(['git','apply',str(path)],check=True)\nPYCODE\nlscpu > \"$RUNNER_TEMP/reports/machine.txt\"\nfree\
        \ -h >> \"$RUNNER_TEMP/reports/machine.txt\"\n"
    - name: Cross-vet restored tests and fixture phase split
      working-directory: server
      env:
        GOOS: ${{ matrix.os }}
        CGO_ENABLED: '0'
      run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
    - name: Selection authority, purge accounting, activation budgets and retention
      if: matrix.os == 'linux'
      working-directory: server
      run: 'go test ./internal/httpapi -run ''TestInitialSelectionExposure|TestInitialPageKeepsRows|TestBrowseSelectionHeldProof|TestSelectionProofReadyDriftRejectsEveryAdmission|TestBrowseSelectionPreparation''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/selection-tests.log" 2>&1

        go test ./internal/playbackv1 -run ''^TestObservation(HistoryActivationAndRoutineBudgets|MixedActivationPlanKeepsRoutineUnits)$''
        -count=1 -v -timeout=3m > "$RUNNER_TEMP/reports/activation-tests.log" 2>&1

        go test ./internal/identity -run ''^TestProfilePurge(RegistryShape|UnitsPrepareAndPlan|CoverageReconcilesSchema)$''
        -count=1 -v -timeout=4m > "$RUNNER_TEMP/reports/purge-tests.log" 2>&1

        go test ./internal/tableretention -run ''^TestPermanentBoundKeepsExactReplayAndUpdateAtTheCeiling$'' -count=1 -v -timeout=4m
        > "$RUNNER_TEMP/reports/retention-tests.log" 2>&1

        '
    - name: Smoke real production composition and retained primary Stop errors
      if: matrix.os == 'linux'
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: smoke
        PORTICO_SCALE_CONTINUOUS_OBSERVERS: '1'
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
      run: 'PORTICO_SCALE_FACTS_ONLY=1 go test ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1

        test -n "$(find "$TMPDIR" -name ''*.sqlite.facts'' -print -quit)"

        PORTICO_SCALE_SEED_ONLY=1 go test ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1

        PORTICO_REQUIRE_SCALE_SEED=1 go test ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/http.log" 2>&1

        PORTICO_REQUIRE_SCALE_SEED=1 PORTICO_SCALE_CONTINUOUS_OBSERVERS=0 go test ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/burst-http.log" 2>&1


        PORTICO_REQUIRE_SCALE_SEED=1 PORTICO_SCALE_BROWSE_PROFILE=1 PORTICO_SCALE_PROGRESS_PROFILE=1 PORTICO_SCALE_PROGRESS_SEQUENCE=threshold-followup
        PORTICO_SCALE_PROGRESS_EXPECT_BOUNDED=1 go test ./internal/httpapi -run ''^TestServerScaleMeasurement$'' -count=1
        -v -timeout=5m > "$RUNNER_TEMP/reports/progress-smoke.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: browse-repair-preflight-${{ matrix.os }}
        path: ${{ runner.temp }}/reports
        retention-days: 7
  client:
    if: contains(github.event.head_commit.message, 'F browse repair')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
        cache: npm
    - *id001
    - name: Install reviewed workspace dependencies
      run: npm ci > "$RUNNER_TEMP/reports/npm-ci.log" 2>&1
    - name: Client and native unavailable-state contracts
      run: 'node --experimental-strip-types --test packages/client-core/test/browse-selection-unavailable.test.ts apps/native/test/next-library-selection-unavailable.test.ts
        > "$RUNNER_TEMP/reports/client-tests.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: browse-repair-client
        path: ${{ runner.temp }}/reports
        retention-days: 7
  curves:
    if: contains(github.event.head_commit.message, 'F browse repair full')
    needs:
    - preflight
    - client
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
        - mode: films10
          key: 10k
        - mode: films30
          key: 30k
        - mode: films100
          key: 100k
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - *id001
    - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
      id: facts
      with:
        path: ${{ runner.temp }}/seeds/portico-fixture-*.sqlite.facts
        key: F-http-facts-v3-${{ matrix.key }}-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
    - name: Generate immutable facts
      if: steps.facts.outputs.cache-hit != 'true'
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: ${{ matrix.mode }}
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_SCALE_FACTS_ONLY: '1'
      run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=20m > "$RUNNER_TEMP/reports/facts.log"
        2>&1
    - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      if: steps.facts.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/seeds/portico-fixture-*.sqlite.facts
        key: F-http-facts-v3-${{ matrix.key }}-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
    - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
      id: settled
      with:
        path: ${{ runner.temp }}/seeds/portico-fixture-*.sqlite
        key: F-http-settled-v3-${{ matrix.key }}-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
    - name: Settle separately cached facts
      if: steps.settled.outputs.cache-hit != 'true'
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: ${{ matrix.mode }}
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_SCALE_SEED_ONLY: '1'
      run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=55m > "$RUNNER_TEMP/reports/settled.log"
        2>&1
    - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      if: steps.settled.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/seeds/portico-fixture-*.sqlite
        key: F-http-settled-v3-${{ matrix.key }}-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
    - name: Measure activation and routine phases in three fresh copies
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: ${{ matrix.mode }}
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_SCALE_PROGRESS_PROFILE: '1'
        PORTICO_SCALE_PROGRESS_SEQUENCE: threshold-followup
        PORTICO_SCALE_PROGRESS_EXPECT_BOUNDED: '1'
        PORTICO_REQUIRE_SCALE_SEED: '1'
        PORTICO_SCALE_BROWSE_PROFILE: '1'
      run: "for sample in 1 2 3; do\n  mkdir -p \"$RUNNER_TEMP/reports/sample-$sample\"\n  PORTICO_SCALE_REPORT=\"$RUNNER_TEMP/reports/sample-$sample\"\
        \ go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=8m > \"$RUNNER_TEMP/reports/sample-$sample/http.log\"\
        \ 2>&1\ndone\n"
    - name: Repeat both production-shaped capacity windows at 100k
      if: matrix.key == '100k'
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: ${{ matrix.mode }}
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_REQUIRE_SCALE_SEED: '1'
        PORTICO_SCALE_WINDOW_SECONDS: '60'
      run: "for workload in steady burst; do\n  mkdir -p \"$RUNNER_TEMP/reports/$workload\"\n  continuous=0\n  if [ \"$workload\"\
        \ = steady ]; then continuous=1; fi\n  PORTICO_SCALE_CONTINUOUS_OBSERVERS=\"$continuous\" PORTICO_SCALE_REPORT=\"\
        $RUNNER_TEMP/reports/$workload\" go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=25m\
        \ > \"$RUNNER_TEMP/reports/$workload/http.log\" 2>&1\ndone\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: browse-repair-${{ matrix.key }}
        path: ${{ runner.temp }}/reports
        retention-days: 7
  growth:
    needs: curves
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: browse-repair-*k
        path: reports
    - name: Assert bounded pages and flat VM growth for every semantic phase
      run: "python3 - <<'PYCODE'\nimport json,pathlib,statistics\nroot=pathlib.Path('reports')\nresult={}\nfor seq in range(1,6):\n\
        \    medians=[]\n    for key in ('10k','30k','100k'):\n        docs=[json.loads(p.read_text()) for p in (root/('browse-repair-'+key)).glob('sample-*/progress-step-'+str(seq)+'.json')]\n\
        \        assert len(docs)==3,(seq,key,len(docs))\n        for d in docs:\n            c=d['plans']['largest']\n  \
        \          assert d['operation_returned_success'] and d['within_plan'] and d['plans']['overruns']==0,(key,seq,d)\n\
        \            assert c['rows']<=40 and c['pages']<=(96 if seq==3 else 32) and c['vmOps']<=62500,(key,seq,c)\n     \
        \   medians.append(statistics.median(d['plans']['largest']['vmOps'] for d in docs))\n    ratio=max(medians)/min(medians)\n\
        \    assert ratio<=1.25,(seq,medians,ratio)\n    result[str(seq)]={'median_vm_10k_30k_100k':medians,'growth_ratio':ratio}\n\
        pathlib.Path('growth.json').write_text(json.dumps(result,indent=2)+'\\n')\nprint(json.dumps(result,indent=2))\nPYCODE\n"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: browse-repair-write-growth
        path: growth.json
        retention-days: 7
  before:
    if: contains(github.event.head_commit.message, 'F browse repair full')
    needs:
    - preflight
    - client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - mode: films10
          key: 10k
        - mode: films30
          key: 30k
        - mode: films100
          key: 100k
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec
    - name: Apply reviewed candidate and measurement-only harness
      run: "mkdir -p \"$RUNNER_TEMP/reports\" \"$RUNNER_TEMP/seeds\"\npython3 - <<'PYCODE'\nimport os,pathlib,base64,hashlib,subprocess\n\
        report=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'\nfor prefix,name in [('F_LOAD_','load')]:\n data=base64.b64decode(''.join(os.environ[k]\
        \ for k in sorted(os.environ) if k.startswith(prefix)))\n path=pathlib.Path('/tmp')/(name+'.patch');path.write_bytes(data)\n\
        \ (report/(name+'-sha256.txt')).write_text(hashlib.sha256(data).hexdigest()+'\\n')\n subprocess.run(['git','apply','--check',str(path)],check=True)\n\
        \ subprocess.run(['git','apply',str(path)],check=True)\nPYCODE\nlscpu > \"$RUNNER_TEMP/reports/machine.txt\"\nfree\
        \ -h >> \"$RUNNER_TEMP/reports/machine.txt\"\n"
    - name: Capture immutable saved-generator hash before switching to merged main
      id: seed
      run: echo 'hash=${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**',
        'server/internal/dbwork/**', 'server/go.sum') }}' >> "$GITHUB_OUTPUT"
    - name: Assert runtime seed compatibility; test-only changes do not require a new catalogue
      run: 'git fetch origin 2c0810bf493ef105b96d6772c001aef401d2cece

        python3 - <<''PYCODE''

        import subprocess,os,pathlib

        paths=[''server/internal/httpapi/fixture/'',''server/internal/compactcatalog/'',''server/internal/persistence/'',''server/internal/dbwork/'',''server/go.mod'',''server/go.sum'']

        names=subprocess.check_output([''git'',''diff'',''--name-only'',''2c1c0df70a3636f298d993601c2c445bf466e5ec'',''2c0810bf493ef105b96d6772c001aef401d2cece'',''--'',*paths],text=True).splitlines()

        runtime=[p for p in names if not p.endswith(''_test.go'') and ''/testdata/'' not in p]

        # #243''s PK lower-bound head seek has identical seed semantics and no schema change.

        assert runtime==[''server/internal/compactcatalog/search_cleanup.go''],runtime

        pathlib.Path(os.environ[''RUNNER_TEMP'']+''/reports/cache-runtime-compatibility.txt'').write_text(''saved-generator-base=2c1c0df70a3636f298d993601c2c445bf466e5ec\napplication=''+''2c0810bf493ef105b96d6772c001aef401d2cece''+''\n''+repr(names)+''\n'')

        PYCODE

        '
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: 2c0810bf493ef105b96d6772c001aef401d2cece
        clean: true
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - name: Apply reviewed candidate and measurement-only harness
      run: "mkdir -p \"$RUNNER_TEMP/reports\" \"$RUNNER_TEMP/seeds\"\npython3 - <<'PYCODE'\nimport os,pathlib,base64,hashlib,subprocess\n\
        report=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'\nfor prefix,name in [('F_LOAD_','load')]:\n data=base64.b64decode(''.join(os.environ[k]\
        \ for k in sorted(os.environ) if k.startswith(prefix)))\n path=pathlib.Path('/tmp')/(name+'.patch');path.write_bytes(data)\n\
        \ (report/(name+'-sha256.txt')).write_text(hashlib.sha256(data).hexdigest()+'\\n')\n subprocess.run(['git','apply','--check',str(path)],check=True)\n\
        \ subprocess.run(['git','apply',str(path)],check=True)\nPYCODE\nlscpu > \"$RUNNER_TEMP/reports/machine.txt\"\nfree\
        \ -h >> \"$RUNNER_TEMP/reports/machine.txt\"\n"
    - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
      id: settled
      with:
        path: ${{ runner.temp }}/seeds/portico-fixture-*.sqlite
        key: F-http-settled-v2-${{ matrix.key }}-${{ steps.seed.outputs.hash }}
    - name: Require the exact settled 100k cache; never regenerate
      run: test '${{ steps.settled.outputs.cache-hit }}' = 'true'
    - name: Measure original settled first-page request cost
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ steps.seed.outputs.hash }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: ${{ matrix.mode }}
        PORTICO_SCALE_WINDOW_SECONDS: '60'
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_REQUIRE_SCALE_SEED: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_SCALE_BROWSE_PROFILE: '1'
      run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=12m > "$RUNNER_TEMP/reports/http.log"
        2>&1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: browse-repair-before-${{ matrix.key }}
        path: ${{ runner.temp }}/reports
        retention-days: 7
'on':
  push:
    branches:
    - rebuild/F-home-evidence-r1
