name: F Stop ingress and lost-final-request proof
permissions:
  contents: read
env:
  F_APP_REF: 7a0c5bdaa27416148956e620e0ac5ec9229a3f16
  F_LOAD_0: 
  F_LOAD_1: 
  F_CODE_0: 
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F stop ingress')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
        - linux
        - darwin
        - windows
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - &id001
      name: Apply isolated Stop ingress and measurement harness
      run: "mkdir -p \"$RUNNER_TEMP/reports\" \"$RUNNER_TEMP/seeds\"\npython3 - <<'PYCODE'\nimport os,pathlib,base64,hashlib,subprocess\n\
        report=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'\nfor prefix,name in [('F_CODE_','repair'),('F_LOAD_','load')]:\n\
        \ data=base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith(prefix)))\n path=pathlib.Path('/tmp')/(name+'.patch');path.write_bytes(data)\n\
        \ (report/(name+'-sha256.txt')).write_text(hashlib.sha256(data).hexdigest()+'\\n')\n subprocess.run(['git','apply','--check',str(path)],check=True)\n\
        \ subprocess.run(['git','apply',str(path)],check=True)\nPYCODE\nlscpu > \"$RUNNER_TEMP/reports/machine.txt\"\nfree\
        \ -h >> \"$RUNNER_TEMP/reports/machine.txt\"\n"
    - name: Cross-vet restored tests and fixture phase split
      working-directory: server
      env:
        GOOS: ${{ matrix.os }}
        CGO_ENABLED: '0'
      run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
    - name: Stop storm and route matrix
      if: matrix.os == 'linux'
      working-directory: server
      run: 'go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''TestPlaybackStopStormHasItsOwnBoundedIngress|RouteMatrix|Lane|OpenAPI''
        -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/storm-test.log" 2>&1

        '
    - name: Pilot facts then settled cache in separate processes and authenticate real playback
      if: matrix.os == 'linux'
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**',
          'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: smoke
        PORTICO_SCALE_CONTINUOUS_OBSERVERS: '1'
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_SCALE_LOST_STOP: '1'
      run: 'PORTICO_SCALE_FACTS_ONLY=1 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1

        test -n "$(find "$TMPDIR" -name ''*.sqlite.facts'' -print -quit)"

        PORTICO_SCALE_SEED_ONLY=1 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1

        PORTICO_REQUIRE_SCALE_SEED=1 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$''
        -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/http.log" 2>&1

        PORTICO_REQUIRE_SCALE_SEED=1 PORTICO_SCALE_CONTINUOUS_OBSERVERS=0 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi
        -run ''^Test(ServerScaleMeasurement|ScaleCallSearchGroupErrorAccounting)$'' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/burst-http.log"
        2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: stop-preflight-${{ matrix.os }}
        path: ${{ runner.temp }}/reports
        retention-days: 7
  cached:
    if: contains(github.event.head_commit.message, 'F stop ingress full')
    needs:
    - preflight
    - client
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        users:
        - 32
        - 200
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec
    - name: Apply isolated Stop ingress and measurement harness
      run: "mkdir -p \"$RUNNER_TEMP/reports\" \"$RUNNER_TEMP/seeds\"\npython3 - <<'PYCODE'\nimport os,pathlib,base64,hashlib,subprocess\n\
        report=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'\nfor prefix,name in [('F_LOAD_','load')]:\n data=base64.b64decode(''.join(os.environ[k]\
        \ for k in sorted(os.environ) if k.startswith(prefix)))\n path=pathlib.Path('/tmp')/(name+'.patch');path.write_bytes(data)\n\
        \ (report/(name+'-sha256.txt')).write_text(hashlib.sha256(data).hexdigest()+'\\n')\n subprocess.run(['git','apply','--check',str(path)],check=True)\n\
        \ subprocess.run(['git','apply',str(path)],check=True)\nPYCODE\nlscpu > \"$RUNNER_TEMP/reports/machine.txt\"\nfree\
        \ -h >> \"$RUNNER_TEMP/reports/machine.txt\"\n"
    - name: Capture immutable saved-generator hash before switching to merged main
      id: seed
      run: echo 'hash=${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**',
        'server/internal/dbwork/**', 'server/go.sum') }}' >> "$GITHUB_OUTPUT"
    - name: Assert runtime seed compatibility; test-only changes do not require a new catalogue
      run: 'git fetch origin "$F_APP_REF"

        python3 - <<''PYCODE''

        import subprocess,os,pathlib

        paths=[''server/internal/httpapi/fixture/'',''server/internal/compactcatalog/'',''server/internal/persistence/'',''server/internal/dbwork/'',''server/go.mod'',''server/go.sum'']

        names=subprocess.check_output([''git'',''diff'',''--name-only'',''2c1c0df70a3636f298d993601c2c445bf466e5ec'',os.environ[''F_APP_REF''],''--'',*paths],text=True).splitlines()

        runtime=[p for p in names if not p.endswith(''_test.go'') and ''/testdata/'' not in p]

        # #243''s PK lower-bound head seek has identical seed semantics and no schema change.

        assert runtime==[''server/internal/compactcatalog/search_cleanup.go''],runtime

        pathlib.Path(os.environ[''RUNNER_TEMP'']+''/reports/cache-runtime-compatibility.txt'').write_text(''saved-generator-base=2c1c0df70a3636f298d993601c2c445bf466e5ec\napplication=''+os.environ[''F_APP_REF'']+''\n''+repr(names)+''\n'')

        PYCODE

        '
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
        clean: true
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - *id001
    - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
      id: settled
      with:
        path: ${{ runner.temp }}/seeds/portico-fixture-*.sqlite
        key: F-http-settled-v2-100k-${{ steps.seed.outputs.hash }}
    - name: Require the exact settled 100k cache; never regenerate
      run: test '${{ steps.settled.outputs.cache-hit }}' = 'true'
    - name: Measure real Stop storm and natural recovery of a missing final Stop
      working-directory: server
      env:
        PORTICO_FIXTURE_SEED_HASH: ${{ steps.seed.outputs.hash }}
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_MODE: films100
        PORTICO_SCALE_CONTINUOUS_OBSERVERS: '1'
        PORTICO_SCALE_WINDOW_SECONDS: '60'
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_REQUIRE_SCALE_SEED: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
        PORTICO_SCALE_STEADY_USERS: ${{ matrix.users }}
        PORTICO_SCALE_LOST_STOP: ${{ matrix.users == 32 && '1' || '0' }}
      run: go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=15m
        > "$RUNNER_TEMP/reports/http.log" 2>&1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: stop-ingress-users-${{ matrix.users }}
        path: ${{ runner.temp }}/reports
        retention-days: 7
  client:
    if: contains(github.event.head_commit.message, 'F stop ingress')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
    - *id001
    - name: Generate canonical Cast projection
      run: 'npm ci > "$RUNNER_TEMP/reports/npm-ci.log" 2>&1

        node scripts/cast/generate.mjs

        '
    - run: node --experimental-transform-types --test packages/client-core/test/user-mutations.test.ts > "$RUNNER_TEMP/reports/stop-retry-tests.log"
        2>&1
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: stop-client-retry
        path: ${{ runner.temp }}/reports
        retention-days: 7
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: stop-cast-contracts
        path: server/receiver/cast/contracts.js
        retention-days: 7
'on':
  push:
    branches:
    - rebuild/F-home-evidence-r1
