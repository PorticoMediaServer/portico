name: Store qualification host protocol
# This is a host/evidence protocol check, with no store performance workload.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-qualification-host-${{ github.ref }}
  cancel-in-progress: false
jobs:
  host-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, legacy8, ram2gb]
        replicate: [1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Prepare task scratch and source reference
        run: |
          mkdir -p "$RUNNER_TEMP/store-host/out" "$RUNNER_TEMP/store-host/tmp"
          git archive --format=tar HEAD -- server/internal/store/qual .github/workflows/store-qualification-host.yml | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/store-host/out/scoped-archive.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/store-host/out/source.sha"
      - name: Build host-evidence command
        env:
          TMPDIR: ${{ runner.temp }}/store-host/tmp
        run: |
          go -C server build -o "$RUNNER_TEMP/store-host/host" ./internal/store/qual/cmd/host
          sha256sum "$RUNNER_TEMP/store-host/host" > "$RUNNER_TEMP/store-host/out/binary.sha256"
      - name: Record actual host and resource envelope
        env:
          PROFILE: ${{ matrix.profile }}
          REPLICATE: ${{ matrix.replicate }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$RUNNER_TEMP/store-host/host" -source "$GITHUB_SHA" -archive-sha256 "$(cat "$RUNNER_TEMP/store-host/out/scoped-archive.sha256")" -profile "$PROFILE" -replicate "$REPLICATE")
          if [[ "$PROFILE" == standard ]]; then
            "${args[@]}" > "$RUNNER_TEMP/store-host/out/host.json" 2> "$RUNNER_TEMP/store-host/out/host.stderr"
          else
            memory=8589934592
            if [[ "$PROFILE" == ram2gb ]]; then memory=2000000000; fi
            sudo systemd-run --unit=store-qual-host --wait --pipe \
              --property="MemoryMax=$memory" --property=MemorySwapMax=0 \
              --property=CPUQuota=200% --property=CPUQuotaPeriodSec=100ms \
              --property=AllowedCPUs=0-3 "${args[@]}" \
              > "$RUNNER_TEMP/store-host/out/host.json" 2> "$RUNNER_TEMP/store-host/out/host.stderr"
          fi
      - name: Hash retained receipts, including partial failures
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/store-host/out" ]]; then
            cd "$RUNNER_TEMP/store-host/out"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: store-host-${{ matrix.profile }}-vm${{ matrix.replicate }}
          path: ${{ runner.temp }}/store-host/out
          retention-days: 30
          if-no-files-found: error
      - name: Stop the task unit
        if: always()
        run: sudo systemctl stop store-qual-host.service || true
      - name: Remove disposable task scratch
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/store-host"
