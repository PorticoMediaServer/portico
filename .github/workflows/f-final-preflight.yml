name: F final harness small preflight
'on':
  push:
    branches:
    - rebuild/F-home-evidence-r1
permissions:
  contents: read
env:
  F_APP_REF: 2101563a80ae8baf3a7789b05d5513c8ca50abc8
  F_CACHE_HASH: 710ddc8505ac1e2e7bea92acebd485814b4b74807a0402011800545d7ab55873
  F_LOAD_0: 
  F_LOAD_1: 
  F_LOAD_2: 
  F_RELATED_0: 
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F final preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: ${{ env.F_APP_REF }}
    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - name: Apply frozen final harness and approved Related candidate
      run: "mkdir -p \"$RUNNER_TEMP/reports\" \"$RUNNER_TEMP/seeds\"\npython3 - <<'PYCODE'\nimport os,pathlib,base64,hashlib,subprocess\n\
        for prefix,name in [('F_LOAD_','load'),('F_RELATED_','related')]:\n b=base64.b64decode(''.join(os.environ[k] for k\
        \ in sorted(os.environ) if k.startswith(prefix)))\n p=pathlib.Path('/tmp')/(name+'.patch');p.write_bytes(b)\n subprocess.run(['git','apply','--check',str(p)],check=True);subprocess.run(['git','apply',str(p)],check=True)\n\
        \ pathlib.Path(os.environ['RUNNER_TEMP']+'/reports/'+name+'-sha256.txt').write_text(hashlib.sha256(b).hexdigest()+'\\\
        n')\nPYCODE\nlscpu > \"$RUNNER_TEMP/reports/machine.txt\"\n\ngit rev-parse HEAD > \"$RUNNER_TEMP/reports/application-ref.txt\"\
        \nprintf '%s\\n' \"$F_CACHE_HASH\" > \"$RUNNER_TEMP/reports/seed-generator.txt\"\ngit diff --stat > \"$RUNNER_TEMP/reports/measurement-overlay.txt\"\
        \n"
    - name: Prove cached generator runtime compatibility
      run: 'git fetch origin ec38affb26025246822497eaf8e2f891648c7e3e

        python3 - <<''PYCODE''

        import subprocess,pathlib,os

        paths=[''server/internal/httpapi/fixture/'',''server/internal/compactcatalog/'',''server/internal/persistence/'',''server/internal/dbwork/'',''server/go.mod'',''server/go.sum'']

        names=subprocess.check_output([''git'',''diff'',''--name-only'',''ec38affb26025246822497eaf8e2f891648c7e3e'',''HEAD'',''--'',*paths],text=True).splitlines()

        runtime=[p for p in names if not p.endswith(''_test.go'') and ''/testdata/'' not in p]

        assert not runtime,runtime

        pathlib.Path(os.environ[''RUNNER_TEMP'']+''/reports/cache-runtime-compatibility.txt'').write_text(''seed-schema-application=ec38affb26025246822497eaf8e2f891648c7e3e\n''+repr(names)+''\n'')

        PYCODE

        '
    - name: Verify exact Home seeds and published Stop contract before load
      working-directory: server
      run: 'go test -tags portico_rar7z,portico_cb7 ./internal/catalog -run ''TestRelatedProjection|TestHomeExplanation|TestHomeRecommendationWhyCarriesOnlyCurrentPersonalSeeds''
        -count=1 -timeout=4m > "$RUNNER_TEMP/reports/seeds-test.log" 2>&1

        go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''TestPlaybackStopStormHasItsOwnBoundedIngress|TestPublishedOpenAPIMatchesRegistry''
        -count=1 -timeout=4m > "$RUNNER_TEMP/reports/contract-test.log" 2>&1

        '
    - name: Pilot real durable burst on small independently seeded facts
      working-directory: server
      env:
        TMPDIR: ${{ runner.temp }}/seeds
        PORTICO_SCALE_MODE: smoke
        PORTICO_SCALE_SERVER_COMPOSITION: '1'
        PORTICO_SCALE_HOME_ROWS: '1'
        PORTICO_SCALE_DURABLE_STOP: '1'
        PORTICO_SCALE_STOP_EXPECT_NO_REFUSALS: '1'
        PORTICO_SCALE_REPORT: ${{ runner.temp }}/reports
      run: 'PORTICO_SCALE_FACTS_ONLY=1 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''^TestServerScaleMeasurement$''
        -count=1 -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1

        PORTICO_SCALE_SEED_ONLY=1 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''^TestServerScaleMeasurement$''
        -count=1 -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1

        PORTICO_REQUIRE_SCALE_SEED=1 go test -tags portico_rar7z,portico_cb7 ./internal/httpapi -run ''^TestServerScaleMeasurement$''
        -count=1 -timeout=8m > "$RUNNER_TEMP/reports/http.log" 2>&1

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: final-harness-preflight
        path: ${{ runner.temp }}/reports
        retention-days: 7
