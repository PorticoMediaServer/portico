name: Native SQLite plan diagnostic pair
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main SHA for BOTH native jobs
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-plan-pair-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  native-plans:
    # One report-only pair, dispatched by SUP. Never schedules or gates merges.
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: diagnostic-tools
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum
      - name: Collect full native snapshots with unchanged failure gates
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python3 diagnostic-tools/ci/native_plan_pair.py \
            --source "$GITHUB_WORKSPACE/source" \
            --output "$RUNNER_TEMP/native-plan-pair" \
            --sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-plan-pair-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-plan-pair
          retention-days: 7
