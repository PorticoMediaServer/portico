name: Phase 0 exact4158 connection cancellation custody
on:
  push:
    branches: ['schema-v1/p0-q-connection-custody']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-connection-custody.yml']
permissions: {contents: read}
env: {GOWORK: 'off'}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - run: |
          go build -o "$RUNNER_TEMP/p0-q-bench" .
          go build -o "$RUNNER_TEMP/p0-q-connection" ./connection-control
        working-directory: research/p0-q
      - name: Isolate cancellation and per-connection policy
        run: |
          mkdir -p "$RUNNER_TEMP/p0-q-experiment/out"
          "$RUNNER_TEMP/p0-q-connection" "$RUNNER_TEMP/q-connection-control" > "$RUNNER_TEMP/p0-q-experiment/out/connection-control.jsonl"
      - name: Force reconnect then verify People custody and generation
        run: bash research/p0-q/run-experiment.sh
        env: {MODE: people-reconnect, N: 1000, PROFILE: standard, CONFIG: normal-passive, CJK_SHARE: 30, ROUNDS: 128, SAMPLES: 8}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: q-4158-reconnect-smoke, path: '${{ runner.temp }}/p0-q-experiment/out', retention-days: 30}
  people:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
        case:
          - {n: 100000, share: 30, divisor: 50, vm: 0}
          - {n: 100000, share: 30, divisor: 50, vm: 1}
          - {n: 100000, share: 30, divisor: 50, vm: 2}
          - {n: 1000000, share: 5, divisor: 5, vm: 0}
          - {n: 1000000, share: 30, divisor: 5, vm: 0}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - run: go build -o "$RUNNER_TEMP/p0-q-bench" .
        working-directory: research/p0-q
      - name: Query timeout and typed publisher after physical reconnect
        run: bash research/p0-q/run-experiment.sh
        env:
          MODE: people-reconnect
          N: ${{ matrix.case.n }}
          PROFILE: ${{ matrix.profile }}
          CJK_SHARE: ${{ matrix.case.share }}
          PEOPLE_DIVISOR: ${{ matrix.case.divisor }}
          CONFIG: normal-passive
          ROUNDS: 1000
          SAMPLES: 128
          GENERATION: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-4158-reconnect-${{ matrix.profile }}-${{ matrix.case.n }}-cjk${{ matrix.case.share }}-div${{ matrix.case.divisor }}-vm${{ matrix.case.vm }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
