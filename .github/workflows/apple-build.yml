name: Apple simulator builds (report only)
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulators:
    # Report-only nightly/manual builds; deliberately outside ci/required.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI: '1'
      COCOAPODS_DISABLE_STATS: 'true'
      RCT_NO_LAUNCH_PACKAGER: '1'
      FORCE_BUNDLING: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build tools
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          pod --version
          df -h .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        id: subtitles
        with:
          path: |
            third_party/apple-subtitles/apple/Frameworks
            third_party/apple-subtitles/out/apple
          key: apple-subtitles-xcode26.6-${{ hashFiles('third_party/apple-subtitles/**', 'apps/native/ios/Portico.xcodeproj/project.pbxproj', 'apps/native/tvos/Portico.xcodeproj/project.pbxproj') }}
      - name: Subtitle dependencies from pinned sources
        if: steps.subtitles.outputs.cache-hit != 'true'
        run: APPLE_SUBTITLE_JOBS=3 third_party/apple-subtitles/build-apple.sh
      - name: JavaScript dependencies and native patches
        run: |
          python3 -I third_party/apple-subtitles/verify.py third_party/apple-subtitles/out/apple
          npm ci --no-audit --no-fund
          (cd apps/native && npm ci --no-audit --no-fund --legacy-peer-deps --workspaces=false)
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/native/ios/Pods
            apps/native/tvos/Pods
          key: apple-pods-xcode26.6-${{ hashFiles('package-lock.json', 'apps/native/package-lock.json', 'apps/native/**/Podfile*', 'apps/native/**/*.podspec', 'apps/native/scripts/patch*', 'apps/native/scripts/patches/**') }}
      - name: Locked Pods
        run: |
          (cd apps/native/ios && pod install --deployment)
          (cd apps/native/tvos && pod install --deployment)
      - name: Compile iOS and tvOS simulator Debug apps
        run: |
          export NODE_BINARY="$(command -v node)"
          for platform in ios tvos; do
            if [ "$platform" = ios ]; then sdk=iphonesimulator; destination='generic/platform=iOS Simulator';
            else sdk=appletvsimulator; destination='generic/platform=tvOS Simulator'; fi
            started=$SECONDS
            xcodebuild -quiet -workspace "apps/native/$platform/Portico.xcworkspace" \
              -scheme Portico -configuration Debug -sdk "$sdk" -destination "$destination" \
              -derivedDataPath "$RUNNER_TEMP/apple-derived/$platform" -jobs 3 \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES DEVELOPMENT_TEAM= build
            test -s "$RUNNER_TEMP/apple-derived/$platform/Build/Products/Debug-$sdk/Portico.app/main.jsbundle"
            echo "$platform simulator Debug build: $((SECONDS-started)) seconds" >> "$GITHUB_STEP_SUMMARY"
          done
          du -sh "$RUNNER_TEMP/apple-derived"
