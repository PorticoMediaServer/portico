name: EC4 flat inventory screening
# Disposable SCREENING evidence only. Never a qualification, release or merge
# gate, and it only runs when dispatched with an explicit pushed source ref.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Pushed branch or full 40-character commit SHA to screen
        required: true
        type: string
      files:
        description: Flat member count (1..400000)
        required: false
        default: '400000'
        type: string
      profile:
        description: Storage profiles to run
        required: false
        default: both
        type: choice
        options: [both, ssd, hdd]
      qualification:
        description: Formal qualification mode (exact clean main SHA, adopted Phase1a WAL policy)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cells.outputs.matrix }}
    steps:
      - name: Select screening cells
        id: cells
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          python3 - "$PROFILE" "$FILES" <<'PY'
          import json, os, sys
          profile, files = sys.argv[1], sys.argv[2]
          if not files.isdigit() or not 1 <= int(files) <= 400000:
              raise SystemExit("files must be an integer in 1..400000")
          cells = {
              "both": ["ssd", "throttled-hdd"],
              "ssd": ["ssd"],
              "hdd": ["throttled-hdd"],
          }[profile]
          include = [{"cell": cell, "replica": replica} for cell in cells for replica in (1, 2)]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps({"include": include}) + "\n")
          PY
  screening:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: source/server/go.mod
          cache-dependency-path: source/server/go.sum
      - name: Run the screening cell
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          FILES: ${{ inputs.files }}
          CELL: ${{ matrix.cell }}
          REPLICA: ${{ matrix.replica }}
          PORTICO_EC4_QUALIFICATION: ${{ inputs.qualification && '1' || '' }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/ci/ec4_screening_runner.py" \
            --source "$GITHUB_WORKSPACE/source" \
            --source-ref "$SOURCE_REF" \
            --cell "$CELL" \
            --replica "$REPLICA" \
            --files "$FILES" \
            --artifact "$RUNNER_TEMP/ec4-screening-artifacts/${CELL}-r${REPLICA}"
      - name: Hash retained evidence, including partial failures
        if: always()
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          REPLICA: ${{ matrix.replica }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ec4-screening-artifacts/${CELL}-r${REPLICA}"
          if [ -d "$dir" ]; then
            cd "$dir"
            find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name SHA256SUMS.tmp -print0 \
              | sort -z | xargs -0 -r sha256sum > SHA256SUMS.tmp
            mv -- SHA256SUMS.tmp SHA256SUMS
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ec4-screening-${{ matrix.cell }}-r${{ matrix.replica }}
          path: ${{ runner.temp }}/ec4-screening-artifacts/${{ matrix.cell }}-r${{ matrix.replica }}
          if-no-files-found: error
          retention-days: 30
