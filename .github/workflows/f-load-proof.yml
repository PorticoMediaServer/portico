name: F load proof
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
env:
  F_LOAD_PROBE: ''
  F_NEW_SERVER: ''
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F-load preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore existing harness and unpublished bounded source
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/new-server.patch
          git apply /tmp/new-server.patch
          git apply --check /tmp/load.patch
          git apply /tmp/load.patch
      - name: Cross-vet restored tests and fixture phase split
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Pilot facts then settled cache in separate processes and authenticate real playback
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: smoke
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          PORTICO_SCALE_FACTS_ONLY=1 go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1
          test -n "$(find "$TMPDIR" -name '*.sqlite.facts' -print -quit)"
          PORTICO_SCALE_SEED_ONLY=1 go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1
          PORTICO_REQUIRE_SCALE_SEED=1 go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/http.log" 2>&1
      - name: Pilot current scoped Home while the real scanner writes
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_PACED_SCAN_ITEMS: '100'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^Test(ScanCurveHistogram|PacedScanUnderUserLoadMeasurement)' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'load-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  concurrency:
    if: contains(github.event.head_commit.message, 'large proofs')
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Apply the validated application and harness patches
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/new-server.patch
          git apply /tmp/load.patch
          lscpu > "$RUNNER_TEMP/reports/machine.txt"
          free -h >> "$RUNNER_TEMP/reports/machine.txt"
          df -h >> "$RUNNER_TEMP/reports/machine.txt"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: facts
        with:
          path: '${{ runner.temp }}/seeds/portico-fixture-*.sqlite.facts'
          key: F-http-facts-v2-100k-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: settled
        with:
          path: '${{ runner.temp }}/seeds/portico-fixture-*.sqlite'
          key: F-http-settled-v2-100k-${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
      - name: Generate immutable 100k-film facts before any derivation
        if: steps.settled.outputs.cache-hit != 'true'
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: films100
          PORTICO_SCALE_FACTS_ONLY: '1'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=100m > "$RUNNER_TEMP/reports/facts.log" 2>&1
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: steps.facts.outputs.cache-hit != 'true' && steps.settled.outputs.cache-hit != 'true'
        with:
          path: '${{ runner.temp }}/seeds/portico-fixture-*.sqlite.facts'
          key: '${{ steps.facts.outputs.cache-primary-key }}'
      - name: Settle and verify the cached facts with normal checkpoint supervision
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: films100
          PORTICO_SCALE_SEED_ONLY: '1'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=140m > "$RUNNER_TEMP/reports/settle.log" 2>&1
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: steps.settled.outputs.cache-hit != 'true'
        with:
          path: '${{ runner.temp }}/seeds/portico-fixture-*.sqlite'
          key: '${{ steps.settled.outputs.cache-primary-key }}'
      - name: Release the local facts copy after both completed phases are cached
        env: {F_SEEDS: '${{ runner.temp }}/seeds'}
        run: |
          python3 - <<'PYCODE'
          import os,pathlib
          root=pathlib.Path(os.environ['F_SEEDS'])
          assert len(list(root.glob('portico-fixture-*.sqlite')))==1
          for p in root.glob('portico-fixture-*.sqlite.facts'): p.unlink()
          PYCODE
          df -h >> "$RUNNER_TEMP/reports/machine.txt"
      - name: Measure all-attempt endpoint tails and writer contention at 32, 50, 100 and 200 users
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: films100
          PORTICO_REQUIRE_SCALE_SEED: '1'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=25m > "$RUNNER_TEMP/reports/http.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: concurrency-100k, path: '${{ runner.temp }}/reports', retention-days: 7}
  scan-controls:
    if: contains(github.event.head_commit.message, 'large proofs')
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        items: [3000, 30000]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore the validated scoped real scan harness
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/new-server.patch
          git apply /tmp/load.patch
          lscpu > "$RUNNER_TEMP/reports/machine.txt"
          free -h >> "$RUNNER_TEMP/reports/machine.txt"
      - name: Scan while 32 profiles use Home, browse, search and detail
        working-directory: server
        env:
          PORTICO_PACED_SCAN_ITEMS: '${{ matrix.items }}'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^Test(ScanCurveHistogram|PacedScanUnderUserLoadMeasurement)' -count=1 -v -timeout=90m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'scan-under-load-${{ matrix.items }}', path: '${{ runner.temp }}/reports', retention-days: 7}
  scan-large:
    if: contains(github.event.head_commit.message, 'large proofs')
    needs: scan-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore the same application and scan measurement boundary
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply /tmp/new-server.patch
          git apply /tmp/load.patch
          lscpu > "$RUNNER_TEMP/reports/machine.txt"
          free -h >> "$RUNNER_TEMP/reports/machine.txt"
      - name: Add 300k items through the real paced scanner under active readers
        working-directory: server
        env:
          PORTICO_PACED_SCAN_ITEMS: '300000'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^Test(ScanCurveHistogram|PacedScanUnderUserLoadMeasurement)' -count=1 -v -timeout=350m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: scan-under-load-300000, path: '${{ runner.temp }}/reports', retention-days: 7}
