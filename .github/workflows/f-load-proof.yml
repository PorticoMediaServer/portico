name: F load proof
on:
  push:
    branches: [rebuild/F-home-evidence-r1]
permissions:
  contents: read
env:
  F_LOAD_PROBE: ''
  F_NEW_SERVER: ''
jobs:
  preflight:
    if: contains(github.event.head_commit.message, 'F-load preflight')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, ref: 2c1c0df70a3636f298d993601c2c445bf466e5ec}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Restore existing harness and unpublished bounded source
        run: |
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/seeds"
          python3 -c 'import base64,os,pathlib; pathlib.Path("/tmp/load.patch").write_bytes(base64.b64decode(os.environ["F_LOAD_PROBE"])); pathlib.Path("/tmp/new-server.patch").write_bytes(base64.b64decode(os.environ["F_NEW_SERVER"]))'
          sha256sum /tmp/load.patch /tmp/new-server.patch > "$RUNNER_TEMP/reports/patch-sha256.txt"
          git apply --check /tmp/new-server.patch
          git apply /tmp/new-server.patch
          git apply --check /tmp/load.patch
          git apply /tmp/load.patch
      - name: Cross-vet restored tests and fixture phase split
        working-directory: server
        env: {GOOS: '${{ matrix.os }}', CGO_ENABLED: '0'}
        run: sh ../scripts/vet-go.sh > "$RUNNER_TEMP/reports/vet.log" 2>&1
      - name: Pilot facts then settled cache in separate processes and authenticate real playback
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_FIXTURE_SEED_HASH: ${{ hashFiles('server/internal/httpapi/fixture/**', 'server/internal/compactcatalog/**', 'server/internal/persistence/**', 'server/internal/dbwork/**', 'server/go.sum') }}
          TMPDIR: '${{ runner.temp }}/seeds'
          PORTICO_SCALE_MODE: smoke
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: |
          PORTICO_SCALE_FACTS_ONLY=1 go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/facts.log" 2>&1
          test -n "$(find "$TMPDIR" -name '*.sqlite.facts' -print -quit)"
          PORTICO_SCALE_SEED_ONLY=1 go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/settle.log" 2>&1
          PORTICO_REQUIRE_SCALE_SEED=1 go test ./internal/httpapi -run '^TestServerScaleMeasurement$' -count=1 -v -timeout=5m > "$RUNNER_TEMP/reports/http.log" 2>&1
      - name: Pilot current scoped Home while the real scanner writes
        if: matrix.os == 'linux'
        working-directory: server
        env:
          PORTICO_PACED_SCAN_ITEMS: '100'
          PORTICO_SCALE_REPORT: '${{ runner.temp }}/reports'
        run: go test ./internal/ingestion -run '^TestPacedScanUnderUserLoadMeasurement$' -count=1 -v -timeout=8m > "$RUNNER_TEMP/reports/scan.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'load-preflight-${{ matrix.os }}', path: '${{ runner.temp }}/reports', retention-days: 7}
