name: Phase 0 ef4 decoupled publisher on bundled SQLite
on:
  push:
    branches: ['schema-v1/p0-q-ef4-publisher']
    paths: ['research/p0-q/**', '.github/workflows/p0-q-ef4-publisher.yml']
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Empty-content and generation smoke
        env: {MODE: publisher, N: 1000, PROFILE: standard, CONFIG: normal-passive, CJK_SHARE: 30, ROUNDS: 128}
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-ef4-publisher-smoke
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
  publisher:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, old8g]
        n: [100000, 400000, 1000000]
        share: [5, 30]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: research/p0-q/go.mod, cache-dependency-path: research/p0-q/go.sum}
      - name: Build
        working-directory: research/p0-q
        run: go build -o "$RUNNER_TEMP/p0-q-bench" .
      - name: Measure publisher capacity flow and generation
        env:
          MODE: publisher
          N: ${{ matrix.n }}
          PROFILE: ${{ matrix.profile }}
          CJK_SHARE: ${{ matrix.share }}
          CONFIG: normal-passive
          ROUNDS: 512
        run: bash research/p0-q/run-experiment.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q-ef4-publisher-${{ matrix.profile }}-${{ matrix.n }}-cjk${{ matrix.share }}
          path: '${{ runner.temp }}/p0-q-experiment/out'
          retention-days: 30
