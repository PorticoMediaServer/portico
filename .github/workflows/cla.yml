name: CLA
# Asks first-time contributors to sign CLA.md by commenting on their pull request,
# and records signatures on the unprotected cla-signatures branch. Never checks out
# or runs pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: cla
  cancel-in-progress: false
jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/PorticoMediaServer/portico/blob/main/CLA.md
          branch: cla-signatures
          allowlist: justinehler,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be reviewed, please read the
            [Contributor Licence Agreement](https://github.com/PorticoMediaServer/portico/blob/main/CLA.md)
            and sign it by posting this exact comment:
          custom-allsigned-prcomment: Thanks, the CLA is signed.
