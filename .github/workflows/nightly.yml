name: Subtitle replan attribution (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before-hdr
            source: 0f7c25a2459ad03803dde3ec45eaefc4cacbf569
          - label: before-lifetime
            source: 33a7b763c16134e447ac1bc2c2b8599a21946426
          - label: current-main
            source: c07e5e9be23d7113bdcc19aefbd90864f579ae9e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: python3 ci/decoder_sandbox.py setup
      - name: Original fixture, then real producer completion control
        env:
          LABEL: ${{ matrix.label }}
          PORTICO_CI_ENGINE: development
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          ffmpeg -version > evidence/ffmpeg.txt
          tags="$(python3 scripts/release-build-tags.py --capability)"
          go build -C server -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          set +e
          go test -C server -p 1 -json -count=1 -timeout=780s -tags "$tags" -run '^TestSubtitleReplanRoutesHoldToTheMembersCurrentCeiling$' ./internal/httpapi > evidence/original.jsonl 2> evidence/original.stderr
          echo "$?" > evidence/original.exit
          set -e
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p=Path('server/internal/httpapi/playback_v1_replan_ceilings_test.go')
          s=p.read_text()
          s=s.replace('"testing"','"testing"\n"strings"',1)
          needle='revision := s.Revision'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'\ncurrentURL := s.Presentation.URL',1)
          needle='revision = view.Revision'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'\ncurrentURL = view.Presentation.URL',1)
          needle='\t\t_, bitrate, action := planned()'
          assert s.count(needle)==1
          inject='\n          if burned {\n              grant := strings.TrimSuffix(strings.TrimPrefix(currentURL, "/v1/media/"), "/master.m3u8")\n              mediaID, _, _ := planned()\n              readyErr := player.Ready(context.Background(), playback.Session{ID: mediaID, Mode: "hls"})\n              t.Logf("PRODUCER READY err=%v", readyErr)\n              _, err := player.HLSFileContext(context.Background(), grant, "segment-000000.ts")\n              var code, diagnostic string\n              media, _, _ := planned()\n              _ = f.db.QueryRow(`SELECT failure_code,diagnostic FROM playback_artifacts WHERE session_id=?`, media).Scan(&code, &diagnostic)\n              t.Logf("PRODUCER CONTROL err=%v code=%s diagnostic=%s", err, code, diagnostic)\n          }\n'
          s=s.replace(needle,needle+inject,1)
          p.write_text(s)
          PYCONTROL
          gofmt -w server/internal/httpapi/playback_v1_replan_ceilings_test.go
          git diff > evidence/control.patch
          set +e
          go test -C server -p 1 -json -count=3 -timeout=780s -tags "$tags" -run '^TestSubtitleReplanRoutesHoldToTheMembersCurrentCeiling$' ./internal/httpapi > evidence/control.jsonl 2> evidence/control.stderr
          echo "$?" > evidence/control.exit
          set -e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replan-${{ matrix.label }}
          path: evidence/
