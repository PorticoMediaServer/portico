name: Artwork schema open diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artwork-schema-${{ github.ref }}
  cancel-in-progress: false
jobs:
  schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        schema_first: ['0', '1']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Measure exact schema, trigger attribution and idle retention
        working-directory: server
        env:
          PORTICO_ARTWORK_DIAGNOSTIC: '1'
          PORTICO_ARTWORK_SCHEMA_FIRST: ${{ matrix.schema_first }}
        run: |
          mkdir -p ../ci-results
          go test -json -count=1 -p=1 -timeout=10m ./internal/metadata -run '^TestArtworkSchemaOpenBreakdown$' > ../ci-results/schema.jsonl
          go test -json -count=1 -p=1 ./internal/dbwork -run '^TestRead(PoolHotLoopStaysWarm|ConnectionsAreNotRetiredByAge)$' > ../ci-results/retention.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artwork-schema-${{ matrix.schema_first }}
          path: ci-results
          retention-days: 7
