name: macOS fixture before and after (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: Original failures and exact candidate fixtures on one native runner
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          tags="$(python3 scripts/release-build-tags.py --capability)"
          go build -C server -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          export PORTICO_FFMPEG="$RUNNER_TEMP/engine/bin/ffmpeg" PORTICO_FFPROBE="$RUNNER_TEMP/engine/bin/ffprobe" PORTICO_CI_ENGINE=development
          run_cases() {
            set +e
            go test -C server -p 1 -json -count=3 -timeout=780s -tags "$tags" -run '^TestDiscObservationCommitsWithSingleAndBatchedPages$' ./internal/catalog > "evidence/disc-$1.jsonl" 2> "evidence/disc-$1.stderr"
            echo "$?" > "evidence/disc-$1.exit"
            set -e
          }
          run_cases before
          git show be7dd0c256c7c3f2a139e58989f9a7f2be2509eb:server/internal/catalog/disc_page_commit_test.go > server/internal/catalog/disc_page_commit_test.go
          git diff > evidence/candidate-fixtures.patch
          printf '%s\n' be7dd0c256c7c3f2a139e58989f9a7f2be2509eb > evidence/candidate-shas.txt
          run_cases after
          python3 - <<'PYASSERT'
          import json
          from pathlib import Path
          for kind,parent in [('disc','TestDiscObservationCommitsWithSingleAndBatchedPages')]:
              for phase,terminal in [('before','fail'),('after','pass')]:
                  path=Path('evidence')/(kind+'-'+phase+'.jsonl')
                  events=[json.loads(line) for line in path.read_text().splitlines()]
                  got=[e['Action'] for e in events if e.get('Test')==parent and e.get('Action') in ('pass','fail','skip')]
                  assert got==[terminal]*3,(kind,phase,got)
                  if phase=='after':
                      assert (Path('evidence')/(kind+'-'+phase+'.exit')).read_text().strip()=='0'
                      assert not any(e.get('Action') in ('fail','skip') for e in events)
          PYASSERT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-fixture-controls
          path: evidence/
