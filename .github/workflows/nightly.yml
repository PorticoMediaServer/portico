name: Full deterministic inventory
# Bootstrap is green; nightly owns the pressure/scale diagnostics below.
on:
  workflow_dispatch:
    inputs:
      hosted_only:
        description: No-op; all jobs already use GitHub-hosted Ubuntu
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  # One queue per ref: a dispatch on a branch never cancels a pending run on main or another branch.
  group: nightly-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      go_matrix: ${{ steps.plan.outputs.go_matrix }}
      go: ${{ steps.plan.outputs.go }}
      js: ${{ steps.plan.outputs.js }}
      android: ${{ steps.plan.outputs.android }}
      js_matrix: ${{ steps.plan.outputs.js_matrix }}
      js_static: ${{ steps.plan.outputs.js_static }}
      js_static_matrix: ${{ steps.plan.outputs.js_static_matrix }}
    steps:
      - name: Runner hardware
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - id: plan
        env:
          CI_FULL_PLAN: true
        run: python3 ci/plan.py --full --tier nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selection
          path: ci-plan.json
  go_build:
    # The wider diagnostic lanes need this executable; merge artifacts cannot be reused.
    needs: planner
    if: needs.planner.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: python3 ci/run.py helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playback-helper
          path: ci-tools/portico-server
          if-no-files-found: error
  macos_suite:
    runs-on: macos-15
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server-next/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Development engine (NOT FOR USE)
        run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: Mac media and packaging paths
        working-directory: server
        env:
          PORTICO_FFMPEG: ${{ runner.temp }}/engine/bin/ffmpeg
          PORTICO_FFPROBE: ${{ runner.temp }}/engine/bin/ffprobe
          PORTICO_CI_ENGINE: development
        run: |
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          go test -timeout 10m ./internal/mediaexec ./internal/decoder ./internal/archive7z ./internal/storagepaths ./internal/hostlimits
      - name: New server on macOS
        working-directory: server-next
        run: go test -timeout 10m ./...
  go_tests:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.go_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Runner hardware
        if: ${{ matrix.index == 0 }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.reading_client == true
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install real reading-client integration dependencies
        if: matrix.reading_client == true
        run: |
          npm ci --no-audit --no-fund
          (cd packages/contracts && npm run build)
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --index '${{ matrix.index }}'
      - run: python3 ci/run.py go --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: go-${{ matrix.index }}
          path: ci-results/
  go_race:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [server-next, apikit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server-next/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Race tests
        working-directory: ${{ matrix.module }}
        run: go test -race -timeout 10m ./...
  js:
    needs: planner
    if: needs.planner.outputs.js == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.js_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner hardware
        if: ${{ matrix.component == 'apps/native' && (matrix.index == null || matrix.index == 0) }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ${{ matrix.component == 'apps/desktop' && 'apps/desktop/.node-version' || '.node-version' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
            website/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          COMPONENT: ${{ matrix.component }}
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --component "$COMPONENT" --index '${{ matrix.index }}'
      - name: Install owning lockfiles
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          npm ci
          case "$COMPONENT" in
            apps/*|website) (cd "$COMPONENT" && npm ci --legacy-peer-deps --workspaces=false) ;;
          esac
      - env:
          COMPONENT: ${{ matrix.component }}
        run: python3 ci/run.py js --component "$COMPONENT" --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: js-${{ matrix.component == 'apps/native' && 'native' || matrix.component == 'apps/desktop' && 'desktop' || matrix.component == 'apps/vega' && 'vega' || matrix.component }}-${{ matrix.index }}
          path: ci-results/js/
          if-no-files-found: error
  android:
    needs: planner
    if: needs.planner.outputs.android == 'true'
    uses: ./.github/workflows/android-tests.yml
  diagnostic:
    needs: [planner, go_build]
    strategy:
      fail-fast: false
      matrix:
        # Each matrix job has its own hosted VM: mixed-load compilation and
        # execution cannot contend with the existing pressure cohort.
        lane: [pressure, golden, scanner, mixed-load]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: playback-helper
          path: ci-tools
      - run: python3 ci/run.py download
      - env:
          LANE: ${{ matrix.lane }}
        run: python3 ci/nightly_lane.py "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-${{ matrix.lane }}
          path: ci-results/
  inventory_benchmark:
    # A real 128-file page against 1k/1M distinct normalized inventory objects.
    # Construction is excluded; the actual lookup and writer enforce work bounds.
    needs: planner
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Measure unchanged inventory lookup and page publication
        working-directory: server
        run: |
          set -o pipefail
          go test -p 1 -run '^$' -bench '^BenchmarkInventoryUnchangedDatabasePage$' -benchtime=1x -count=1 -v -timeout=65m ./internal/catalog | tee "$RUNNER_TEMP/inventory-benchmark.log"
      - name: Require all benchmark and fixture receipts
        run: python3 ci/inventory_benchmark.py "$RUNNER_TEMP/inventory-benchmark.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inventory-benchmark
          path: ${{ runner.temp }}/inventory-benchmark.log
          if-no-files-found: error
          retention-days: 14
  merge:
    name: ci/nightly/full
    if: ${{ !cancelled() }}
    needs: [planner, go_build, go_tests, js, android, diagnostic, inventory_benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.planner.outputs.go == 'true'
        with:
          pattern: go-*
          path: ci-results/go
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.planner.outputs.js == 'true'
        with:
          pattern: js-*
          path: ci-results/js
          merge-multiple: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 ci/run.py aggregate --needs "$RESULTS"
          python3 -c 'import json,os; assert json.loads(os.environ["RESULTS"])["diagnostic"]["result"] == "success"'
          python3 -c 'import json,os; assert json.loads(os.environ["RESULTS"])["inventory_benchmark"]["result"] == "success"'
