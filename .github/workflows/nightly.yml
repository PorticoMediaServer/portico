name: Race cohort hosted qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - id: plan
        name: Plan exact catalog and housekeeping cohorts
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/workflow-sha.txt
          git rev-parse HEAD:ci > evidence/ci-tree.txt
          echo '33a2ad169acb5aaf02ac9f7d6198b74a3422fee9' > evidence/expected-ci-tree.txt
          echo '84a32d57bb6a9570370c020f53126dabe2c97fa7' > evidence/code-sha.txt
          cmp evidence/ci-tree.txt evidence/expected-ci-tree.txt
          python3 ci/plan.py --full --tier nightly
          python3 ci/race_plan.py
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          race=json.loads(Path('ci-race-plan.json').read_text())
          selected=[{'index':i} for i,c in enumerate(race['cohorts']) if c['package'].endswith(('/internal/catalog','/cmd/server'))]
          if not selected: raise SystemExit('missing qualification cohorts')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('matrix='+json.dumps({'include':selected})+'\n')
          Path('evidence/selected-cohorts.json').write_text(json.dumps(selected))
          PYTHON
          python3 ci/run.py helper
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: race-qualification-plan
          path: |
            ci-plan.json
            ci-race-plan.json
            evidence
            ci-tools/portico-server
          retention-days: 3
  cohorts:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: race-qualification-plan
      - name: Observe the exact cohort with unchanged deadlines
        env:
          PORTICO_CI_GO_RACE: '1'
        run: python3 ci/race_report.py --cohort-plan ci-race-plan.json --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: race-cohort-${{ matrix.index }}
          path: ci-race-results
          retention-days: 3
