name: Mac 837 portable inventory attribution (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos_suite:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: before
            source: 17b6b9ce938a10dbffa3d25fe27873ac8c816035
          - phase: fixed
            source: 7d397ba92a789fa1966c9cbfe3be96f2cde604a9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: Original full package order and unchanged deadlines
        env:
          HARNESS_SHA: ${{ github.sha }}
          PORTICO_FFMPEG: ${{ runner.temp }}/engine/bin/ffmpeg
          PORTICO_FFPROBE: ${{ runner.temp }}/engine/bin/ffprobe
          PORTICO_CI_ENGINE: development
        run: |
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          git show "$HARNESS_SHA:ci/mac837_inventory_diagnostic.py" > "$RUNNER_TEMP/mac837_inventory_diagnostic.py"
          python3 "$RUNNER_TEMP/mac837_inventory_diagnostic.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mac837-${{ matrix.phase }}
          path: ${{ runner.temp }}/mac837-evidence
