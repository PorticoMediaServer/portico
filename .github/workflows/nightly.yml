name: Exact nightly pressure cohort before and after
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pressure-cohort-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        replica: [a, b]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Prepare matching source and scoped counters
        env:
          VARIANT: ${{ matrix.variant }}
        run: python3 ci/pressure_cost_diagnostic.py "$VARIANT"
      - run: python3 ci/plan.py --full --tier nightly
      - run: python3 ci/run.py download
      - name: Exact nightly cohort, unchanged concurrency and budgets
        env:
          PORTICO_PRESSURE_COST: '1'
        run: python3 ci/nightly_lane.py pressure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pressure-cohort-${{ matrix.variant }}-${{ matrix.replica }}
          path: |
            ci-results/
            ci-plan.json
          retention-days: 7
