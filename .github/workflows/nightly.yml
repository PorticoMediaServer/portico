name: Darwin archive resource diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Capture exact worker failures
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          uname -a > evidence/platform.txt
          cd server
          set +e
          go test -json -p 1 -count=1 -timeout=300s -run '^TestLimitedWorkerCanAllocateItsBudget$' ./internal/archive7z > ../evidence/limit.jsonl 2> ../evidence/limit.stderr
          echo "$?" > ../evidence/limit.exit
          go test -json -tags=portico_rar7z -p 1 -count=1 -timeout=300s -run '^TestOpenClassicComic(Compressed|Solid)RAR4Worker$' ./internal/reading > ../evidence/worker.jsonl 2> ../evidence/worker.stderr
          echo "$?" > ../evidence/worker.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-archive-policy
          path: evidence
          retention-days: 3
