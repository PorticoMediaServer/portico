name: Empty visibility source same VM qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: python3 ci/plan.py --full --tier nightly
      - run: python3 ci/run.py download
      - name: A B A B timing then A B statement attribution
        run: python3 ci/total_changes_diag.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: empty-source-pressure
          path: |
            source-pressure-results/
            ci-plan.json
          retention-days: 7
