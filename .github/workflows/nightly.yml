name: Playback lifetime race qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifetime_race:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [playbackv1, httpapi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Verify exact production and test sources
        run: |
          git diff --exit-code 73e23882d6385fd622af0d12022495caf4d4a641 -- server apikit ci
          mkdir evidence
          git rev-parse HEAD > evidence/workflow-sha.txt
          echo 73e23882d6385fd622af0d12022495caf4d4a641 > evidence/code-sha.txt
      - name: Run focused race parents
        env:
          TARGET_PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          cd server
          go test -race -json -p 1 -count=1 -timeout=780s -run '^Test(PlaybackShutdown.*|AdvanceToAChosenEntryStartsAtTheGivenPosition|PlaybackV1PreparedProgressActivatesOnlyAtCommit|RouterPlaybackShutdownControlsItsActualOwner)$' ./internal/"$TARGET_PACKAGE" > ../evidence/race.jsonl 2> ../evidence/race.stderr
      - name: Require actual pass terminals
        env:
          TARGET_PACKAGE: ${{ matrix.package }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          expected = {
              'playbackv1': ['TestPlaybackShutdownJoinsTheLastDatabaseTouchAndRefusesNewWorkers', 'TestPlaybackShutdownDeadlineBoundsAStuckWorkerAndCanJoinAgain', 'TestAdvanceToAChosenEntryStartsAtTheGivenPosition'],
              'httpapi': ['TestPlaybackV1PreparedProgressActivatesOnlyAtCommit', 'TestRouterPlaybackShutdownControlsItsActualOwner'],
          }[os.environ['TARGET_PACKAGE']]
          events = [json.loads(line) for line in Path('evidence/race.jsonl').read_text().splitlines()]
          for name in expected:
              states = [e['Action'] for e in events if e.get('Test') == name and e.get('Action') in ('pass','fail','skip')]
              if states != ['pass']:
                  raise SystemExit(f'{name}: required pass, got {states}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-lifetime-race-${{ matrix.package }}
          path: evidence
          retention-days: 3
