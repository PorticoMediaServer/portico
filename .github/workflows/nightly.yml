name: Native runtime generation branch proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-generation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg bubblewrap
      - name: Paired native identity cost and request boundaries
        working-directory: server
        env:
          GOMAXPROCS: 4
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-results"
          set -o pipefail
          ffmpeg -version | head -3 | tee "$RUNNER_TEMP/runtime-results/engine.txt"
          tags=$(python3 ../scripts/release-build-tags.py --capability)
          go test -p=2 -tags "$tags" -count=1 -v ./internal/mediaexec ./internal/decoder ./internal/playback -run 'CachedRuntimeIdentity|HardwareCachedSelection|DirectStartChecksHardwareGenerationOutsideWriter|HardwareProbeRefusesReplacement|HardwareProbeRequiresNative' 2>&1 | tee "$RUNNER_TEMP/runtime-results/contracts.log"
          go test -p=2 -tags "$tags" ./internal/mediaexec -run '^$' -bench '^BenchmarkRuntimeIdentityGeneration$' -benchtime=3x -count=3 -benchmem 2>&1 | tee "$RUNNER_TEMP/runtime-results/bench.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-runtime-generation-proof
          path: ${{ runner.temp }}/runtime-results
          retention-days: 7
