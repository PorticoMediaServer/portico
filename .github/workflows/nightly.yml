name: Derived pressure cost diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pressure-cost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        idle: ['0', '1']
        replica: ['a', 'b']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Attribute unchanged 130-film worker quanta
        working-directory: server
        env:
          PORTICO_PRESSURE_COST: '1'
          PORTICO_PRESSURE_IDLE: ${{ matrix.idle }}
        run: |
          mkdir -p ../ci-results
          go test -json -count=1 -p=1 -tags=portico_rar7z,portico_cb7 -timeout=2m ./internal/compactcatalog -run '^TestDerivedWorkerCompletesWithForegroundPressure$' > ../ci-results/pressure.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pressure-cost-${{ matrix.idle }}-${{ matrix.replica }}
          path: ci-results
          retention-days: 7
