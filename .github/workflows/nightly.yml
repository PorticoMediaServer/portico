name: Full deterministic inventory
# Bootstrap is green; nightly owns the pressure/scale diagnostics below.
on:
  workflow_dispatch:
    inputs:
      hosted_only:
        description: No-op; all jobs already use GitHub-hosted Ubuntu
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  # One queue per ref: a dispatch on a branch never cancels a pending run on main or another branch.
  group: nightly-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
            apps/vega/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install typed ratchet owning lockfiles
        run: |
          for component in apps/native apps/vega apps/desktop; do
            (cd "$component" && npm ci --ignore-scripts --legacy-peer-deps --workspaces=false --no-audit --no-fund)
          done
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: python3 ci/source_guard.py
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/gitleaks-cache/gitleaks.tar.gz
          key: gitleaks-8.30.1-551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: false
      - env:
          GITLEAKS_TARBALL_CACHE: ${{ runner.temp }}/gitleaks-cache/gitleaks.tar.gz
        run: bash ci/secret-scan.sh
      - run: python3 ci/engineering_rules.py
      - run: python3 ci/client_api_census.py
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      go_matrix: ${{ steps.plan.outputs.go_matrix }}
      go: ${{ steps.plan.outputs.go }}
      js: ${{ steps.plan.outputs.js }}
      android: ${{ steps.plan.outputs.android }}
      js_matrix: ${{ steps.plan.outputs.js_matrix }}
      js_static: ${{ steps.plan.outputs.js_static }}
      js_static_matrix: ${{ steps.plan.outputs.js_static_matrix }}
    steps:
      - name: Runner hardware
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - id: plan
        env:
          CI_FULL_PLAN: true
        run: python3 ci/plan.py --full --tier nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selection
          path: ci-plan.json
  go_build:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: python3 ci/run.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playback-helper
          path: ci-tools/portico-server
          if-no-files-found: error
  go_vet_cross:
    # Same as merge.yml: static macOS/Windows vet of every package and test.
    needs: planner
    if: needs.planner.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - run: python3 ci/run.py vet-cross --goos '${{ matrix.goos }}'
  macos_suite:
    # Report-only (lead decision, 1 Nov 2026): the server suite on macOS has never passed end to
    # end, and the release builds no longer run it. This lists every failing test by name so the
    # macOS failures can be fixed in one batch; it becomes blocking once that list is empty.
    needs: planner
    if: needs.planner.outputs.go == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Development engine (NOT FOR USE)
        run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: macOS suite, one shard of packages (report-only)
        working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: '8'
        run: |
          set -euo pipefail
          # macOS's default /var temp path aliases /private/var. Private-directory
          # guards and SQLite compare canonical paths; give fixtures that same root.
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          tags="$(python3 ../scripts/release-build-tags.py --capability)"
          go build -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          export PORTICO_FFMPEG="$RUNNER_TEMP/engine/bin/ffmpeg" PORTICO_FFPROBE="$RUNNER_TEMP/engine/bin/ffprobe" PORTICO_CI_ENGINE=development
          go list -tags "$tags" ./... | awk -v n="$SHARDS" -v i="$SHARD" 'NR % n == i' > "$RUNNER_TEMP/packages.txt"
          mkdir -p "$RUNNER_TEMP/macos-suite"
          status=0
          go test -tags "$tags" -json -timeout 60m $(cat "$RUNNER_TEMP/packages.txt") > "$RUNNER_TEMP/macos-suite/shard-$SHARD.jsonl" 2> "$RUNNER_TEMP/macos-suite/shard-$SHARD.stderr" || status=$?
          python3 - "$RUNNER_TEMP/macos-suite/shard-$SHARD.jsonl" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          failed, blocked = [], set()
          for line in open(sys.argv[1]):
              try: e = json.loads(line)
              except ValueError: continue
              if e.get('Action') == 'fail':
                  (failed.append(f"{e['Package']} {e['Test']}") if e.get('Test') else blocked.add(e['Package']))
          print(f"### macOS suite shard: {len(failed)} failing tests, {len(blocked)} failing packages")
          for name in sorted(failed): print(f"- {name}")
          for name in sorted(blocked - {f.split()[0] for f in failed}): print(f"- {name} (package failed to build or run)")
          PY
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-suite-${{ matrix.shard }}
          path: ${{ runner.temp }}/macos-suite
          retention-days: 7
  decoder_sandbox:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    uses: ./.github/workflows/decoder-sandbox.yml
  go_tests:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.go_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Runner hardware
        if: ${{ matrix.index == 0 }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.reading_client == true
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install real reading-client integration dependencies
        if: matrix.reading_client == true
        run: |
          npm ci --no-audit --no-fund
          (cd packages/contracts && npm run build)
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --index '${{ matrix.index }}'
      - run: python3 ci/run.py go --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: go-${{ matrix.index }}
          path: ci-results/
  go_race:
    name: Go race report (${{ matrix.index }})
    continue-on-error: true
    needs: planner
    if: needs.planner.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.go_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Runner hardware
        if: ${{ matrix.index == 0 }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.reading_client == true
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install real reading-client integration dependencies
        if: matrix.reading_client == true
        run: |
          npm ci --no-audit --no-fund
          (cd packages/contracts && npm run build)
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --index '${{ matrix.index }}'
      - name: Observe races (timing and other diagnostics are separate)
        env:
          PORTICO_CI_GO_RACE: '1'
        run: python3 ci/race_report.py --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: race-${{ matrix.index }}
          path: ci-race-results/
          if-no-files-found: warn
  js:
    needs: planner
    if: needs.planner.outputs.js == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.js_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner hardware
        if: ${{ matrix.component == 'apps/native' && (matrix.index == null || matrix.index == 0) }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ${{ matrix.component == 'apps/desktop' && 'apps/desktop/.node-version' || '.node-version' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
            website/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          COMPONENT: ${{ matrix.component }}
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --component "$COMPONENT" --index '${{ matrix.index }}'
      - name: Install owning lockfiles
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          npm ci
          case "$COMPONENT" in
            apps/*|website) (cd "$COMPONENT" && npm ci --legacy-peer-deps --workspaces=false) ;;
          esac
      - env:
          COMPONENT: ${{ matrix.component }}
        run: python3 ci/run.py js --component "$COMPONENT" --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: js-${{ matrix.component == 'apps/native' && 'native' || matrix.component == 'apps/desktop' && 'desktop' || matrix.component == 'apps/vega' && 'vega' || matrix.component }}-${{ matrix.index }}
          path: ci-results/js/
          if-no-files-found: error
  js_static:
    needs: planner
    if: needs.planner.outputs.js_static == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.js_static_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ${{ matrix.component == 'apps/desktop' && 'apps/desktop/.node-version' || '.node-version' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
            website/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - name: Install owning lockfiles
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          npm ci
          case "$COMPONENT" in
            apps/*|website) (cd "$COMPONENT" && npm ci --legacy-peer-deps --workspaces=false) ;;
          esac
      - env:
          COMPONENT: ${{ matrix.component }}
        run: python3 ci/run.py js-static --component "$COMPONENT"
  android:
    needs: planner
    if: needs.planner.outputs.android == 'true'
    uses: ./.github/workflows/android-tests.yml
  diagnostic:
    needs: [planner, go_build]
    strategy:
      fail-fast: false
      matrix:
        # Each matrix job has its own hosted VM: mixed-load compilation and
        # execution cannot contend with the existing pressure cohort.
        lane: [pressure, golden, scanner, mixed-load]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: playback-helper
          path: ci-tools
      - run: python3 ci/run.py download
      - env:
          LANE: ${{ matrix.lane }}
        run: python3 ci/nightly_lane.py "$LANE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-${{ matrix.lane }}
          path: ci-results/
  inventory_benchmark:
    # A real 128-file page against 1k/1M distinct normalized inventory objects.
    # Construction is excluded; the actual lookup and writer enforce work bounds.
    needs: planner
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Measure unchanged inventory lookup and page publication
        working-directory: server
        run: |
          set -o pipefail
          go test -p 1 -run '^$' -bench '^BenchmarkInventoryUnchangedDatabasePage$' -benchtime=1x -count=1 -v -timeout=65m ./internal/catalog | tee "$RUNNER_TEMP/inventory-benchmark.log"
      - name: Require all benchmark and fixture receipts
        run: python3 ci/inventory_benchmark.py "$RUNNER_TEMP/inventory-benchmark.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inventory-benchmark
          path: ${{ runner.temp }}/inventory-benchmark.log
          if-no-files-found: error
          retention-days: 14
  merge:
    name: ci/nightly/full
    if: ${{ !cancelled() }}
    needs: [planner, hygiene, go_build, go_vet_cross, go_tests, decoder_sandbox, js, js_static, android, diagnostic, inventory_benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.planner.outputs.go == 'true'
        with:
          pattern: go-*
          path: ci-results/go
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.planner.outputs.js == 'true'
        with:
          pattern: js-*
          path: ci-results/js
          merge-multiple: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 ci/run.py aggregate --needs "$RESULTS"
          python3 -c 'import json,os; assert json.loads(os.environ["RESULTS"])["diagnostic"]["result"] == "success"'
          python3 -c 'import json,os; assert json.loads(os.environ["RESULTS"])["inventory_benchmark"]["result"] == "success"'
