name: Planner write phase diagnostic on the failing scanner cohort
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 41826315430 -R PorticoMediaServer/portico -n selection -D "$RUNNER_TEMP/original-selection"
      - run: python3 ci/run.py download --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - run: python3 ci/run.py ffmpeg --index 7 --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - name: Original go-7 neighbours and ten unchanged planner fixtures
        run: python3 ci/run.py go --index 7 --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: planner-write-phases
          path: ci-results/
          retention-days: 7
