name: Artwork recorded shard diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: artwork-deadline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {replay: baseline-pr677-a, variant: baseline, source_run: '41792546748', shard: 4}
          - {replay: baseline-pr677-b, variant: baseline, source_run: '41792546748', shard: 4}
          - {replay: baseline-pr681-a, variant: baseline, source_run: '41793452518', shard: 3}
          - {replay: baseline-pr681-b, variant: baseline, source_run: '41793452518', shard: 3}
          - {replay: fixed-pr677-a, variant: fixed, source_run: '41792546748', shard: 4}
          - {replay: fixed-pr677-b, variant: fixed, source_run: '41792546748', shard: 4}
          - {replay: fixed-pr681-a, variant: fixed, source_run: '41793452518', shard: 3}
          - {replay: fixed-pr681-b, variant: fixed, source_run: '41793452518', shard: 3}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 3}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Restore original artwork entrypoints for the baseline
        if: matrix.variant == 'baseline'
        run: |
          git restore --source HEAD~2 -- server/internal/metadata/artwork.go server/internal/metadata/artwork_preview.go
          python3 -c "from pathlib import Path; Path('server/internal/metadata/artwork_snapshot_test.go').unlink()"
      - name: Fetch the failing short shard's exact recorded selection
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ matrix.source_run }}
        run: gh run download "$SOURCE_RUN" -R PorticoMediaServer/portico -n selection -D "$RUNNER_TEMP/original-selection"
      - run: python3 ci/run.py download --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - run: python3 ci/run.py ffmpeg --index ${{ matrix.shard }} --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - name: Replay the original four-package short shard
        env:
          PORTICO_ARTWORK_DIAGNOSTIC: '1'
          PORTICO_CI_GO_PACKAGE_JOBS: '4'
        run: python3 ci/run.py go --index ${{ matrix.shard }} --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artwork-replay-${{ matrix.replay }}
          path: ci-results
          retention-days: 7
