name: Artwork deadline diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artwork-deadline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [focused, package-short]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Diagnose snapshot admission and lifetime
        working-directory: server
        env:
          PORTICO_ARTWORK_DIAGNOSTIC: '1'
          MODE: ${{ matrix.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/artwork-diagnostic"
          set -o pipefail
          if [ "$MODE" = focused ]; then
            go test -json -run '^TestArtworkSlowPublicationDoesNotBlockReadsOrPreviews$' -count=12 -p 1 ./internal/metadata | tee "$RUNNER_TEMP/artwork-diagnostic/result.jsonl"
          else
            go test -short -json -count=1 -p 1 ./internal/metadata | tee "$RUNNER_TEMP/artwork-diagnostic/result.jsonl"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artwork-diagnostic-${{ matrix.mode }}
          path: ${{ runner.temp }}/artwork-diagnostic
          retention-days: 7
