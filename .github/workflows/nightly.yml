name: macOS adaptive inventory boundary controls (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: Real portable EOF and legal adaptive-budget HTTP controls
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          export PORTICO_FFMPEG="$RUNNER_TEMP/engine/bin/ffmpeg" PORTICO_FFPROBE="$RUNNER_TEMP/engine/bin/ffprobe" PORTICO_CI_ENGINE=development
          tags="$(python3 scripts/release-build-tags.py --capability)"
          go build -C server -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          python3 ci/macos_reading_budget_diagnostic.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-reading-budget-controls
          path: evidence/
