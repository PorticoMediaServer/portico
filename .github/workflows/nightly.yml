name: Darwin native AS qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Capture exact worker failures
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          uname -a > evidence/platform.txt
          cd server
          export CGO_ENABLED=0
          set +e
          go test -json -p 1 -count=1 -timeout=300s -run '^Test(LimitedWorkerCanAllocateItsBudget|DiagnosticNativeASRefusesOverBudget)$' ./internal/archive7z > ../evidence/limit.jsonl 2> ../evidence/limit.stderr
          echo "$?" > ../evidence/limit.exit
          go test -json -tags=portico_rar7z -p 1 -count=1 -timeout=300s -run '^Test(OpenClassicComic(Compressed|Solid)RAR4Worker|DiagnosticCB7Worker)$' ./internal/reading > ../evidence/worker.jsonl 2> ../evidence/worker.stderr
          echo "$?" > ../evidence/worker.exit
          go test -json -p 1 -count=1 -timeout=300s -run '^TestArtworkEnumerationUsesActualNamesStampsAndConfinedReads$' ./internal/ingestion > ../evidence/artwork.jsonl 2> ../evidence/artwork.stderr
          echo "$?" > ../evidence/artwork.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-archive-policy
          path: evidence
          retention-days: 3

  apfs:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [916ff8690c2216acf1a7d4ac819bbb373a9e3e13, c937dd0ecfbb18cb8c12abec325787738aee166d]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Check APFS behavior
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          cd server
          set +e
          go test -json -p 1 -count=1 -run '^TestFilesystemFlagsReasonsAndCursorScope$' ./internal/administration > ../evidence/apfs.jsonl 2> ../evidence/apfs.stderr
          echo "$?" > ../evidence/apfs.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apfs-${{ matrix.source }}
          path: evidence
          retention-days: 3

  product:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5bf291848d1b5ba5d926d4b81bc562de9d24d15f
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Require native acceptance and memory refusal
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          export CGO_ENABLED=0
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          cd server
          set +e
          go test -json -p 1 -count=1 -run '^Test(Darwin|LimitedWorkerCanAllocateItsBudget|WorkerReads)' ./internal/archive7z > ../evidence/limit.jsonl 2> ../evidence/limit.stderr
          limit_result=$?
          go test -json -tags=portico_rar7z,portico_cb7 -p 1 -count=1 -run '^Test(CB7WorkerReadsAdmittedPages|OpenClassicComic(Compressed|Solid)RAR4Worker)$' ./internal/reading > ../evidence/worker.jsonl 2> ../evidence/worker.stderr
          worker_result=$?
          test "$limit_result" -eq 0 && test "$worker_result" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-product-bound
          path: evidence
          retention-days: 3

  artwork:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [6b2b227c122718f7f1b43589eb6f496db3f38131]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Check APFS behavior
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          cd server
          set +e
          go test -json -p 1 -count=1 -run '^TestArtworkEnumerationUsesActualNamesStampsAndConfinedReads$' ./internal/ingestion > ../evidence/artwork.jsonl 2> ../evidence/artwork.stderr
          echo "$?" > ../evidence/artwork.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artwork-${{ matrix.source }}
          path: evidence
          retention-days: 3
