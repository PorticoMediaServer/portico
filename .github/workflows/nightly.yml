name: Source presence branch proof
# Measurement-only override of an existing dispatchable workflow; restore before PR.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-presence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  presence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .source-presence-seeds
          key: source-presence-${{ runner.os }}-${{ hashFiles('server/internal/ingestion/path_presence*.go', 'server/internal/ingestion/scan_loop_test.go', 'server/internal/persistence/migrations/0001_baseline.sql') }}
      - name: Measure fixed windows and source recovery contracts
        working-directory: server
        env:
          GOMAXPROCS: 4
          PORTICO_PATH_PRESENCE_SCALE: 1
          PORTICO_PATH_PRESENCE_SEED_DIR: ${{ github.workspace }}/.source-presence-seeds
        run: |
          mkdir -p "$RUNNER_TEMP/presence-results"
          set -o pipefail
          go test -p=2 -count=1 -timeout=15m -v ./internal/ingestion -run '^(TestSamePath.*|TestSourceVerification.*|TestMonitorExcludesRemoteOwnedSourcesAndUsesPresenceAtStartup|TestDirectoryHintDoesNotAuthorizeEmptyRoot|TestHiddenJunkDoesNotAuthorizeEmptyRoot)$' 2>&1 | tee "$RUNNER_TEMP/presence-results/proof.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-presence-proof
          path: ${{ runner.temp }}/presence-results
          retention-days: 7
