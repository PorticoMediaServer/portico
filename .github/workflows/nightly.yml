name: Darwin reading HTTP scan diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading_http:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Development engine (NOT FOR USE)
        run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: Diagnose scan warnings in actual HTTP fixture
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          tags="$(python3 scripts/release-build-tags.py --capability)"
          cd server
          go build -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          export PORTICO_FFMPEG="$RUNNER_TEMP/engine/bin/ffmpeg" PORTICO_FFPROBE="$RUNNER_TEMP/engine/bin/ffprobe" PORTICO_CI_ENGINE=development
          set +e
          go test -tags "$tags" -json -p 1 -count=1 -run '^TestReadingRegisteredIndependentOpenLifetimes$' ./internal/httpapi > ../evidence/http.jsonl 2> ../evidence/http.stderr
          echo "$?" > ../evidence/http.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-reading-http
          path: evidence
          retention-days: 3
