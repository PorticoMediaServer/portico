name: Retention paired branch proof
# Measurement-only branch: never merge this workflow override.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retention-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retention:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fa3fcaf7337a8ae6f675208a22bed375b1993803
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .retention-seeds
          key: retention-${{ runner.os }}-${{ hashFiles('server/internal/ingestion/retention_growth_test.go', 'server/internal/ingestion/scan_loop_test.go', 'server/internal/persistence/migrations/0001_baseline.sql') }}
      - name: Verify baseline and install measurement-only overlay
        run: |
          mkdir -p "$RUNNER_TEMP/retention-results"
          git rev-parse HEAD > "$RUNNER_TEMP/retention-results/feature-sha.txt"
          git -C baseline rev-parse HEAD > "$RUNNER_TEMP/retention-results/baseline-sha.txt"
          cmp server/internal/persistence/migrations/0001_baseline.sql baseline/server/internal/persistence/migrations/0001_baseline.sql
          cp server/internal/ingestion/retention_growth_test.go baseline/server/internal/ingestion/retention_growth_test.go
          sha256sum server/internal/ingestion/retention.go baseline/server/internal/ingestion/retention.go > "$RUNNER_TEMP/retention-results/production-hashes.txt"
      - name: Fixed windows and immutable seeds
        working-directory: server
        env:
          GOMAXPROCS: 4
          PORTICO_RETENTION_SCALE: 1
          PORTICO_RETENTION_SEED_DIR: ${{ github.workspace }}/.retention-seeds
        run: |
          set -o pipefail
          go test -p=2 -count=1 -timeout=12m -v ./internal/ingestion -run '^TestScanRetentionGrowthMeasurement$' 2>&1 | tee "$RUNNER_TEMP/retention-results/after.log"
      - name: Unmodified baseline windows on the same seeds
        working-directory: baseline/server
        env:
          GOMAXPROCS: 4
          PORTICO_RETENTION_SCALE: 1
          PORTICO_RETENTION_SEED_DIR: ${{ github.workspace }}/.retention-seeds
        run: |
          set -o pipefail
          go test -p=2 -count=1 -timeout=12m -v ./internal/ingestion -run '^TestScanRetentionGrowthMeasurement$' 2>&1 | tee "$RUNNER_TEMP/retention-results/before.log"
      - name: Fixed unconditional regression guard
        working-directory: server
        env:
          GOMAXPROCS: 4
        run: |
          set -o pipefail
          go test -p=2 -count=1 -timeout=5m -v ./internal/ingestion -run '^(TestScanRetention.*|TestPruneSource.*|TestChangeFeed.*|TestManagedListing.*|TestSubtitleRetention.*)$' 2>&1 | tee "$RUNNER_TEMP/retention-results/contracts.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retention-plan-proof
          path: ${{ runner.temp }}/retention-results
          retention-days: 7
