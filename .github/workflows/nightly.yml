name: macOS fixture qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos_fixtures:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            source: 758baaaa3a995d255b171ea7631d881dfdddf4db
            packages: ./internal/decoder ./internal/playback ./internal/mounts
            pattern: ^Test(BuildConversionQualifiedDecodeBurnInGraph|SDRHardwareScaleDoesNotRequireToneMap|HardwareDecodeOffKeepsDecodingOnTheProcessor|AccountConfig.*)$
          - name: hardware
            source: 3edab10ef490b30cfb4a947f7a33e320d216c122
            packages: ./internal/decoder ./internal/playback
            pattern: ^Test(BuildConversionQualifiedDecodeBurnInGraph|SDRHardwareScaleDoesNotRequireToneMap|HardwareDecodeOffKeepsDecodingOnTheProcessor)$
          - name: config
            source: be649e5deff91343e4f217672f705f2640c31eba
            packages: ./internal/mounts
            pattern: ^TestAccountConfig
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - name: Run exact platform fixtures
        env:
          TARGET_PACKAGES: ${{ matrix.packages }}
          TARGET_TESTS: ${{ matrix.pattern }}
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          mkdir evidence
          git rev-parse HEAD > evidence/source-sha.txt
          read -r -a packages <<< "$TARGET_PACKAGES"
          cd server
          set +e
          go test -json -p 1 -count=1 -timeout=780s -run "$TARGET_TESTS" "${packages[@]}" > ../evidence/go.jsonl 2> ../evidence/go.stderr
          result=$?
          set -e
          echo "$result" > ../evidence/exit-code.txt
      - name: Validate failing control or complete pass
        env:
          QUALIFICATION_CASE: ${{ matrix.name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          hardware = ['TestBuildConversionQualifiedDecodeBurnInGraph', 'TestSDRHardwareScaleDoesNotRequireToneMap', 'TestHardwareDecodeOffKeepsDecodingOnTheProcessor']
          config = ['TestAccountConfigRemotesProjectNamesAndReasonsOnly', 'TestAccountConfigRemotesAreEmptyWhenAbsent', 'TestAccountConfigSectionIsPlainAndValidated', 'TestAccountConfigReportsItsOwnListBound', 'TestAccountConfigReceiptIdentityIgnoresMutableContent', 'TestAccountConfigDuplicateNameIsNeverSilentlyFirst', 'TestAccountConfigAmbiguousGrammarIsWithheld', 'TestAccountConfigRejectsNonRegularFiles']
          case = os.environ['QUALIFICATION_CASE']
          selected = hardware + config if case == 'before' else hardware if case == 'hardware' else config
          failures = set(hardware + config) - {'TestAccountConfigRemotesAreEmptyWhenAbsent', 'TestAccountConfigReceiptIdentityIgnoresMutableContent'} if case == 'before' else set()
          events = [json.loads(line) for line in Path('evidence/go.jsonl').read_text().splitlines()]
          code = int(Path('evidence/exit-code.txt').read_text())
          if code != (1 if failures else 0):
              raise SystemExit(f'{case}: unexpected exit {code}')
          for name in selected:
              states = [e['Action'] for e in events if e.get('Test') == name and e.get('Action') in ('pass','fail','skip')]
              want = ['fail' if name in failures else 'pass']
              if states != want:
                  raise SystemExit(f'{case} {name}: expected {want}, got {states}')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-fixtures-${{ matrix.name }}
          path: evidence
          retention-days: 3
