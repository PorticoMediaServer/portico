name: macOS residual attribution (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  residuals:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: python3 scripts/development-engine.py fetch --target macos-arm64 --output "$RUNNER_TEMP/engine"
      - name: Reading warnings, complete disc pages, and reader start ordering
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          export TMPDIR="$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]))')"
          tags="$(python3 scripts/release-build-tags.py --capability)"
          go build -C server -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          export PORTICO_FFMPEG="$RUNNER_TEMP/engine/bin/ffmpeg" PORTICO_FFPROBE="$RUNNER_TEMP/engine/bin/ffprobe" PORTICO_CI_ENGINE=development
          set +e
          go test -C server -p 1 -json -count=3 -timeout=780s -tags "$tags" -run '^TestReading(DiscoverOperationStrictAndBounded|InitialReadyHasNoPollDelayOrHiddenHandle)$' ./internal/httpapi > evidence/reading.jsonl 2> evidence/reading.stderr
          echo "$?" > evidence/reading.exit
          go test -C server -p 1 -json -count=3 -timeout=780s -tags "$tags" -run '^TestDiscObservationCommitsWithSingleAndBatchedPages$' ./internal/catalog > evidence/disc.jsonl 2> evidence/disc.stderr
          echo "$?" > evidence/disc.exit
          go test -C server -p 1 -json -count=10 -timeout=780s -tags "$tags" -run '^TestPlaylistPagesSortsFiltersTiesAndReorder$' ./internal/catalog/scalebench > evidence/playlist.jsonl 2> evidence/playlist.stderr
          echo "$?" > evidence/playlist.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-residuals
          path: evidence/
