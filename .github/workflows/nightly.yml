name: Admitted finite admin events exact cohort diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: main-reds-fixed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {replay: access-fixed-a, shard: 8}
          - {replay: access-fixed-b, shard: 8}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - name: Fetch the main run's exact recorded selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41825281590 -R PorticoMediaServer/portico -n selection -D "$RUNNER_TEMP/original-selection"
      - run: python3 ci/run.py download --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - run: python3 ci/run.py ffmpeg --index ${{ matrix.shard }} --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - name: Replay original shard with unchanged deadlines and parallel package neighbours
        run: python3 ci/run.py go --index ${{ matrix.shard }} --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: main-reds-phase-${{ matrix.replay }}
          path: ci-results
          retention-days: 7
