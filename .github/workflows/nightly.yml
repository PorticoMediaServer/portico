name: Native backup WAL pressure checkpoint-owner control
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 41825281590 -R PorticoMediaServer/portico -n selection -D "$RUNNER_TEMP/original-selection"
      - run: python3 ci/run.py download --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - run: python3 ci/run.py ffmpeg --index 2 --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci --no-audit --no-fund
      - name: Same VM actual WAL pressure, original then production-owner fixture
        env:
          RECORDED_PLAN: '${{ runner.temp }}/original-selection/ci-plan.json'
        run: python3 ci/backup_native_pressure_diag.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backup-native-pressure
          path: backup-native-*/
          retention-days: 7
