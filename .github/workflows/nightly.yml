name: Backup stale reservation observation owner control
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh run download 41825281590 -R PorticoMediaServer/portico -n selection -D "$RUNNER_TEMP/original-selection"
      - run: python3 ci/run.py download --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - name: Same VM stale-observation baseline then production-owner fixture
        env:
          RECORDED_PLAN: '${{ runner.temp }}/original-selection/ci-plan.json'
        run: python3 ci/backup_owner_control_diag.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backup-owner-stale-observation
          path: backup-owner-*/
          retention-days: 7
