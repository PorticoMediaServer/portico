name: AirPlay real-source failure attribution (diagnostic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Exact real-source parent with failure-site evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          tags="$(python3 scripts/release-build-tags.py --capability)"
          go build -C server -tags "$tags" -o "$RUNNER_TEMP/portico-server" ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$RUNNER_TEMP/portico-server"
          set +e
          go test -C server -p 1 -json -count=5 -timeout=780s -tags "$tags" -run '^TestAirPlayReceiverPreparesExactCurrentChoicesBeforeHandoff$' ./internal/httpapi > evidence/airplay.jsonl 2> evidence/airplay.stderr
          echo "$?" > evidence/airplay.exit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: airplay-failure-attribution
          path: evidence/
