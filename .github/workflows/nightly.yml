name: Artwork shard contention phase replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        replay: [cpu-two]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Fetch the exact failing short selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41870228994 -R PorticoMediaServer/portico -n selection -D "$RUNNER_TEMP/original-selection"
      - run: python3 ci/run.py download --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - run: python3 ci/run.py ffmpeg --index 3 --plan "$RUNNER_TEMP/original-selection/ci-plan.json"
      - name: Replay all 883 recorded tests at original four-package concurrency
        env:
          PORTICO_ARTWORK_DIAGNOSTIC: '1'
          PORTICO_CI_GO_PACKAGE_JOBS: '4'
          GOMAXPROCS: '4'
        run: python3 ci/artwork_cpu_contention.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artwork-contention-${{ matrix.replay }}
          path: ci-results
          retention-days: 7
