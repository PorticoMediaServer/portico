name: E2E Live TV fixture
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  live-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: '**/go.sum'}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-e2e-media
          key: e2e-media-${{ runner.os }}-${{ hashFiles('scripts/e2e-server.py', 'tests/e2e/augment_media.py', 'third_party/apple-subtitles/test/make-pgs.py', 'fixtures/library-layout/Audiobooks/Test Listener/cover.png') }}
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build disposable devtrust server
        working-directory: server
        run: go build -tags devtrust -o "$RUNNER_TEMP/portico-e2e-server" ./cmd/server
      - name: Verify fixture and guide
        run: |
          set -o pipefail
          python3 tests/e2e/server.py --binary "$RUNNER_TEMP/portico-e2e-server" --media-cache "$RUNNER_TEMP/portico-e2e-media" --live -- python3 tests/e2e/live_smoke.py 2>&1 | tee "$RUNNER_TEMP/e2e-live-fixture.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e-live-fixture-log
          path: ${{ runner.temp }}/e2e-live-fixture.log
          if-no-files-found: warn
          retention-days: 14
