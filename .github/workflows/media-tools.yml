name: Media tools
# Builds Portico's media tools (ffmpeg, ffprobe and the portico-disc helper) from jellyfin-ffmpeg
# with its own builder; third_party/ffmpeg/build.sh says how. A run does ONE stage for ONE
# platform, so a mistake costs minutes:
#
#   check      no compiler: patches apply, recipes parse, the option list has what is wanted.
#              Runs on every pull request that touches the build, and first in every run.
#   sources    fetch every pinned library source and its licence text
#   compiler   upstream's compiler image; built once per upstream version and kept
#   libraries  every library, each kept once built ("library" builds one alone)
#   helper     portico-disc, then the disc tests against the fixtures
#   configure  FFmpeg's configure step alone
#   bundle     ffmpeg and ffprobe, the helper, and the finished bundle as a run artifact
#              (for arm64, built on x86, the bundle's programs are then run on an arm64 runner)
#   test       the server's media and disc tests against the bundle of an earlier run
#
# The kept layers are container images named build-cache-ffmpeg-* in the project's registry.
# They are build caches. Nothing here signs or publishes a release.
on:
  pull_request:
    paths:
      - third_party/ffmpeg/**
      - third_party/portico-disc/**
      - .github/workflows/media-tools.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for
        type: choice
        default: linux-x64
        options: [linux-x64, linux-arm64]
      stage:
        description: The one stage to run
        type: choice
        default: check
        options: [check, sources, compiler, libraries, helper, configure, bundle, test]
      library:
        description: With "libraries", build only this recipe (for example portico-soxr); nothing is kept
        type: string
        default: ''
      bundle_run:
        description: With "test", the number of the run whose bundle to test
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: media-tools-${{ github.ref }}-${{ inputs.platform || 'linux-x64' }}-${{ inputs.stage || 'check' }}
  cancel-in-progress: false
env:
  PLATFORM: ${{ inputs.platform || 'linux-x64' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            third_party/ffmpeg
            third_party/portico-disc
      - name: Lay Portico's additions on the pinned source
        run: third_party/ffmpeg/build.sh prepare "$PLATFORM"
      - name: Everything that needs no compiler
        run: third_party/ffmpeg/build.sh check "$PLATFORM"
      - name: The same for Linux arm64, on a pull request
        if: github.event_name == 'pull_request'
        run: third_party/ffmpeg/build.sh prepare linux-arm64 && third_party/ffmpeg/build.sh check linux-arm64

  sources:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'sources'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            third_party/ffmpeg
            third_party/portico-disc
      - run: third_party/ffmpeg/build.sh prepare "$PLATFORM"
      - name: Fetch every pinned library source and its licence text
        run: |
          command -v svn > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq subversion; }
          third_party/ffmpeg/build.sh sources "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media-tools-licences-${{ env.PLATFORM }}
          path: .media-tools/${{ env.PLATFORM }}/licences
          retention-days: 30

  build:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["compiler","libraries","helper","configure","bundle"]'), inputs.stage)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON('{"compiler":100,"libraries":200,"helper":30,"configure":40,"bundle":120}')[inputs.stage] }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Make room on the runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            third_party/ffmpeg
            third_party/portico-disc
            fixtures/discs
            server-next
      - name: Sign in to the project's container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: third_party/ffmpeg/build.sh prepare "$PLATFORM"

      - name: Compiler image
        if: inputs.stage == 'compiler'
        run: third_party/ffmpeg/build.sh compiler "$PLATFORM"

      - name: Libraries
        if: inputs.stage == 'libraries'
        env:
          LIBRARY: ${{ inputs.library }}
        run: third_party/ffmpeg/build.sh libraries "$PLATFORM"

      - name: Library sources and licence texts
        if: inputs.stage == 'bundle'
        run: |
          command -v svn > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq subversion; }
          third_party/ffmpeg/build.sh sources "$PLATFORM"

      - name: Disc helper
        if: inputs.stage == 'helper' || inputs.stage == 'bundle'
        run: third_party/ffmpeg/build.sh helper "$PLATFORM"
      # An arm64 helper cannot run on this x86 runner: the verify job below runs these tests.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: (inputs.stage == 'helper' || inputs.stage == 'bundle') && inputs.platform != 'linux-arm64'
        with:
          go-version-file: server-next/go.mod
          cache: false
      - name: Disc tests against the fixtures
        if: (inputs.stage == 'helper' || inputs.stage == 'bundle') && inputs.platform != 'linux-arm64'
        working-directory: server-next
        env:
          GOWORK: 'off'
          PORTICO_DISC_TEST_BINARY: ${{ github.workspace }}/.media-tools/${{ env.PLATFORM }}/out/portico-disc
        run: go test ./internal/disc -run 'TestHelper' -count=1 -v | grep -E '^(=== RUN|--- |PASS|FAIL|ok|\s+\S+_test.go)' ; exit "${PIPESTATUS[0]}"

      - name: FFmpeg configure step alone
        if: inputs.stage == 'configure'
        run: third_party/ffmpeg/build.sh configure "$PLATFORM"

      - name: ffmpeg and ffprobe
        if: inputs.stage == 'bundle'
        run: third_party/ffmpeg/build.sh compile "$PLATFORM"
      - name: The bundle
        if: inputs.stage == 'bundle'
        run: third_party/ffmpeg/build.sh package "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.stage == 'bundle'
        with:
          # An arm64 bundle built here has not been run yet; it gets its name from the verify job.
          name: portico-media-tools-${{ env.PLATFORM }}${{ inputs.platform == 'linux-arm64' && '-unverified' || '' }}
          path: .media-tools/${{ env.PLATFORM }}/portico-media-tools-${{ env.PLATFORM }}.tar.xz
          retention-days: ${{ inputs.platform == 'linux-arm64' && 3 || 30 }}
          compression-level: 0

  verify:
    # A bundle for arm64 is cross-compiled on x86, so the checks that run its programs happen
    # here, on an arm64 runner: they start, need no extra library, list every wanted feature,
    # and the disc reader reads the fixture discs. Only then is it kept under its real name.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'bundle' && inputs.platform == 'linux-arm64'
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: |
            third_party/ffmpeg
            fixtures/discs
            server-next
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portico-media-tools-${{ env.PLATFORM }}-unverified
          path: ${{ runner.temp }}/download
      - name: Run the bundle's programs
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xJf "$RUNNER_TEMP/download/portico-media-tools-$PLATFORM.tar.xz" -C "$RUNNER_TEMP/bundle"
          MEDIA_TOOLS_BUNDLE="$RUNNER_TEMP/bundle" third_party/ffmpeg/build.sh verify "$PLATFORM"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server-next/go.mod
          cache: false
      - name: Disc tests against the fixtures
        working-directory: server-next
        env:
          GOWORK: 'off'
          PORTICO_DISC_TEST_BINARY: ${{ runner.temp }}/bundle/bin/portico-disc
        run: go test ./internal/disc -run 'TestHelper' -count=1 -v | grep -E '^(=== RUN|--- |PASS|FAIL|ok|\s+\S+_test.go)' ; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portico-media-tools-${{ env.PLATFORM }}
          path: ${{ runner.temp }}/download/portico-media-tools-${{ env.PLATFORM }}.tar.xz
          retention-days: 30
          compression-level: 0

  test:
    # The new server's whole test suite, media tests included, with the bundle as its FFmpeg, and
    # the disc tests with the bundle's helper. Not part of ci/required.
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'test'
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      PORTICO_REQUIRE_DECODER_SANDBOX: '1'
      PORTICO_TEST_TIER: all
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: portico-media-tools-${{ env.PLATFORM }}
          run-id: ${{ inputs.bundle_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/download
      - name: Unpack the bundle and check every file against its manifest
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xJf "$RUNNER_TEMP/download/portico-media-tools-$PLATFORM.tar.xz" -C "$RUNNER_TEMP/bundle"
          python3 - "$RUNNER_TEMP/bundle" <<'EOF'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / 'manifest.json').read_text())
          for name, digest in manifest['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          print(len(manifest['files']), 'files match;', len(manifest['libraries']), 'libraries listed')
          EOF
          "$RUNNER_TEMP/bundle/bin/ffmpeg" -hide_banner -version | head -1
          echo "PORTICO_FFMPEG=$RUNNER_TEMP/bundle/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "PORTICO_FFPROBE=$RUNNER_TEMP/bundle/bin/ffprobe" >> "$GITHUB_ENV"
          echo "PORTICO_DISC_TEST_BINARY=$RUNNER_TEMP/bundle/bin/portico-disc" >> "$GITHUB_ENV"
          echo "PORTICO_DISC_TEST_FFMPEG=$RUNNER_TEMP/bundle/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/bundle/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server-next/go.mod
          cache: true
          cache-dependency-path: server-next/go.sum
      - name: Install bubblewrap and allow unprivileged user namespaces on this VM
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap || { sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap; }
          for setting in kernel.apparmor_restrict_unprivileged_userns=0 kernel.unprivileged_userns_clone=1; do
            key=${setting%%=*}
            if [ -e "/proc/sys/${key//.//}" ]; then sudo sysctl -w "$setting"; fi
          done
          bwrap --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev --cap-drop ALL /bin/true
      - name: Disc tests with the bundle's helper
        working-directory: server-next
        # A skipped test is a failure here: with the bundle every disc test can run.
        run: |
          go test ./internal/disc -count=1 -v > "$RUNNER_TEMP/disc.log" 2>&1 && passed=1
          grep -E '^(--- |PASS|FAIL|ok|panic|\s+\S+_test.go)' "$RUNNER_TEMP/disc.log" || true
          if grep -qE '^\s*--- SKIP' "$RUNNER_TEMP/disc.log"; then echo "a disc test was skipped, so the bundle was not tested by it"; exit 1; fi
          [ "${passed:-0}" = 1 ]
      - name: Real files played through the media engine, each conversion the server asks for
        working-directory: server-next
        env:
          PORTICO_MEDIA_MATRIX: '1'
        # One line per file and device, so the run shows what was converted. A skipped case is
        # a failure: the suite skips a sample this FFmpeg cannot make, and a bundle that has
        # lost an encoder must not pass by converting less.
        run: |
          go test ./internal/mediaengine -run '^TestMediaMatrix$' -count=1 -v > "$RUNNER_TEMP/matrix.log" 2>&1 && passed=1
          grep -E '^\s*(--- |PASS|FAIL|ok|panic)|_test.go:[0-9]+:' "$RUNNER_TEMP/matrix.log" || true
          if grep -qE '^\s*--- SKIP' "$RUNNER_TEMP/matrix.log"; then echo "a real-media case was skipped, so the bundle did not convert it"; exit 1; fi
          [ "${passed:-0}" = 1 ]
      - name: Every server test, media tests included, with the bundle as FFmpeg
        working-directory: server-next
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -vE '^ok ' ; exit "${PIPESTATUS[0]}"
