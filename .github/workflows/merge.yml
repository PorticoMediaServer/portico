name: Merge checks
# Approved PR and queue triggers. Repository Actions stay disabled until bootstrap publication. No push trigger.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      base:
        description: Existing comparison ref (required; fail closed)
        required: false
        type: string
      tier:
        description: Feedback tier
        type: choice
        options: [short, merge]
        default: short
      full:
        description: Bootstrap or full inventory (no base required)
        type: boolean
        default: false
      hosted_only:
        description: No-op; all jobs already use GitHub-hosted Ubuntu
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/native/package-lock.json
            apps/vega/package-lock.json
            apps/desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install typed ratchet owning lockfiles
        run: |
          for component in apps/native apps/vega apps/desktop; do
            (cd "$component" && npm ci --ignore-scripts --legacy-peer-deps --workspaces=false --no-audit --no-fund)
          done
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: python3 ci/source_guard.py
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/gitleaks-cache/gitleaks.tar.gz
          key: gitleaks-8.30.1-${{ hashFiles('ci/secret-scan.sh') }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: false
      - env:
          GITLEAKS_TARBALL_CACHE: ${{ runner.temp }}/gitleaks-cache/gitleaks.tar.gz
        run: bash ci/secret-scan.sh
      - name: Live ratchet comparison base
        id: ratchet_base
        env:
          CI_BASE: ${{ inputs.base }}
          CI_FULL_PLAN: ${{ inputs.full }}
        run: python3 ci/ratchet_base.py >> "$GITHUB_OUTPUT"
      - name: Engineering count ratchets
        env:
          PORTICO_RATCHET_BUDGET_SECONDS: '360'
          RATCHET_BASE: ${{ steps.ratchet_base.outputs.base }}
          RATCHET_PREDECESSOR: ${{ steps.ratchet_base.outputs.predecessor }}
          RATCHET_QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 ci/engineering_rules.py ${RATCHET_BASE:+--base "$RATCHET_BASE"} ${RATCHET_PREDECESSOR:+--predecessor "$RATCHET_PREDECESSOR"} ${RATCHET_QUEUE_HEAD:+--queue-head "$RATCHET_QUEUE_HEAD"}
      - name: Client-core API ownership ratchet
        env:
          CENSUS_BASE: ${{ steps.ratchet_base.outputs.base }}
          CENSUS_PREDECESSOR: ${{ steps.ratchet_base.outputs.predecessor }}
          CENSUS_QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: python3 ci/client_api_census.py ${CENSUS_BASE:+--base "$CENSUS_BASE"} ${CENSUS_PREDECESSOR:+--predecessor "$CENSUS_PREDECESSOR"} ${CENSUS_QUEUE_HEAD:+--queue-head "$CENSUS_QUEUE_HEAD"}
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      server_next: ${{ steps.plan.outputs.server_next }}
      go_matrix: ${{ steps.plan.outputs.go_matrix }}
      go: ${{ steps.plan.outputs.go }}
      js: ${{ steps.plan.outputs.js }}
      android: ${{ steps.plan.outputs.android }}
      js_matrix: ${{ steps.plan.outputs.js_matrix }}
      js_static: ${{ steps.plan.outputs.js_static }}
      js_static_matrix: ${{ steps.plan.outputs.js_static_matrix }}
    steps:
      - name: Runner hardware
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: |
            server/go.sum
            apikit/go.sum
      - id: plan
        env:
          CI_FULL_PLAN: ${{ inputs.full }}
          CI_TIER: ${{ github.event_name == 'merge_group' && 'merge' || inputs.tier || 'short' }}
          CI_BASE: ${{ inputs.base }}
        run: python3 ci/plan.py --tier "$CI_TIER"
      - env:
          CI_BASE: ${{ inputs.base }}
        run: python3 ci/commit_bylines.py
      - name: Plan hash pins
        env:
          CI_BASE: ${{ inputs.base }}
        run: python3 ci/plan_pins.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selection
          path: ci-plan.json
  server_next:
    needs: planner
    if: needs.planner.outputs.server_next == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server-next
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server-next/go.mod
          cache: true
          cache-dependency-path: server-next/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
  go_build:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: python3 ci/run.py build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playback-helper
          path: ci-tools/portico-server
          if-no-files-found: error
  go_vet_cross:
    # The merge tier tests on Linux only; this keeps macOS- and Windows-only compile errors
    # (in tests too) from first appearing in a release build. Static: nothing runs.
    needs: planner
    if: needs.planner.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, windows]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - run: python3 ci/run.py vet-cross --goos '${{ matrix.goos }}'
  decoder_sandbox:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    uses: ./.github/workflows/decoder-sandbox.yml
  go_tests:
    needs: planner
    if: needs.planner.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.go_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Runner hardware
        if: ${{ matrix.index == 0 }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: '**/go.sum'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - run: python3 ci/run.py download
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.reading_client == true
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install real reading-client integration dependencies
        if: matrix.reading_client == true
        run: |
          npm ci --no-audit --no-fund
          (cd packages/contracts && npm run build)
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --index '${{ matrix.index }}'
      - run: python3 ci/run.py go --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: go-${{ matrix.index }}
          path: ci-results/
  js:
    needs: planner
    if: needs.planner.outputs.js == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.js_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Runner hardware
        if: ${{ matrix.component == 'apps/native' && (matrix.index == null || matrix.index == 0) }}
        run: |
          echo "runner: $(nproc) cpu, $(free -g | awk '/Mem:/{print $2}') GiB"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ${{ matrix.component == 'apps/desktop' && 'apps/desktop/.node-version' || '.node-version' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
            website/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - name: FFmpeg package cache key
        id: aptkey
        run: echo "key=apt-ffmpeg-${ImageOS:-ubuntu}-${ImageVersion:-0}-$(date -u +%G-%V)-v1" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/portico-apt-ffmpeg
          key: ${{ steps.aptkey.outputs.key }}
          restore-keys: apt-ffmpeg-
      - env:
          COMPONENT: ${{ matrix.component }}
          PORTICO_CI_APT_CACHE: ${{ runner.temp }}/portico-apt-ffmpeg
        run: python3 ci/run.py ffmpeg --component "$COMPONENT" --index '${{ matrix.index }}'
      - name: Install owning lockfiles
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          npm ci
          case "$COMPONENT" in
            apps/*|website) (cd "$COMPONENT" && npm ci --legacy-peer-deps --workspaces=false) ;;
          esac
      - env:
          COMPONENT: ${{ matrix.component }}
        run: python3 ci/run.py js --component "$COMPONENT" --index '${{ matrix.index }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: js-${{ matrix.component == 'apps/native' && 'native' || matrix.component == 'apps/desktop' && 'desktop' || matrix.component == 'apps/vega' && 'vega' || matrix.component }}-${{ matrix.index }}
          path: ci-results/js/
          if-no-files-found: error
  js_static:
    needs: planner
    if: needs.planner.outputs.js_static == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.planner.outputs.js_static_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ${{ matrix.component == 'apps/desktop' && 'apps/desktop/.node-version' || '.node-version' }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json
            website/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - name: Install owning lockfiles
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          npm ci
          case "$COMPONENT" in
            apps/*|website) (cd "$COMPONENT" && npm ci --legacy-peer-deps --workspaces=false) ;;
          esac
      - env:
          COMPONENT: ${{ matrix.component }}
        run: python3 ci/run.py js-static --component "$COMPONENT"
  android:
    needs: planner
    if: needs.planner.outputs.android == 'true'
    uses: ./.github/workflows/android-tests.yml
  merge:
    name: ci/required
    if: ${{ !cancelled() }}
    needs: [planner, hygiene, server_next, go_build, go_vet_cross, go_tests, decoder_sandbox, js, js_static, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.planner.outputs.go == 'true'
        with:
          pattern: go-*
          path: ci-results/go
          merge-multiple: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.planner.outputs.js == 'true'
        with:
          pattern: js-*
          path: ci-results/js
          merge-multiple: false
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 ci/run.py aggregate --needs "$RESULTS"
