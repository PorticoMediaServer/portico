name: FFmpeg engine toolchain
on:
  workflow_dispatch:
    inputs:
      target:
        description: Engine target (all includes the four supported targets)
        type: choice
        default: all
        options: [all, windows-x64, linux-x64, linux-arm64, macos-arm64]
      allowColdDependencies:
        description: Permit a missing prefix cache only for an explicitly approved cold population
        type: boolean
        default: false
      controlsOnly:
        description: Run source/refusal controls without compiling an engine
        type: boolean
        default: false
      cacheControls:
        description: Exercise persistent cache transport with tiny fixtures only (never an engine)
        type: boolean
        default: false
      staticControlsOnly:
        description: Configure/graph/source checks without native object fixtures
        type: boolean
        default: false
      upstreamComparison:
        description: Read official upstream effective inventories only
        type: boolean
        default: false
      sourceCacheOnly:
        description: Seed and verify dependency source snapshots only; no compiler or engine
        type: boolean
        default: false
      cacheMigrationOnly:
        description: Main-only verified migration of retained engine payload caches to GHCR; no compiler
        type: boolean
        default: false
      replayRunId:
        description: Native-only development replay of the explicitly pinned producer run
        type: string
        default: ''
      reuseWindowsArtifact:
        description: Native-only development retest of the explicitly pinned Windows artifact
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ffmpeg-toolchain-${{ github.ref }}-${{ inputs.target || 'all' }}-${{ inputs.controlsOnly && 'controls' || 'build' }}
  cancel-in-progress: false
jobs:
  controls:
    if: github.repository == 'PorticoMediaServer/portico' && (!inputs.upstreamComparison || (inputs.reuseWindowsArtifact || inputs.replayRunId != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Allow the checked monorepo's long fixture paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - name: Configure and source graph fast gate before compiler jobs
        env: {PORTICO_NETWORK_BUILD_TOOL_CONTROL: '1', GH_TOKEN: '${{ github.token }}'}
        run: |
          python scripts/test-macos-dependency-cache.py
          python scripts/test-engine-prefix-cache.py
          python scripts/test-engine-registry-cache.py
          python scripts/test-build-engine.py
          python scripts/test-engine-final-cache.py
          python scripts/test-repeat-btbn-ffmpeg.py
          python scripts/test-assemble-engine.py
          python scripts/test-compiler-custody.py
          python scripts/test-native-engine-context.py
          python scripts/test-engine-artifact.py
          python scripts/test-no-rav1e.py
          python scripts/test-arm-rockchip-recipe.py
          python scripts/test-windows-libdovi-recipe.py
          python scripts/test-libdovi-runtime-inventory.py
          python scripts/test-engine-release-preflight.py
          python scripts/test-stage-engine-release.py
          python scripts/test-ci-ffmpeg-toolchain.py
          python scripts/test-engine-rebuild-batch.py
          python scripts/test-engine-cache-oci.py
          python scripts/test-engine-checkout.py
          python scripts/test-ffmpeg-build-tools.py
          python scripts/test-native-rust-tools.py
          python scripts/test-macos-source-checkout.py
          python scripts/test-macos-ffmpeg-source.py
          python scripts/test-macos-shaderc.py
          python scripts/test-macos-engine-runtime.py
          python scripts/test-macos-libdovi.py
          python scripts/test-macos-zvbi.py
          python scripts/test-ffmpeg-format-parity.py
          python scripts/test-capture-engine-prepack.py
          python scripts/test-ffmpeg-bzip2.py
          python scripts/test-preserve-ffmpeg-compilers.py
      - id: plan
        env:
          COLD_TARGET: ${{ inputs.target || 'all' }}
          REPLAY_RUN_ID: ${{ inputs.replayRunId }}
          REUSE_WINDOWS_ARTIFACT: ${{ inputs.reuseWindowsArtifact }}
          OTHER_MODES: ${{ inputs.controlsOnly || inputs.cacheControls || inputs.upstreamComparison || inputs.sourceCacheOnly || inputs.cacheMigrationOnly }}
        run: |
          if [[ "$REUSE_WINDOWS_ARTIFACT" == true && "$COLD_TARGET" != windows-x64 ]]; then
            echo 'Original Windows artifact reuse requires the Windows target' >&2
            exit 2
          fi
          if [[ -n "$REPLAY_RUN_ID" || "$REUSE_WINDOWS_ARTIFACT" == true ]]; then
            [[ "$OTHER_MODES" == false ]] || { echo 'Replay cannot enable compiler/control/cache modes' >&2; exit 2; }
            REPLAY_RUN_ID="${REPLAY_RUN_ID:-41346289584}"
            echo "matrix=$(python scripts/ci-ffmpeg-toolchain.py plan-replay --target "$COLD_TARGET" --run-id "$REPLAY_RUN_ID")" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(python scripts/ci-ffmpeg-toolchain.py plan --target "$COLD_TARGET")" >> "$GITHUB_OUTPUT"
          fi
  catalogue:
    if: github.repository == 'PorticoMediaServer/portico' && inputs.controlsOnly && !inputs.cacheControls && !inputs.upstreamComparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Allow the checked monorepo's long fixture paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache: false}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: server
        run: go mod download
      - env: {GOMAXPROCS: '2', GOFLAGS: '-p=2'}
        run: node --experimental-strip-types web/scripts/licences.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ffmpeg-licence-catalogue-${{ github.sha }}
          path: web/src/generated/licences.json
          retention-days: 7
  build:
    name: Build engine (${{ matrix.target }})
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    needs: controls
    if: ${{ !inputs.controlsOnly && !inputs.cacheControls && !inputs.upstreamComparison && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && !inputs.sourceCacheOnly && !inputs.cacheMigrationOnly }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.controls.outputs.matrix) }}
    runs-on: ${{ matrix.buildRunner }}
    permissions: {contents: read, actions: read, packages: write}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - name: Allow the checked monorepo's long fixture paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - name: Reclaim unused SDK space on this disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo python3 - <<'PY'
          from pathlib import Path
          import shutil
          for name in ('/usr/local/lib/android', '/usr/share/dotnet', '/opt/ghc', '/usr/local/.ghcup'):
              path = Path(name)
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
          PY
          df -h
      - name: Prepare Mac shell and archive tools
        if: runner.os == 'macOS'
        run: |
          brew install bash gnu-tar coreutils
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - id: dependency-cache-plan
        env: {ENGINE_TARGET: '${{ matrix.target }}'}
        run: python scripts/engine-dependency-cache.py plan --target "$ENGINE_TARGET" --directory "$RUNNER_TEMP/engine-stage-cache" --output "$GITHUB_OUTPUT"
      - name: Install the reviewed OCI transport
        run: python scripts/engine-cache-tools.py install --directory "$RUNNER_TEMP/engine-cache-tools"
      - name: Authenticate disposable OCI cache transport
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-tools.py login --directory "$RUNNER_TEMP/engine-cache-tools"
      - name: Restore completed dependency checkpoints from GHCR
        id: dependency-restore
        if: matrix.target == 'linux-x64' || matrix.target == 'macos-arm64'
        run: python scripts/engine-cache-oci.py restore --target "${{ matrix.target }}" --kind stages --directory "$RUNNER_TEMP/engine-stage-cache" --work "$RUNNER_TEMP/engine-cache-transport" --output "$GITHUB_OUTPUT"
      - name: Refuse an accidental cold native-prefix rebuild
        if: (matrix.target == 'linux-x64' || matrix.target == 'macos-arm64') && !inputs.allowColdDependencies
        env: {CACHE_HIT: '${{ steps.dependency-restore.outputs.hit }}'}
        run: '[[ "$CACHE_HIT" == true ]] || { echo "No compatible retained prefix; cold population requires explicit approval" >&2; exit 2; }'
      - id: dependency-cache-before
        run: python scripts/engine-cache-oci.py fingerprint --target "${{ matrix.target }}" --kind stages --directory "$RUNNER_TEMP/engine-stage-cache" --work "$RUNNER_TEMP/engine-cache-transport" --output "$GITHUB_OUTPUT"
      - name: Restore exact BtbN source snapshots from GHCR
        if: matrix.target == 'windows-x64' || matrix.target == 'linux-arm64'
        run: python scripts/engine-cache-oci.py restore --target "${{ matrix.target }}" --kind sources --directory "$RUNNER_TEMP/engine-download-cache" --work "$RUNNER_TEMP/engine-cache-transport"
      - id: source-before
        if: matrix.target == 'windows-x64' || matrix.target == 'linux-arm64'
        run: python scripts/engine-cache-oci.py fingerprint --target "${{ matrix.target }}" --kind sources --directory "$RUNNER_TEMP/engine-download-cache" --work "$RUNNER_TEMP/engine-cache-transport" --output "$GITHUB_OUTPUT"
      - name: Seed exact source bytes without rebuilding dependencies
        if: matrix.target == 'windows-x64' || matrix.target == 'linux-arm64'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/seed-engine-download-cache.py --target "${{ matrix.target }}" --store "$RUNNER_TEMP/engine-download-cache" --work "$RUNNER_TEMP/engine-source-seed"
      - name: Authenticate the explicit BuildKit cache writer
        if: matrix.target == 'windows-x64' || matrix.target == 'linux-arm64'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build once from pinned source, retaining custody and cold timing
        id: engine-build
        env:
          ENGINE_TARGET: ${{ matrix.target }}
          PORTICO_ENGINE_DOWNLOAD_CACHE: ${{ runner.temp }}/engine-download-cache
          PORTICO_ENGINE_STAGE_CACHE: ${{ runner.temp }}/engine-stage-cache
          PORTICO_ENGINE_MAC_COMPILER: ${{ steps.dependency-cache-plan.outputs.compiler }}
          PORTICO_ENGINE_REGISTRY_CACHE: ${{ (matrix.target == 'windows-x64' || matrix.target == 'linux-arm64') && '1' || '0' }}
          PORTICO_ENGINE_CACHE_WRITE: '1'
        run: python scripts/ci-ffmpeg-toolchain.py build --target "$ENGINE_TARGET" --work "$RUNNER_TEMP/engine-cold"
      - name: Capture completed source snapshots after interruption or failure
        if: always() && (matrix.target == 'windows-x64' || matrix.target == 'linux-arm64')
        env: {ENGINE_TARGET: '${{ matrix.target }}'}
        run: |
          recipe="$RUNNER_TEMP/engine-cold/state/recipe"
          if [[ "$ENGINE_TARGET" == linux-arm64 ]]; then recipe="$RUNNER_TEMP/engine-cold/.scratch/hardware-r29/ffmpeg-build/linux-arm64/recipe"; fi
          if [[ -d "$recipe/.cache/downloads" ]]; then
            python scripts/engine-download-cache.py save --recipe "$recipe" --store "$RUNNER_TEMP/engine-download-cache"
          fi
      - name: Retain exact source snapshots in GHCR even after a failed build
        if: always() && github.ref == 'refs/heads/main' && (matrix.target == 'windows-x64' || matrix.target == 'linux-arm64')
        run: python scripts/engine-cache-oci.py save --target "${{ matrix.target }}" --kind sources --directory "$RUNNER_TEMP/engine-download-cache" --work "$RUNNER_TEMP/engine-cache-transport" --before "${{ steps.source-before.outputs.snapshot }}"
      - name: Retain completed stage checkpoints in GHCR even after a failed build
        if: always() && github.ref == 'refs/heads/main' && (matrix.target == 'linux-x64' || matrix.target == 'macos-arm64')
        run: python scripts/engine-cache-oci.py save --target "${{ matrix.target }}" --kind stages --directory "$RUNNER_TEMP/engine-stage-cache" --work "$RUNNER_TEMP/engine-cache-transport" --before "${{ steps.dependency-cache-before.outputs.snapshot }}"
      - name: Retire OCI cache authentication
        if: always()
        run: python scripts/engine-cache-tools.py logout --directory "$RUNNER_TEMP/engine-cache-tools"
      - name: Retire dependency cache authentication
        if: always() && (matrix.target == 'windows-x64' || matrix.target == 'linux-arm64')
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && runner.os == 'macOS'
        with:
          name: engine-prepack-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/engine-cold/prepack/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-cold-evidence-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/engine-cold/evidence/**/*.json
            ${{ runner.temp }}/engine-cold/evidence/**/*.log
            ${{ runner.temp }}/engine-cache-transport/*.json
            ${{ runner.temp }}/engine-cache-tools/receipt.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.engine-build.outcome == 'success' }}
        with:
          name: engine-cold-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/engine-cold/product/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
  native-plan:
    needs: [controls, build]
    if: always() && needs.controls.result == 'success' && !inputs.controlsOnly && !inputs.cacheControls && !inputs.upstreamComparison && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && !inputs.sourceCacheOnly && !inputs.cacheMigrationOnly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      available: ${{ steps.plan.outputs.available }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_TARGET: ${{ inputs.target || 'all' }}
          ENGINE_BUILD_RESULT: ${{ needs.build.result }}
        run: |
          python scripts/ci-ffmpeg-toolchain.py artifact-pages --run-id "$GITHUB_RUN_ID" --artifacts "$RUNNER_TEMP/engine-artifact-metadata.json"
          python scripts/ci-ffmpeg-toolchain.py native-plan --target "$ENGINE_TARGET" --build-result "$ENGINE_BUILD_RESULT" --artifacts "$RUNNER_TEMP/engine-artifact-metadata.json" --work "$RUNNER_TEMP/engine-native-plan" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-native-plan-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/engine-native-plan/*.json
          retention-days: 14
          if-no-files-found: warn
  native:
    name: Native engine gates (${{ matrix.target }})
    needs: [controls, native-plan]
    if: always() && needs.controls.result == 'success' && needs.native-plan.result == 'success' && needs.native-plan.outputs.available == 'true'
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-plan.outputs.matrix) }}
    runs-on: ${{ matrix.nativeRunner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Allow the checked monorepo's long fixture paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - name: Verify checkout contract bytes before native qualification
        run: python scripts/test-engine-checkout.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ matrix.artifactId }}
          merge-multiple: true
          path: ${{ runner.temp }}/engine-transfer
      - name: Verify exact-run bytes and run matching native gates
        env:
          ENGINE_TARGET: ${{ matrix.target }}
        run: python scripts/ci-ffmpeg-toolchain.py native --target "$ENGINE_TARGET" --transfer "$RUNNER_TEMP/engine-transfer" --work "$RUNNER_TEMP/engine-native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-cold-native-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/engine-native/*.json
            ${{ runner.temp }}/engine-native/gates/*.json
            ${{ runner.temp }}/engine-native/gates/*.log
          retention-days: 14
          if-no-files-found: warn

  registry-cache-control:
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    if: inputs.cacheControls && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && github.repository == 'PorticoMediaServer/portico'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - name: Authenticate the tiny cache control writer
        env: {GH_TOKEN: '${{ github.token }}'}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Prove cold import, two independent cache hits, exact invalidation and fresh terminal builds
        env:
          PORTICO_ENGINE_REGISTRY_CACHE: '1'
          PORTICO_ENGINE_CACHE_WRITE: '1'
          PORTICO_REGISTRY_CACHE_CONTROL: '1'
          PORTICO_REGISTRY_CACHE_CONTROL_ROOT: ghcr.io/porticomediaserver/ffmpeg-cache-control
        run: python scripts/test-engine-registry-cache.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: registry-cache-control-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/portico-registry-cache-control.json
            ${{ runner.temp }}/registry-control-*/*.log
          retention-days: 7
      - if: always()
        run: docker logout ghcr.io
  prefix-cache-seed:
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    if: inputs.cacheControls && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix: {runner: [ubuntu-24.04, macos-15]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - id: production-cache-plan
        env:
          ENGINE_TARGET: ${{ matrix.runner == 'ubuntu-24.04' && 'linux-x64' || 'macos-arm64' }}
        run: python scripts/engine-dependency-cache.py plan --target "$ENGINE_TARGET" --directory "$RUNNER_TEMP/prefix-cache-plan" --output "$GITHUB_OUTPUT"
      - run: python scripts/test-engine-prefix-cache.py
      - run: python scripts/control-engine-prefix-cache.py seed --work "$RUNNER_TEMP/prefix-cache-control" --cache "$RUNNER_TEMP/prefix-cache-store"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/prefix-cache-store
          key: engine-prefix-proof-v1-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prefix-cache-seed-${{ matrix.runner }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/prefix-cache-seed.json
            ${{ runner.temp }}/prefix-cache-plan/transport-context.json
          retention-days: 7
  prefix-cache-reuse:
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    needs: prefix-cache-seed
    if: inputs.cacheControls && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix: {runner: [ubuntu-24.04, macos-15]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/prefix-cache-store
          key: engine-prefix-proof-v1-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - run: python scripts/control-engine-prefix-cache.py reuse --work "$RUNNER_TEMP/prefix-cache-control" --cache "$RUNNER_TEMP/prefix-cache-store"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prefix-cache-reuse-${{ matrix.runner }}-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/prefix-cache-reuse.json
          retention-days: 7

  source-cache-seed-control:
    needs: controls
    permissions: {contents: read, actions: read, packages: read}
    if: inputs.sourceCacheOnly && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && github.repository == 'PorticoMediaServer/portico'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    strategy:
      fail-fast: false
      matrix: {target: [windows-x64, linux-arm64]}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - run: python scripts/engine-cache-tools.py install --directory "$RUNNER_TEMP/engine-cache-tools"
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-tools.py login --directory "$RUNNER_TEMP/engine-cache-tools"
      - run: python scripts/engine-cache-oci.py restore --target "${{ matrix.target }}" --kind sources --directory "$RUNNER_TEMP/engine-download-cache" --work "$RUNNER_TEMP/engine-source-seed"
      - name: Restore only pinned corresponding-source snapshots, never binaries
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/seed-engine-download-cache.py --target "${{ matrix.target }}" --store "$RUNNER_TEMP/engine-download-cache" --work "$RUNNER_TEMP/engine-source-seed"
      - if: always()
        run: python scripts/engine-cache-tools.py logout --directory "$RUNNER_TEMP/engine-cache-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-cache-seed-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/engine-source-seed/*.json
          retention-days: 14
          if-no-files-found: warn
  native-retry:
    needs: controls
    if: (inputs.reuseWindowsArtifact || inputs.replayRunId != '') && !inputs.controlsOnly && !inputs.upstreamComparison && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.controls.outputs.matrix) }}
    runs-on: ${{ matrix.nativeRunner }}
    timeout-minutes: 90
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    defaults:
      run: {shell: bash}
    steps:
      - name: Preserve exact checked bytes on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - if: runner.os == 'Windows'
        run: python scripts/test-engine-checkout.py
      - name: Verify the pinned original producer and run native gates without a compiler
        env: {GH_TOKEN: '${{ github.token }}', REPLAY_RUN_ID: '${{ inputs.replayRunId }}'}
        run: python scripts/ci-ffmpeg-toolchain.py native-retry --target "${{ matrix.target }}" --work "$RUNNER_TEMP/development-native-retry"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-development-native-retry-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/development-native-retry/evidence/*.json
            ${{ runner.temp }}/development-native-retry/evidence/gates/*.json
            ${{ runner.temp }}/development-native-retry/evidence/gates/*.log
          retention-days: 14
          if-no-files-found: warn
  windows-checkout-control:
    if: inputs.controlsOnly && !inputs.upstreamComparison && github.repository == 'PorticoMediaServer/portico'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run: {shell: bash}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: original-checkout, persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - name: Record the runner's original checkout filter
        run: python original-checkout/scripts/test-engine-checkout.py --inspect --report "$RUNNER_TEMP/original-checkout.json"
      - name: Select exact bytes before a fresh checkout, as in native qualification
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', path: fixed-checkout, persist-credentials: false}
      - name: Exercise both filter cases and verify the fresh checkout
        run: |
          python fixed-checkout/scripts/test-engine-checkout.py
          python fixed-checkout/scripts/test-engine-checkout.py --inspect --report "$RUNNER_TEMP/fixed-checkout.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-checkout-control-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/*-checkout.json
          retention-days: 7
  system-library-control:
    if: inputs.controlsOnly && !inputs.staticControlsOnly && !inputs.upstreamComparison && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix: {runner: [macos-15]}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Allow the checked monorepo's long fixture paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - run: python scripts/test-engine-rebuild-batch.py
      - run: python scripts/control-macos-system-libs.py --work "$RUNNER_TEMP/format-system-control"
      - run: python scripts/control-macos-transpose-source.py --work "$RUNNER_TEMP/transpose-source-control"
      - name: Prove final disc identity after native Mach-O relocation
        env: {PORTICO_RUNTIME_FIXTURE_REPORT: '${{ runner.temp }}/format-system-control/runtime-relocation.json'}
        run: python scripts/test-macos-engine-runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sdk-format-control-${{ matrix.runner }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/format-system-control/*.json
            ${{ runner.temp }}/transpose-source-control/*.json
            ${{ runner.temp }}/transpose-source-control/*.log
          retention-days: 7

  upstream-comparison:
    if: inputs.upstreamComparison && !(inputs.reuseWindowsArtifact || inputs.replayRunId != '') && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-x64, runner: windows-2025}
          - {target: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Allow the checked monorepo's long fixture paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --show-origin --get-regexp 'core\.(autocrlf|eol)'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - shell: bash
        env: {COMPARE_TARGET: '${{ matrix.target }}'}
        run: python scripts/inspect-jellyfin-autodetect.py --target "$COMPARE_TARGET" --work "$RUNNER_TEMP/upstream-comparison"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upstream-effective-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/upstream-comparison/*.json
          retention-days: 7

  payload-cache-control:
    needs: controls
    if: inputs.cacheControls && !inputs.cacheMigrationOnly && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: macos-arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    permissions: {contents: read, actions: read, packages: write}
    timeout-minutes: 15
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - run: python scripts/engine-cache-tools.py install --directory "$RUNNER_TEMP/engine-cache-tools"
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-tools.py login --directory "$RUNNER_TEMP/engine-cache-tools"
      - run: python scripts/control-engine-cache-oci.py --target "${{ matrix.target }}" --work "$RUNNER_TEMP/payload-cache-control"
      - if: always()
        run: python scripts/engine-cache-tools.py logout --directory "$RUNNER_TEMP/engine-cache-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: payload-cache-control-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/payload-cache-control/*control.json
            ${{ runner.temp }}/engine-cache-tools/receipt.json
          retention-days: 7

  cache-migration:
    needs: controls
    if: inputs.cacheMigrationOnly && github.ref == 'refs/heads/main' && github.repository == 'PorticoMediaServer/portico'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.controls.outputs.matrix) }}
    runs-on: ${{ matrix.buildRunner }}
    permissions: {contents: read, actions: write, packages: write}
    timeout-minutes: 40
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.13.17'}
      - if: runner.os == 'macOS'
        run: |
          brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - id: selection
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-migration.py plan --target "${{ matrix.target }}" --work "$RUNNER_TEMP/cache-migration" --output "$GITHUB_OUTPUT"
      - id: legacy
        if: steps.selection.outputs.available == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/${{ steps.selection.outputs.kind == 'sources' && 'engine-download-cache' || 'engine-stage-cache' }}
          key: ${{ steps.selection.outputs.key }}
          fail-on-cache-miss: true
      - if: steps.selection.outputs.available == 'true'
        run: python scripts/engine-cache-tools.py install --directory "$RUNNER_TEMP/engine-cache-tools"
      - if: steps.selection.outputs.available == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-tools.py login --directory "$RUNNER_TEMP/engine-cache-tools"
      - name: Copy and re-read the full checkpoint before removing any Actions cache
        if: steps.selection.outputs.available == 'true'
        run: |
          kind="${{ steps.selection.outputs.kind }}"
          directory="$RUNNER_TEMP/engine-stage-cache"
          [[ "$kind" != sources ]] || directory="$RUNNER_TEMP/engine-download-cache"
          python scripts/engine-cache-oci.py save --target "${{ matrix.target }}" --kind "$kind" --directory "$directory" --work "$RUNNER_TEMP/cache-migration"
      - name: Delete only engine cache entries with a verified OCI replacement
        if: steps.selection.outputs.available == 'true'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-migration.py cleanup --target "${{ matrix.target }}" --work "$RUNNER_TEMP/cache-migration" --transport "$RUNNER_TEMP/cache-migration/${{ steps.selection.outputs.kind }}-save.json"
      - if: always()
        run: python scripts/engine-cache-tools.py logout --directory "$RUNNER_TEMP/engine-cache-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cache-migration-${{ matrix.target }}-${{ github.sha }}-NOT-FOR-USE
          path: |
            ${{ runner.temp }}/cache-migration/*.json
            ${{ runner.temp }}/engine-cache-tools/receipt.json
          retention-days: 14
  cache-budget:
    needs: cache-migration
    if: inputs.cacheMigrationOnly && github.ref == 'refs/heads/main' && github.repository == 'PorticoMediaServer/portico'
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    timeout-minutes: 5
    env: {PORTICO_ENGINE_BUILD_CONTEXT: development}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: python scripts/engine-cache-migration.py budget --work "$RUNNER_TEMP/cache-budget"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cache-budget-${{ github.sha }}-NOT-FOR-USE
          path: ${{ runner.temp }}/cache-budget/*.json
          retention-days: 14
