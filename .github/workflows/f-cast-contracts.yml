name: F recover canonical Cast contract bundle
'on':
  push:
    branches:
    - rebuild/F-home-evidence-r1
permissions:
  contents: read
jobs:
  generate:
    if: contains(github.event.head_commit.message, 'F cast contracts')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
        ref: 07ba746f397932f6c55e72f3cd9c8ace4c7751a4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
        cache: npm
    - run: 'npm ci

        node scripts/cast/generate.mjs

        sha256sum server/receiver/cast/contracts.js

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: F-browse-cast-contracts
        path: server/receiver/cast/contracts.js
        retention-days: 7
