name: Release published

# Runs when Justin publishes a draft made by release.yml. It writes the build-provenance
# attestations (public, in the Sigstore log) and pushes the container image the draft carries
# (an OCI archive) to GHCR under the release's version; neither happens before he publishes.
# Other releases (lane D's FFmpeg engine releases, any prerelease) are skipped.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  attest:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: The published files, checked against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with: {subject-path: 'assets/*'}

  image:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Push the image the release carries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          mkdir -p image
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'portico-server-image*.oci.tar' --dir image
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir image
          (cd image && grep -E ' portico-server-image[^ ]*\.oci\.tar$' SHA256SUMS | sha256sum -c -)
          archive="$(ls image/portico-server-image*.oci.tar)"
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --all "oci-archive:$archive" "docker://ghcr.io/porticomediaserver/portico-server:$version"
          # The install guide's `latest` follows the newest published (non-prerelease) release.
          skopeo copy --all "docker://ghcr.io/porticomediaserver/portico-server:$version" "docker://ghcr.io/porticomediaserver/portico-server:latest"
          # GHCR has no API to change a package's visibility. The first push creates the package;
          # make it public once in its settings (Package settings > Change visibility).
          visibility="$(gh api orgs/PorticoMediaServer/packages/container/portico-server -q .visibility 2>/dev/null || echo unknown)"
          echo "ghcr.io/porticomediaserver/portico-server:$version pushed; package visibility: $visibility"
          if [ "$visibility" != public ]; then echo "::warning::The portico-server package is $visibility. Make it public once in its GitHub package settings."; fi
