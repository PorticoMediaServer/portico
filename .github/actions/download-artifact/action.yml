name: Download artifact with one retry
description: Retry only the artifact transfer; a second failure fails the step.
inputs:
  name:
    description: Artifact name
    required: false
  pattern:
    description: Artifact name pattern
    required: false
  path:
    description: Extraction directory
    required: false
  merge-multiple:
    description: Merge matched artifacts into one directory
    default: 'false'
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
    - if: steps.first.outcome == 'failure'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ inputs.path }}
        merge-multiple: ${{ inputs.merge-multiple }}
